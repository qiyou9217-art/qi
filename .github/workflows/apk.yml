name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 固定签名：以后每次打出的安装包都能直接覆盖更新，不会丢数据
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: mkdir -p www && cp index.html www/index.html
      - run: npx cap add android
      - run: pip install pillow && python3 make_icons.py
      - run: python3 patch_manifest.py
      # 先带「后台保活」组件打包；如果这个组件和当前版本不合、打包失败，就自动去掉它再打一次
      - id: withbg
        continue-on-error: true
        run: |
          npm install @anuradev/capacitor-background-mode --legacy-peer-deps
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - if: steps.withbg.outcome == 'failure'
        run: |
          npm uninstall @anuradev/capacitor-background-mode --legacy-peer-deps || true
          npx cap sync android
          cd android
          ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: celyra-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

 }
 prev5(r,st,c,back);
 if(st!=='wx'||c.members)return;
 const cd=r.querySelector('#cd'),ml=r.querySelector('#ml'),lb=r.querySelector('.lb'),ib=r.querySelector('.ib'),ta=r.querySelector('.pl2 input'),em=r.querySelector('#em');
 if(!cd||!ml||!lb||!ib||!ta||!em)return;
 r.dataset.cid=c.id;

 /* 消息区：装饰完再定位滚动，新消息才播放动画，图片加载后保持贴底 */
 let wasB=true,lastTop=0,cnt=0;
 decor6(r,c);cnt=ml.querySelectorAll('.rw').length;ml.scrollTop=ml.scrollHeight;
 ml.addEventListener('scroll',()=>{wasB=ml.scrollHeight-ml.scrollTop-ml.clientHeight<48;lastTop=ml.scrollTop});
 ml.addEventListener('load',()=>{if(wasB)ml.scrollTop=ml.scrollHeight},true);
 new MutationObserver(()=>{
  decor6(r,c);
  const n=ml.querySelectorAll('.rw').length;
  if(n>cnt){ml.scrollTop=ml.scrollHeight;const l=ml.querySelector('.rw:last-child .mb');if(l)l.classList.add('nw')}
  else ml.scrollTop=wasB?ml.scrollHeight:lastTop;
  cnt=n;
 }).observe(ml,{childList:true});

 /* 表情包面板 */
 let sk=null,curG='recent',multi=null,multiAt=0;
 const repaint=()=>{const x=r.querySelector('#cd .mbar [data-a="x"]');if(x)x.click()};
 const closeSk=imm=>{
  if(!sk)return;const p=sk;sk=null;multi=null;cd.classList.remove('mp');
  if(imm)p.remove();else{p.classList.remove('on');setTimeout(()=>p.remove(),330)}};
 const sendStk=id=>{
  const it=lib().items.find(i=>i.id===id);if(!it)return;
  lib().recent=[id,...lib().recent.filter(x=>x!==id)].slice(0,30);
  const H=S.chats['wx'+c.id]=S.chats['wx'+c.id]||[];
  H.push({r:'me',c:'【表情包】'+it.name,stk:it.src,t:Date.now()});delete S.hidden[c.id];save();
  repaint();if(curG==='recent')paintSk();
  if(c.auto)setTimeout(()=>{const b=r.querySelector('#rv');if(b)b.click()},80)};
 const renameG=gid=>{
  const g=lib().groups.find(x=>x.id===gid);if(!g)return;
  const o=modal(r,'重命名分组','<input id="gn" placeholder="分组名称">',o=>{const v=o.querySelector('#gn').value.trim();if(!v)return false;g.name=v;save();paintSk()});
  o.querySelector('#gn').value=g.name};
 const gear=()=>{
  const o=sheet(r,'<h3>添加表情包</h3><div class="op" id="s1">单条添加</div><div class="op" id="s2">批量添加</div>');
  const done=gid=>{curG=gid;paintSk()};
  o.querySelector('#s1').onclick=()=>{o.remove();addOne(r,curG,done)};
  o.querySelector('#s2').onclick=()=>{o.remove();addBatch(r,curG,done)}};
 const paintSk=()=>{
  if(!sk)return;
  const y=sk.querySelector('.skb')?sk.querySelector('.skb').scrollTop:0,x=sk.querySelector('.skg')?sk.querySelector('.skg').scrollLeft:0;
  const D=lib(),tabs=[['recent','最近使用'],...D.groups.map(g=>[g.id,g.name])];
  if(!tabs.some(t=>t[0]===curG))curG='recent';
  const items=curG==='recent'?D.recent.map(id=>D.items.find(i=>i.id===id)).filter(Boolean):D.items.filter(i=>i.gid===curG);
  sk.classList.toggle('sm',!!multi);
  sk.innerHTML=`<div class="skt"><div class="skg">${tabs.map(([id,n])=>`<b data-g="${id}" class="${id===curG?'on':''}">${esc(n)}</b>`).join('')}</div><div class="skc" id="skc">${svg(P.settings)}</div></div>
  <div class="skb">${items.map(i=>{const s=multi&&multi.has(i.id);return `<div class="sti${s?' sel':''}" data-id="${i.id}"><div class="th5"><img src="${esc(i.src)}" draggable="false"></div><i class="cb5${s?' on':''}">${s?'✓':''}</i><span>${esc(i.name)}</span></div>`}).join('')||`<p class="tip" style="grid-column:1/-1;text-align:center;margin-top:30px">${curG==='recent'?'还没有最近使用的表情包，点右上角齿轮添加':'这个分组还没有表情包，点右上角齿轮添加'}</p>`}</div>
  ${multi?`<div class="skbar"><span>已选择 ${multi.size} 项</span><button class="del">批量删除</button><button class="cn">取消</button></div>`:''}`;
  sk.querySelector('.skb').scrollTop=y;sk.querySelector('.skg').scrollLeft=x;
  sk.querySelector('#skc').onclick=gear;
  sk.querySelectorAll('.skg b').forEach(b=>{
   let t,f;
   b.onclick=()=>{if(f){f=0;return}curG=b.dataset.g;paintSk()};
   if(b.dataset.g==='recent')return;
   b.onpointerdown=()=>{f=0;t=setTimeout(()=>{f=1;renameG(b.dataset.g)},500)};
   ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(t)));
   b.oncontextmenu=e=>{e.preventDefault()}});
  sk.querySelectorAll('.sti').forEach(e=>{
   let t,f;const id=e.dataset.id;
   e.onclick=()=>{
    if(f){f=0;return}
    if(multi){multi.has(id)?multi.delete(id):multi.add(id);if(!multi.size)multi=null;paintSk()}
    else sendStk(id)};
   e.onpointerdown=()=>{f=0;if(multi)return;t=setTimeout(()=>{f=1;navigator.vibrate&&navigator.vibrate(12);multi=new Set([id]);multiAt=Date.now();paintSk()},500)};
   ['pointerup','pointerleave','pointercancel'].forEach(ev=>e.addEventListener(ev,()=>clearTimeout(t)));
   e.oncontextmenu=ev=>ev.preventDefault()});
  const del=sk.querySelector('.skbar .del'),cn=sk.querySelector('.skbar .cn');
  if(cn)cn.onclick=()=>{multi=null;paintSk()};
  if(del)del.onclick=()=>modal(r,'批量删除',`<p class="tip">确定从表情库中删除选中的 ${multi.size} 个表情包吗？所有聊天里都将不再可用。</p>`,()=>{
   const ids=multi;D.items=D.items.filter(i=>!ids.has(i.id));D.recent=D.recent.filter(x=>!ids.has(x));multi=null;save();paintSk()})};
 const openSk=()=>{
  if(cd.querySelector('.mpn:not(.sk)'))lb.click();
  sk=document.createElement('div');sk.className='mpn sk';
  ib.after(sk);cd.classList.add('mp');paintSk();
  sk.onclick=e=>{
   if(!multi||Date.now()-multiAt<500)return;
   if(e.target.closest('.sti,.skbar,.skt'))return;
   multi=null;paintSk()};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(sk)sk.classList.add('on')}));
  setTimeout(()=>{if(wasB)ml.scrollTop=ml.scrollHeight},340)};
 em.onclick=()=>sk?closeSk():openSk();
 lb.addEventListener('click',()=>closeSk(true));
 ml.addEventListener('click',()=>closeSk());
 ta.addEventListener('focus',()=>closeSk());
};
})();
</script>

<script>
(()=>{
/* ===== 工具 ===== */
const base=u=>String(u||'').trim().replace(/\/+$/,'');
const js=(o,st=200)=>new Response(JSON.stringify(o),{status:st,headers:{'Content-Type':'application/json'}});
const toB64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const sheet=(r,html)=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh">${html}</div>`;r.append(o);o.onclick=e=>e.target===o&&o.remove();return o};
const unzip=async(buf,want)=>{
 const b=new Uint8Array(buf),dv=new DataView(b.buffer);
 let e=b.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw'文件格式不对';
 let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);
 for(let i=0;i<n;i++){
  const cm=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(b.slice(p+46,p+46+nl));
  if(want(name)){
   const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=b.slice(st,st+cs);
   if(cm===0)return data;
   if(typeof DecompressionStream==='undefined')throw'当前浏览器不支持解压，请改用 txt';
   return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  }
  p+=46+nl+xl+cl;
 }
 throw'压缩包里没有找到内容';
};
const readText=async f=>{
 if(/\.docx$/i.test(f.name)){
  const x=new TextDecoder().decode(await unzip(await f.arrayBuffer(),n=>n==='word/document.xml'));
  return x.replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&').trim();
 }
 return (await f.text()).trim();
};

/* ===== 请求拦截：温度 / 流式输出 / 生图连接方式、尺寸、提示词 ===== */
const f0=window.fetch.bind(window);
const OAI=(m,s)=>/gpt-image/.test(m||'')?{'1:1':'1024x1024','3:4':'1024x1536','3:2':'1536x1024','2:3':'1024x1536'}[s]:{'1:1':'1024x1024','3:4':'1024x1792','3:2':'1792x1024','2:3':'1024x1792'}[s];
const CSZ={'1:1':'1024x1024','3:4':'768x1024','3:2':'1536x1024','2:3':'1024x1536'};
const NSZ={'1:1':[1024,1024],'3:4':[896,1152],'3:2':[1216,832],'2:3':[832,1216]};
const findInd=()=>{
 const l=document.querySelectorAll('#ml .rc:last-child,.scl .sl.o:last-child'),el=l[l.length-1];
 if(el&&!el.dataset.cl&&/正在输入|^…$/.test(el.textContent)){el.dataset.cl=1;return el}return null};
window.fetch=async function(u,o){
 if(typeof u!=='string'||!o||typeof o.body!=='string')return f0(u,o);
 let b;try{b=JSON.parse(o.body)}catch(e){return f0(u,o)}

 /* 生图 */
 if(/\/images\/generations$/.test(u)&&S.imgApi){
  const I=S.imgApi,sz=I.size||'1:1',prompt=(I.pos?I.pos+', ':'')+b.prompt;
  if(I.mode==='novelai'){
   const [w,h]=NSZ[sz]||NSZ['1:1'];
   const r=await f0('https://image.novelai.net/ai/generate-image',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+I.key},body:JSON.stringify({input:prompt,model:I.model||'nai-diffusion-3',action:'generate',parameters:{width:w,height:h,scale:5,sampler:'k_euler',steps:28,n_samples:1,seed:Math.floor(Math.random()*4e9),negative_prompt:I.neg||'',qualityToggle:true,ucPreset:0}})});
   if(!r.ok)return js({error:{message:'NovelAI 返回 '+r.status}},r.status);
   const png=await unzip(await r.arrayBuffer(),n=>/\.png$/i.test(n));
   return js({data:[{b64_json:toB64(png)}]});
  }
  if(I.mode==='openai'){b.prompt=prompt;b.size=OAI(b.model,sz)||b.size;return f0('https://api.openai.com/v1/images/generations',{...o,body:JSON.stringify(b)})}
  b.prompt=prompt;b.size=CSZ[sz]||b.size;if(I.neg)b.negative_prompt=I.neg;if(I.provider==='siliconflow')b.image_size=b.size;
  const res=await f0(u,{...o,body:JSON.stringify(b)});
  try{const j=await res.clone().json();if(j&&j.images&&!j.data){j.data=j.images;return js(j,res.status)}}catch(e){}
  return res;
 }

 /* 对话：温度 + 流式 */
 if(/\/chat\/completions$/.test(u)){
  const A=S.api;if(A.temp!=null&&b.temperature===undefined)b.temperature=+A.temp;
  const ind=A.stream&&!b.stream?findInd():null;
  if(!ind)return f0(u,{...o,body:JSON.stringify(b)});
  try{
   const res=await f0(u,{...o,body:JSON.stringify({...b,stream:true})});
   if(!res.ok||!res.body)throw 0;
   ind.classList.add('stm');
   const rd=res.body.getReader(),dec=new TextDecoder();let buf='',full='';
   for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){
     const t=l.trim();if(!t.startsWith('data:'))continue;const d=t.slice(5).trim();if(d==='[DONE]')continue;
     try{const j=JSON.parse(d),x=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
      if(x){full+=x;ind.ind.textContent=full.replace(/\s*<\|message\|>\s*/g,'\n\n');const p=ind.parentElement;if(p)p.scrollTop=p.scrollHeight}}catch(e){}
    }
   }
   if(!full)throw 0;
   return js({choices:[{message:{content:full}}]});
  }catch(e){ind.classList.remove('stm');ind.dataset.cl='';return f0(u,{...o,body:JSON.stringify(b)})}
 }
 return f0(u,o);
};

/* ===== 时间感知：让 AI 知道当前北京时间、星期，以及你们上次聊到什么时候 ===== */
const ai6=window.ai;
const WD7=['日','一','二','三','四','五','六'];
const bjp=t=>{const o={};new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date(t)).forEach(x=>o[x.type]=+x.value);
 if(o.hour===24)o.hour=0;o.wd=new Date(Date.UTC(o.year,o.month-1,o.day)).getUTCDay();o.dn=Math.floor(Date.UTC(o.year,o.month-1,o.day)/864e5);return o};
const hm7=o=>String(o.hour).padStart(2,'0')+':'+String(o.minute).padStart(2,'0');
const per7=h=>h<5?'凌晨':h<9?'早上':h<12?'上午':h<14?'中午':h<18?'下午':h<23?'晚上':'深夜';
const dw7=k=>k<=0?'今天':k===1?'昨天':k===2?'前天':k+'天前';
const dur7=ms=>{const m=Math.round(ms/60000);return m<60?m+'分钟':m<2880?Math.round(m/60)+'小时':Math.round(m/1440)+'天'};
const timeCtx=c=>{
 const n=Date.now(),N=bjp(n);
 let t=`\n⟦时间⟧【当前时间】现在是北京时间 ${N.year}年${N.month}月${N.day}日 星期${WD7[N.wd]} ${per7(N.hour)}${hm7(N)}。请以此为准判断此刻是几点、星期几、是早晨还是深夜、是否周末或节日，回复时自然体现（比如早安、晚安、该吃饭了、怎么还没睡），不要生硬报时，也不要自己编造别的时间。`;
 if(!c.id)return t+'⟦/时间⟧';
 const H=[...(S.chats['wx'+c.id]||[]),...(S.chats['im'+c.id]||[]),...(S.chats['dy'+c.id]||[])].filter(m=>typeof m.t==='number'&&m.t<=n+60000).sort((x,y)=>x.t-y.t);
 const seg=[];H.forEach(m=>{const l=seg[seg.length-1];if(l&&m.t-l.e<=30*60000){l.e=m.t;l.n++}else seg.push({s:m.t,e:m.t,n:1})});
 if(!seg.length)t+='\n这是你们第一次聊天。';
 else{
  const day=x=>dw7(N.dn-bjp(x).dn)+' '+hm7(bjp(x));
  t+='\n【你们的聊天时间线（北京时间）】\n'+seg.slice(-3).map((g,i,a)=>{const last=i===a.length-1&&n-g.e<30*60000;
   return '- '+day(g.s)+(g.n>1||g.e>g.s?'～'+(bjp(g.s).dn===bjp(g.e).dn?hm7(bjp(g.e)):day(g.e)):'')+(last?'（正在进行）':'')+'，共'+g.n+'条'}).join('\n');
  if(seg.length>=2){const L=seg[seg.length-1],P=seg[seg.length-2],gap=L.s-P.e;
   if(gap>=60*60000)t+=`\n这一轮聊天是在上一轮结束约 ${dur7(gap)} 后重新开始的。`}
  else if(n-seg[0].e>=60*60000)t+=`\n你们上次聊天结束于约 ${dur7(n-seg[0].e)} 前。`;
  t+='\n如果隔了很久（几小时、隔夜或好几天）才又聊起，要自然体现时间的流逝（比如问候、问对方这段时间在做什么），不要像刚聊完一样直接接话；刚聊过不久就不用特意提。';
 }
 return t+'⟦/时间⟧'};
const tsFl={},tsStrip=x=>String(x||'').replace(/\n?⟦时间⟧[\s\S]*?⟦\/时间⟧/g,'');
window.ai=function(c,hist,mode){
 if(!c||S.api.timeSense===false)return ai6(c,hist,mode);
 const k=c.id||c.name;
 if(!tsFl[k]&&c.persona)c.persona=tsStrip(c.persona);  /* 清掉可能被存进去的残留 */
 if(tsFl[k])return ai6(c,hist,mode);                   /* 已有进行中的调用，不重复注入 */
 const p=c.persona;tsFl[k]=1;c.persona=(p||'')+timeCtx(c);
 let out;try{out=ai6(c,hist,mode)}catch(e){c.persona=p;tsFl[k]=0;throw e}
 return Promise.resolve(out).finally(()=>{c.persona=p;tsFl[k]=0})
};

/* ===== 设置 App（覆盖原 settings） ===== */
const PV={custom:['自定义',''],openai:['OpenAI','https://api.openai.com/v1'],deepseek:['DeepSeek','https://api.deepseek.com/v1'],moonshot:['Moonshot（Kimi）','https://api.moonshot.cn/v1'],zhipu:['智谱 GLM','https://open.bigmodel.cn/api/paas/v4'],siliconflow:['SiliconFlow','https://api.siliconflow.cn/v1'],openrouter:['OpenRouter','https://openrouter.ai/api/v1'],gemini:['Gemini（OpenAI 兼容）','https://generativelanguage.googleapis.com/v1beta/openai']};
const IPV={custom:['自定义','custom',''],openai:['OpenAI 官方','openai','https://api.openai.com/v1'],novelai:['NovelAI','novelai','https://image.novelai.net'],siliconflow:['SiliconFlow','custom','https://api.siliconflow.cn/v1']};
const MODE={custom:'自定义直连',novelai:'NovelAI',openai:'OpenAI官方直连'};
const NAI=['nai-diffusion-3','nai-diffusion-furry-3'];
const dl=(n,o)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=n;a.click()};
const stamp=()=>new Date().toISOString().slice(0,10);
const tfm=t=>new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});

window.settings=function(r){
 const A=S.api,I=S.imgApi||{};
 S.apiPresets=S.apiPresets||[];S.imgPresets=S.imgPresets||[];S.promptPresets=S.promptPresets||[];
 /* 进入时自动载入已保存的模型列表、状态与全部配置 */
 const d={provider:A.provider||'custom',url:A.url||'',key:A.key||'',model:A.model||'',temp:A.temp==null?0.7:A.temp,ts:A.timeSense!==false,stream:!!A.stream,
  ip:{provider:I.provider||'custom',mode:I.mode||'custom',url:I.url||'',key:I.key||'',model:I.model||'',size:I.size||'1:1',pos:I.pos||'',neg:I.neg||''}};
 let models=[...(A.models||[])],imodels=[...(I.models||[])],dirty=0,sel1='';

 const sel=(attr,opts,cur)=>`<select ${attr}>${opts.map(([v,l])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`).join('')}</select>`;

 /* 保存 */
 const commit=()=>{
  Object.assign(S.api,{provider:d.provider,url:base(d.url),key:d.key.trim(),model:d.model,temp:+d.temp,timeSense:d.ts,stream:d.stream,models});
  const ip=d.ip,url=ip.mode==='openai'?'https://api.openai.com/v1':ip.mode==='novelai'?'https://image.novelai.net':base(ip.url);
  S.imgApi={provider:ip.provider,mode:ip.mode,url,key:ip.key.trim(),model:ip.model,size:ip.size,pos:ip.pos,neg:ip.neg,models:imodels};
  save();dirty=0};

 /* 预设：保存 / 管理 */
 const savePreset=(key,mk,def)=>{
  const o=modal(r,'保存为预设','<input id="pn7" placeholder="预设名称">',o=>{
   const n=o.querySelector('#pn7').value.trim();if(!n)return false;
   const L=S[key],old=L.find(x=>x.name===n);
   if(old)Object.assign(old,mk());else L.push({id:uid(),name:n,...mk()});
   save();toast('预设已保存');view()});
  o.querySelector('#pn7').value=def||''};
 const manage=(key,title)=>{
  const L=S[key];
  const o=sheet(r,`<h3>${title}</h3>${L.map(p=>`<div class="mrow" data-id="${p.id}"><span>${esc(p.name)}</span><u data-e>重命名</u><u data-d>删除</u></div>`).join('')||'<p class="tip">还没有保存的预设</p>'}`);
  o.querySelectorAll('.mrow').forEach(row=>{
   const p=L.find(x=>x.id===row.dataset.id);
   row.querySelector('[data-e]').onclick=()=>{o.remove();const m=modal(r,'重命名预设','<input id="rn7">',m=>{const n=m.querySelector('#rn7').value.trim();if(!n)return false;p.name=n;save();manage(key,title);view()});m.querySelector('#rn7').value=p.name};
   row.querySelector('[data-d]').onclick=()=>{S[key]=S[key].filter(x=>x.id!==p.id);save();o.remove();manage(key,title);view()}})};
 const manual=(get,set)=>{
  const o=modal(r,'手动输入模型名','<input id="mn7" placeholder="例如 gpt-4o-mini">',o=>{const v=o.querySelector('#mn7').value.trim();if(!v)return false;set(v);dirty=1;view()});
  o.querySelector('#mn7').value=get()||'';
  o.querySelector('[data-x]').addEventListener('click',view);o.addEventListener('click',e=>{if(e.target===o)view()})};

 /* 文本 API：拉取 / 测试 */
 const pull=async()=>{
  const url=base(d.url);if(!url||!d.key)return toast('请先填写 API 地址和 Key');
  toast('正在拉取模型…');
  try{
   const res=await fetch(url+'/models',{headers:{Authorization:'Bearer '+d.key}});const j=await res.json();if(!res.ok)throw (j.error&&j.error.message)||res.status;
   const L=(j.data||j.models||[]).map(m=>m.id||m.name||m).filter(Boolean).sort();if(!L.length)throw'没有返回模型';
   models=L;if(!d.model||!L.includes(d.model))d.model=L[0];S.api.models=L;save();toast(`已拉取 ${L.length} 个模型`);view();
  }catch(e){toast('拉取失败：'+e)}};
 const test=async()=>{
  const url=base(d.url);if(!url||!d.key)return toast('请先填写 API 地址和 Key');
  const m=d.model||models[0];if(!m)return toast('请先拉取并选择模型');
  toast('测试中…');
  try{
   const res=await fetch(url+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+d.key},body:JSON.stringify({model:m,messages:[{role:'user',content:'你好'}],max_tokens:8})});
   const j=await res.json();if(!res.ok)throw (j.error&&j.error.message)||res.status;
   toast('✅ 连接成功：'+m);
  }catch(e){toast('❌ 测试失败：'+e)}};

 /* 生图 API：拉取 / 尺寸 / 测试生图 */
 const pullImg=async()=>{
  const ip=d.ip;
  if(ip.mode==='novelai'){imodels=NAI;if(!NAI.includes(ip.model))ip.model=NAI[0];dirty=1;toast('已载入 NovelAI 模型');return view()}
  const url=ip.mode==='openai'?'https://api.openai.com/v1':base(ip.url);
  if(!url||!ip.key)return toast('请先填写 Key'+(ip.mode==='custom'?' 和 API 地址':''));
  toast('正在拉取模型…');
  try{
   const res=await fetch(url+'/models',{headers:{Authorization:'Bearer '+ip.key}});const j=await res.json();if(!res.ok)throw (j.error&&j.error.message)||res.status;
   let L=(j.data||[]).map(m=>m.id).filter(Boolean).sort();
   if(ip.mode==='openai'){L=L.filter(x=>/dall-e|gpt-image/.test(x));if(!L.length)L=['gpt-image-1','dall-e-3','dall-e-2']}
   if(!L.length)throw'没有返回模型';
   imodels=L;if(!L.includes(ip.model))ip.model=L[0];dirty=1;toast(`已拉取 ${L.length} 个模型`);view();
  }catch(e){toast('拉取失败：'+e)}};
 const sizeSheet=()=>{
  const o=sheet(r,`<h3>图像尺寸</h3>${['1:1','3:4','3:2','2:3'].map(s=>`<div class="op" data-s="${s}">${s}${d.ip.size===s?' ✓':''}</div>`).join('')}`);
  o.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{d.ip.size=e.dataset.s;dirty=1;o.remove();view()})};
 const testGen=async()=>{
  commit();const g=S.imgApi,key=g.key,url=g.url;
  if(!url||!key)return toast('请先填写生图 API 的 Key'+(g.mode==='custom'?' 和地址':''));

 /* 数据备份 */
 const FDB='phone_desktop_font_storage';
 const idbOpen=cb=>{const q=indexedDB.open(FDB,2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('fonts'))q.result.createObjectStore('fonts')};q.onsuccess=()=>cb(q.result);q.onerror=()=>cb(null)};
 const idbDump=()=>new Promise(res=>{try{idbOpen(db=>{if(!db)return res({});const out={};
  try{const cur=db.transaction('fonts','readonly').objectStore('fonts').openCursor();
   cur.onsuccess=()=>{const c=cur.result;if(c){out[c.key]=c.value;c.continue()}else{db.close();res(out)}};
   cur.onerror=()=>{db.close();res(out)}}catch(e){db.close();res(out)}})}catch(e){res({})}});
 const idbLoad=o=>new Promise(res=>{try{idbOpen(db=>{if(!db)return res(false);
  const tx=db.transaction('fonts','readwrite'),st=tx.objectStore('fonts');st.clear();Object.keys(o).forEach(k=>st.put(o[k],k));
  tx.oncomplete=()=>{db.close();res(true)};tx.onerror=tx.onabort=()=>{db.close();res(false)}})}catch(e){res(false)}});
 const buildAll=async()=>{
  const ls={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);ls[k]=localStorage.getItem(k)}
  ls.yy=JSON.stringify(S);
  return{__backup:2,app:'phone-chat',time:new Date().toISOString(),ls,idb:{fonts:await idbDump()}}};
 const nowTag=()=>{const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())};
 const nameBox=def=>`<input id="bkn" value="${esc(def)}" placeholder="文件名" style="width:100%;box-sizing:border-box;margin:8px 0 4px"><p class="tip" style="font-size:12px">可以修改文件名，保存为 .json 文件，保存后在手机「文件」App 的下载位置找到</p>`;
 const nameOf=o=>{const n=o.querySelector('#bkn').value.trim().replace(/[\\\/:*?"<>|]/g,'_').replace(/\.json$/i,'');if(!n){toast('请输入文件名');return null}return n};
 const focusName=o=>setTimeout(()=>{const i=o.querySelector('#bkn');if(i){i.focus();i.select()}},60);
 const copyText=async t=>{try{await navigator.clipboard.writeText(t);toast('已复制');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.append(ta);ta.select();ta.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'已复制':'复制失败')};
 const saveFile=async(n,obj)=>{
  const text=JSON.stringify(obj),fn=n+'.json';let done=false;
  try{const f=new File([text],fn,{type:'application/json'});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});done=true}}catch(e){if(e&&e.name==='AbortError')done=true}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=fn;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
  const o=modal(r,'导出完成',`<p class="tip" style="font-size:13px">文件名：<b>${esc(fn)}</b><br>如果在手机「文件」里找不到（QuickEdit 等编辑器自带的预览不支持下载），点下面按钮复制内容，再到 QuickEdit 新建一个 .json 文件，粘贴并保存即可。</p><button class="btn g" id="bkc" style="width:100%;margin:6px 0">复制备份内容（${(text.length/1048576).toFixed(2)} MB）</button>`,()=>{});
  o.querySelector('#bkc').onclick=()=>copyText(text)};
 const expAll=()=>{const o=modal(r,'导出全部数据',nameBox('phone-backup-'+nowTag()),o=>{
  const n=nameOf(o);if(!n)return false;toast('正在生成备份…');
  buildAll().then(d=>saveFile(n,d)).catch(e=>toast('导出失败：'+e))});focusName(o)};
 const expPart=()=>{const o=modal(r,'批量导出数据','<label class="ck"><input type="checkbox" value="chat" checked>聊天记录（好友、聊天、群聊、动态、收藏、聊天美化）</label><label class="ck"><input type="checkbox" value="desk">桌面美化（壁纸、图标、桌面布局、顶部小组件）</label>'+nameBox('phone-part-'+nowTag()),o=>{
  const v=[...o.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(!v.length){toast('请至少选择一项');return false}
  const n=nameOf(o);if(!n)return false;
  const out={__part:v.join(',')},take=ks=>ks.forEach(k=>{if(S[k]!==undefined)out[k]=S[k]});
  if(v.includes('chat'))take(['contacts','groups','chats','hidden','pinned','night','moments','favs']);
  if(v.includes('desk'))take(['wall','icons','layout','w','strip']);
  saveFile(n,out)});focusName(o)};
 const doImport=j=>{try{
  if(j.__backup&&j.ls){
   modal(r,'导入数据','<p class="tip" style="color:#ff3b30;font-weight:600">导入会覆盖当前浏览器里的全部数据（含字体），确定继续吗？</p>',()=>{(async()=>{try{
    toast('正在导入…');
    const ks=Object.keys(j.ls).sort((a,b)=>(a==='yy'?-1:0)-(b==='yy'?-1:0));
    ks.forEach(k=>localStorage.setItem(k,j.ls[k]));
    S={...D,...JSON.parse(j.ls.yy||'{}')};fix();
    if(j.idb&&j.idb.fonts)await idbLoad(j.idb.fonts);
    toast('导入成功，正在刷新…');setTimeout(()=>location.reload(),800);
   }catch(e){toast('导入失败：'+(e&&e.name==='QuotaExceededError'?'存储空间不足':e))}})()});
   return;
  }
  if(j.__part){delete j.__part;Object.assign(S,j)}else S={...D,...j};
  fix();save();renderWall();renderHome();toast('导入成功');window.settings(r);
 }catch(e){toast('文件无效')}};
 const impData=()=>{
  const o=modal(r,'导入数据','<button class="btn g" id="bkf" style="width:100%;margin:6px 0">选择备份文件</button><p class="tip" style="font-size:12px">选不了文件？把备份内容粘贴到下面，再点确定</p><textarea id="bkt" rows="4" placeholder="粘贴备份内容" style="width:100%;box-sizing:border-box"></textarea>',o=>{
   const t=o.querySelector('#bkt').value.trim();if(!t){toast('请选择文件或粘贴内容');return false}
   let j;try{j=JSON.parse(t)}catch(e){toast('内容无效');return false}
   doImport(j)});
  o.querySelector('#bkf').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
   i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const j=JSON.parse(await f.text());o.remove();doImport(j)}catch(e){toast('文件无效')}};i.click()};
 };
 const wipe=()=>modal(r,'清空全部本地数据','<p class="tip" style="color:#ff3b30;font-weight:600">将清空聊天记录、世界书、美化、API 配置等全部本地数据，且无法恢复！建议先导出备份。</p>',async()=>{
  localStorage.clear();
  try{if(indexedDB.databases){for(const x of await indexedDB.databases())indexedDB.deleteDatabase(x.name)}}catch(e){}
  location.reload()});

 /* 交互绑定 */
 const bind=B=>{
  const $$=s=>B.querySelectorAll(s),$1=s=>B.querySelector(s);
  $$('[data-k]').forEach(e=>e.oninput=()=>{d[e.dataset.k]=e.value;dirty=1});
  $$('[data-i]').forEach(e=>e.oninput=()=>{d.ip[e.dataset.i]=e.value;dirty=1});
  $1('[data-pv]').onchange=e=>{d.provider=e.target.value;if(d.provider!=='custom')d.url=PV[d.provider][1];dirty=1;view()};
  $1('[data-m]').onchange=e=>{if(e.target.value==='__manual')return manual(()=>d.model,v=>{d.model=v});d.model=e.target.value;dirty=1};
  $1('[data-sp]').onchange=e=>{sel1=e.target.value};
  $1('[data-tp]').oninput=e=>{d.temp=+e.target.value;e.target.parentNode.querySelector('em').textContent=d.temp;dirty=1};
  $$('[data-t]').forEach(e=>e.onchange=()=>{d[e.dataset.t]=e.checked;dirty=1});
  $1('[data-ipv]').onchange=e=>{const v=IPV[e.target.value];d.ip.provider=e.target.value;d.ip.mode=v[1];if(v[2])d.ip.url=v[2];dirty=1;view()};
  $1('[data-im]').onchange=e=>{d.ip.mode=e.target.value;if(d.ip.mode==='openai')d.ip.url='https://api.openai.com/v1';else if(d.ip.mode==='novelai')d.ip.url='https://image.novelai.net';dirty=1;view()};
  $1('[data-imod]').onchange=e=>{if(e.target.value==='__manual')return manual(()=>d.ip.model,v=>{d.ip.model=v});d.ip.model=e.target.value;dirty=1};
  $1('[data-sip]').onchange=e=>{const p=S.imgPresets.find(x=>x.id===e.target.value);if(p){Object.assign(d.ip,p.ip);imodels=p.models||imodels;dirty=1;view()}};
  $1('[data-spp]').onchange=e=>{const p=S.promptPresets.find(x=>x.id===e.target.value);if(p){d.ip.pos=p.pos;d.ip.neg=p.neg;dirty=1;view()}};
  const on=(id,f)=>{const e=$1(id);if(e)e.onclick=f};
  on('#pl1',pull);on('#ts1',test);
  on('#p1a',()=>savePreset('apiPresets',()=>({provider:d.provider,url:d.url,key:d.key,model:d.model}),(S.apiPresets.find(x=>x.id===sel1)||{}).name));
  on('#p1b',()=>{const p=S.apiPresets.find(x=>x.id===sel1);if(!p)return toast('请先选择一个预设');Object.assign(d,{provider:p.provider,url:p.url,key:p.key,model:p.model});dirty=1;toast('已应用预设');view()});
  on('#p1c',()=>manage('apiPresets','管理 API 预设'));
  on('#ip1',()=>savePreset('imgPresets',()=>({ip:{provider:d.ip.provider,mode:d.ip.mode,url:d.ip.url,key:d.ip.key,model:d.ip.model,size:d.ip.size},models:imodels})));
  on('#pl2',pullImg);on('#szr',sizeSheet);
  on('#imp',()=>{const i=document.createElement('input');i.type='file';i.accept='.txt,.docx';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{d.ip.pos=await readText(f);dirty=1;toast('已导入到正面提示词');view()}catch(e){toast('导入失败：'+e)}};i.click()});

<script>

const cel=()=>{

 }else{

 }
 if(s.bat>30)s.a20=0;
 if(s.bat<90)s.a100=0;

const relT=ts=>{

 const dd=Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);

const nowStr=()=>{const d=new Date();return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${WK[d.getDay()]} ${p2(d.getHours())}:${p2(d.getMinutes())}（${periodOf(d.getHours())}）`};
const timeBlock=(who,list)=>{

const celMsgs=c=>(cel().chat[c.id]||[]).filter(m=>m.r!=='sys').map(m=>({r:m.r,c:m.c,t:m.ts}));

 const lk=lockedList().map(x=>x.n);
 return `（系统提示，不用回复这条：${u}在「智能遥控」里授权你远程管控 TA 的手机应用。${can.length?`你可以锁住的应用：${can.join('、')}。`:'TA 目前没有勾选任何可管控的应用，你不能锁任何应用。'}当前已被你锁住：${lk.length?lk.join('、'):'无'}。你的手机状态：电量 ${Math.round(s.bat)}%${s.chg?'（充电中）':''}${s.app?`，正在使用「${s.app}」`:''}；${u}此刻正在使用「${myApp()}」。规则：你要锁某个应用，必须在回复末尾单独写上标记 [[lock:应用名]]，只在嘴上说“锁了”是不会生效的；${u}请求解锁而你愿意时，必须写上 [[unlock:应用名]]，不愿意就不写，可以按人设拒绝、撒娇或提条件。锁的时候要符合人设和当下情境（比如催 TA 早睡、吃醋、闹别扭），不要频繁锁。标记里只写应用名，不要念出来，也不要向 TA 提到标记。）`};
const doOp=(f,op,raw)=>{
 const c=cel(),rl=c.real,n=raw.replace(/^真机[·・:：\s]*/,'').trim();
 let tg=null;
 if(/^真机/.test(raw)){if(rl.paired&&rl.apps.includes(n)&&rl.ok[n])tg={m:rl.lock,k:n,n:'真机·'+n}}

 else if(op==='unlock'&&tg.m[tg.k]){delete tg.m[tg.k];toast(`${nm(f)} 已解锁「${tg.n}」`);tip(f,`${nm(f)} 已解锁「${tg.n}」`,'lk')}

};

/* 兜底：对方只在嘴上说“锁了 / 解开了”、忘了写标记时，按回复里的应用名判断 */
const guess=(f,t)=>{
 const c=cel(),rl=c.real,names=[];
 APPS.filter(id=>c.ok[id]).forEach(id=>names.push(nOf(id)));
 if(rl.paired)rl.apps.filter(a=>rl.ok[a]&&!names.includes(a)).forEach(a=>names.push('真机·'+a));
 const lockSay=/(锁住|锁了|锁上|锁定|帮你锁|给你锁|已经锁|限制了|限制住)/,lockNo=/(不锁|没锁|不会锁|不想锁|才不|解锁|解开)/;

 names.forEach(n=>{
  const plain=n.replace(/^真机·/,''),hit=t.includes(plain);

  else if(locked&&unSay.test(t)&&!unNo.test(t))doOp(f,'unlock',n);
 });
};
const apply=(f,t)=>{

const aiP=window.ai;
const TM=new Set(['cel','voice','video','off']);
window.ai=async function(c,hist,mode){

 const i=h.length-1;
 h=i>=0?[...h.slice(0,i),{r:'me',c:tb},h[i]]:[{r:'me',c:tb}];

};

<script>
(()=>{
const SEP='<|message|>';

/* ===== 禁用词：想再加词，就在下面数组里加（提示词会同步告诉 AI，输出时还会自动删掉） ===== */
const BAN0=['丫头','小没良心','小东西'];
const BAN=[...BAN0,'傻丫头','小丫头','臭丫头','死丫头','笨丫头','坏丫头','野丫头','小没良心的'].sort((a,b)=>b.length-a.length);
const BANRE=new RegExp('('+BAN.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')[，,、]?','g');
const scrub=s=>String(s).replace(BANRE,'').replace(/[，,]([！!？?。.…～~])/g,'$1').replace(/(<\|message\|>)\s*[，,、]+/g,'$1').replace(/^[，,、\s]+/,'');
window.scrubBan=scrub;

/* ===== 一条消息只放一句话：太长的自动按句号 / 逗号拆开（语音、图片、转账、表情包、译文不拆） ===== */
const OPEN='（(「『“‘《',CLOSE='）)」』”’》',LIM=24;
const cut=s=>{
 s=s.trim();
 if(s.length<=LIM||/^【|【译】|\[\[/.test(s))return [s];
 const sen=[];let buf='',dep=0,end=false;
 for(const ch of s){
  if(end&&!'。！？!?…～~'.includes(ch)&&!CLOSE.includes(ch)){if(buf.trim())sen.push(buf.trim());buf='';end=false}
  buf+=ch;
  if(OPEN.includes(ch))dep++;else if(CLOSE.includes(ch)&&dep>0)dep--;
  if(!dep&&'。！？!?…\n'.includes(ch))end=true;
 }
 if(buf.trim())sen.push(buf.trim());
 const out=[];
 sen.forEach(x=>{
  if(x.length<=22){out.push(x);return}
  const seg=[];let b='',d=0;
  for(const ch of x){b+=ch;if(OPEN.includes(ch))d++;else if(CLOSE.includes(ch)&&d>0)d--;if(!d&&'，,、；;'.includes(ch)){seg.push(b);b=''}}
  if(b)seg.push(b);
  let cur='';
  seg.forEach(g=>{if(cur&&(cur+g).length>20){out.push(cur);cur=g}else cur+=g});
  if(cur)out.push(cur);
 });
 return out.map(x=>x.replace(/[，,、]+$/,'').trim()).filter(Boolean);
};

/* ===== 内置提示词：聊天消息发送规则 ===== */

你正在使用即时通讯软件与用户聊天，不是在写文章。

一次回复可以由多条独立消息组成。

每条消息之间必须使用：
<|message|>

要求：
你需要真正理解并演绎当前角色，而不是机械地执行人物设定。
人物设定是角色人格的基础，不是限制角色表达的台词库，也不是要求你逐条展示的行为清单。
你的首要任务是理解角色的性格、思维方式、价值观、情感模式、生活习惯、个人偏好以及行为动机，并以此为基础，自然地生成符合角色身份的言行。

你好
<|message|>
吃饭了吗？`;

  const m=H[i];if(m.r==='me'&&typeof m.c==='string'&&m.c.startsWith('【转账】')&&!m.acc&&!m.ref)return m}

   const m={r:'ai',c:x,t:Date.now()};H.push(m);anchor=m;delete S.hidden[c.id];save();repaint(c);step();
  },Math.min(1800,500+x.length*70));
 };

/* ===== 接管 ai：普通聊天加规则，回复按 <|message|> 拆成多条消息 ===== */
const ai8=window.ai;

 const last=hist.length?String(hist[hist.length-1].c):'';
 /* 通话 / 线下 / 评论 / 心声 / 记忆总结 不拆分 */
 if(mode||!c.id||/^（系统指令：请不要回复我/.test(last)||/只输出评论内容/.test(last))return ai8(c,hist,mode);

 /* 已被你删除好友：只发一条好友申请，界面上以弹框显示（带【好友申请】前缀，不拆分） */
 if(c.fdel){

  let t;try{t=await ai8(c,hist,mode)}finally{c.persona=p}

 }

 const pd=pending(S.chats['wx'+c.id]||[]),p=c.persona;
 c.persona=(p||'')+'\n'+RULE(c.name)+(pd?TF:'')+VR;
 let t;try{t=await ai8(c,hist,mode)}finally{c.persona=p}
 t=scrub(t);

{const k=t.lastIndexOf('【心声】');let v0='';

<script>
(() => {
 'use strict';

 S.desktopBz = {fontUrl:'',fontName:'',fontSize:16,textColor:'#111111',colorOn:false,...(S.desktopBz||{})};
 S.desktopFontPresets = Array.isArray(S.desktopFontPresets) ? S.desktopFontPresets : [];

 /* ===== 本地字体存储（IndexedDB） ===== */
 const FontDB = {
  DB_NAME:'phone_desktop_font_storage',DB_VERSION:2,STORE:'fonts',
  open(){
   return new Promise((resolve,reject)=>{
    const req=indexedDB.open(this.DB_NAME,this.DB_VERSION);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(this.STORE))db.createObjectStore(this.STORE)};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})},
  async put(key,value){
   const db=await this.open();
   return new Promise((resolve,reject)=>{
    const tx=db.transaction(this.STORE,'readwrite');tx.objectStore(this.STORE).put(value,key);
    tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})},
  async get(key){
   try{
    const db=await this.open();
    return await new Promise((resolve,reject)=>{
     const tx=db.transaction(this.STORE,'readonly'),req=tx.objectStore(this.STORE).get(key);
     req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})
   }catch(e){return null}},
  async delete(key){
   try{
    const db=await this.open();
    await new Promise((resolve,reject)=>{
     const tx=db.transaction(this.STORE,'readwrite');tx.objectStore(this.STORE).delete(key);
     tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
    db.close();
   }catch(e){}}
 };

 /* 迁移旧版存在 localStorage 里的字体数据 */
 (async()=>{
  const old=S.desktopBz.fontData;
  if(old){try{await FontDB.put('current',{data:old,name:S.desktopBz.fontName||'DesktopCustomFont'})}catch(e){}}
  delete S.desktopBz.fontData;
  S.desktopFontPresets.forEach(p=>delete p.fontData);
  try{save()}catch(e){}
 })();

 /* ===== 字体加载 ===== */
 let fontCounter=0;
 async function loadFont(source,name){
  const family=name||'DesktopCustom_'+(++fontCounter);
  const loaded=await new FontFace(family,`url("${source}")`).load();
  document.fonts.add(loaded);
  document.documentElement.style.setProperty('--desktop-global-font',`"${family}"`);
  document.documentElement.classList.add('desktop-custom-font');
  return family;
 }

 function applyHomeStyle(){
  const z=S.desktopBz||{},c=z.textColor||'#111111';
  const on=z.colorOn||(z.textColor&&z.textColor!=='#111111');
  let st=document.getElementById('desktop-home-style');
  if(!st){st=document.createElement('style');st.id='desktop-home-style';document.head.appendChild(st)}
  st.textContent=on?`#home .sb,#home .sb *,#home .wg,#home .wg *,#home .ic span{color:${c}!important}
#home .sb svg{fill:${c}!important}
#home .sb svg rect[fill="none"]{stroke:${c}!important}
#home .wg .st svg{stroke:${c}!important}`:'';
  document.documentElement.style.setProperty('--fsc',(Number(z.fontSize||16)/16).toFixed(3));
 }

 /* 把样式表里所有 px 字号改成「原字号 × 全局倍数」，滑块一拉，所有页面的文字一起变 */
 function scaleSheets(){
  if(window.__fscDone)return;window.__fscDone=1;
  const walk=rules=>{
   for(const r of rules){
    if(r.type===7||r.type===8)continue;
    if(r.cssRules)walk(r.cssRules);
    else if(r.style){
     const v=r.style.getPropertyValue('font-size');
     if(/^[\d.]+px$/.test(v))r.style.setProperty('font-size',`calc(${v} * var(--fsc,1))`,r.style.getPropertyPriority('font-size'));

<!-- ===== 补丁十三：全局字号修复 + 小组件文字固定深色 ===== -->
<style>
/* ===== 没写字号的文字也跟着缩放 ===== */
html body{font-size:calc(16px * var(--fsc,1))}

/* ===== 小组件是白底，文字保持深色，不随主页文字颜色变化 ===== */
html body #home .wg,html body #home .wg *{color:#111!important}
html body #home .wg .q{color:#555!important}
html body #home .wg .tag,html body #home .wg .st,html body #home .wg .st *{color:#8e8e93!important}
html body #home .wg .st svg{stroke:#8e8e93!important}
</style>

<script>
(()=>{
const PX=/^[\d.]+px$/;

/* ===== 样式表里的 px 字号 → 乘以全局倍数 ===== */
const scanRules=rules=>{
 for(const r of rules){
  if(r.type===7||r.type===8)continue;
  if(r.style){
   const v=(r.style.getPropertyValue('font-size')||'').trim();
   if(PX.test(v))r.style.setProperty('font-size',`calc(${v} * var(--fsc,1))`,r.style.getPropertyPriority('font-size'));
  }
  if(r.cssRules&&r.cssRules.length)scanRules(r.cssRules);
 }};
const scanSheets=()=>{for(const sh of document.styleSheets){try{scanRules(sh.cssRules)}catch(e){}}};

/* ===== 行内 style 里的 px 字号 ===== */
const fixEl=el=>{
 const v=(el.style.fontSize||'').trim();
 if(PX.test(v))el.style.fontSize=`calc(${v} * var(--fsc,1))`};
const scanInline=root=>{
 if(root.nodeType!==1)return;
 if(root.matches('[style*="font-size"]'))fixEl(root);
 root.querySelectorAll('[style*="font-size"]').forEach(fixEl)};

/* ===== 新出现的页面、新加的样式也自动处理 ===== */
let raf=0,dirty=false;const pend=new Set();
const flush=()=>{raf=0;if(dirty){dirty=false;scanSheets()}pend.forEach(scanInline);pend.clear()};
new MutationObserver(ms=>{
 for(const m of ms){
  if(m.target.nodeName==='STYLE'&&m.target.id!=='desktop-home-style')dirty=true;
  m.addedNodes.forEach(n=>{
   if(n.nodeName==='STYLE'&&n.id!=='desktop-home-style')dirty=true;
   else if(n.nodeType===1)pend.add(n)});
 }
 if(!raf)raf=requestAnimationFrame(flush);
}).observe(document.documentElement,{childList:true,subtree:true});

/* ===== 启动 ===== */
scanSheets();scanInline(document.body);
window.addEventListener('load',()=>{scanSheets();scanInline(document.body)});
})();
</script>

<script>
(()=>{
const NONE='wb_none';
const ico=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const ARW='M15 5l-7 7 7 7',UPL='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12',PLS='M12 5v14M5 12h14';
const FOLD=ico('M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z');
const nav=(t,right)=>`<div class="nav wbn"><div class="wbk" id="wbk"><i>${ico(ARW)}</i></div><b>${esc(t)}</b><div>${right||''}</div></div>`;
const card=(k,name,cover)=>`<div class="wbc" data-k="${esc(k)}"><div class="wbt"${cover?` style="background-image:url('${esc(cover)}')"`:''}>${cover?'':FOLD}</div><b>${esc(name||'（未命名）')}</b></div>`;

/* ===== 改动条目位置时，同步修正各好友「关联世界书」的勾选记录 ===== */
const withRemap=fn=>{
 const refs=S.contacts.map(c=>(c.wbSel||[]).map(k=>{const [bid,ix]=k.split(':'),b=S.wb.find(x=>x.id===bid);return b&&b.items[+ix]}).filter(Boolean));
 fn();
 S.contacts.forEach((c,n)=>{
  if(!(c.wbSel&&c.wbSel.length))return;
  const set=new Set(refs[n]),out=[];
  S.wb.forEach(b=>b.items.forEach((it,i)=>{if(set.has(it))out.push(b.id+':'+i)}));
  c.wbSel=out});
};
const dropEmpty=b=>{if(!b.items.length&&!b.flat)S.wb.splice(S.wb.indexOf(b),1)};

/* ===== 读取导入文件（txt / md / json / csv / docx） ===== */
const unzip=async(buf,want)=>{
 const b=new Uint8Array(buf),dv=new DataView(b.buffer);
 let e=b.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw'文件格式不对';
 let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);
 for(let i=0;i<n;i++){
  const cm=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(b.slice(p+46,p+46+nl));
  if(want(name)){
   const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=b.slice(st,st+cs);
   if(cm===0)return data;
   if(typeof DecompressionStream==='undefined')throw'当前浏览器不支持解压，请改用 txt';
   return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  }
  p+=46+nl+xl+cl;
 }
 throw'压缩包里没有找到内容';
};
const readAny=async f=>{
 if(/\.docx$/i.test(f.name)){
  const x=new TextDecoder().decode(await unzip(await f.arrayBuffer(),n=>n==='word/document.xml'));
  return x.replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&').trim();
 }

  <h4>权重</h4><div class="wbcard">${grp('w',[['high','高'],['mid','中'],['low','低']])}<div class="wbhint">高：每句都严格执行；中：约一半概率注入；低：聊到相关关键词时才注入</div></div>
 </div><div class="wbbar"><button class="s" id="wbsv">保存</button><button class="d" id="wbdl">删除</button></div></div>`;
 const q=s=>r.querySelector(s);

 /* 保存：名称必填；分类文件夹名称相同的自动归到同一个文件夹 */

   const f={t,c:d.c,cover:d.cover,glob:d.glob,pos:d.pos,w:d.w};
   if(it){
    if(b===tb)Object.assign(it,f);
    else{b.items.splice(o.i,1);Object.assign(it,f);tb.items.push(it);dropEmpty(b)}

 };

/* ===== 注入 AI：全局启用 / 勾选的条目，按位置、权重拼进系统提示词 ===== */
const Q=[];
const fmt=L=>{
 const g={};L.forEach(x=>(g[x.b]=g[x.b]||[]).push(x));
 let s=Object.keys(g).map(k=>(k?`【${k}】\n`:'')+g[k].map(x=>`${x.w==='high'?'【必须严格遵守】':''}${x.t}：${x.c}`).join('\n')).join('\n\n');
 if(L.some(x=>x.w==='high'))s+='\n（标注【必须严格遵守】的设定，每一句回复都要严格执行）';
 return s;
};
const build=(c,hist)=>{
 const sel=new Set(c.wbSel||[]),recent=(hist||[]).slice(-6).map(m=>String(m&&m.c||'')).join('\n');
 const out={front:[],mid:[],back:[]};
 S.wb.forEach(b=>b.items.forEach((it,i)=>{
  if(!(it.glob||sel.has(b.id+':'+i)))return;
  if(!String(it.c||'').trim())return;
  const w=it.w||'high';
  if(w==='mid'&&Math.random()>=.5)return;
  if(w==='low'){
   const ks=[it.t,b.flat?'':b.name].join('，').split(/[，,、;；\s]+/).filter(Boolean);
   if(!ks.some(k=>recent.includes(k)))return}
  (out[it.pos]||out.mid).push({b:b.flat?'':b.name,t:it.t,c:it.c,w});
 }));
 return {front:out.front.length?'【世界书·前置设定】\n'+fmt(out.front):'',mid:out.mid.length?fmt(out.mid):'',back:out.back.length?'【世界书·补充设定】\n'+fmt(out.back):''};
};
const compose=(s,q)=>{
 const re=/世界观设定：\n[\s\S]*?(?=\n请用手机聊天口吻)/;
 s=re.test(s)?s.replace(re,()=>'世界观设定：\n'+(q.mid||'无')):s+(q.mid?'\n'+q.mid:'');
 return (q.front?q.front+'\n\n':'')+s+(q.back?'\n\n'+q.back:'');
};

window.ai=function(c,hist,mode){
 if(!c||!c.id||mode)return aiPrev(c,hist,mode);

 Q.push(q);c.wbSel=['__wb_off__'];
 return aiPrev(c,hist,mode).finally(()=>{c.wbSel=old;const i=Q.indexOf(q);if(i>-1)Q.splice(i,1)});
};
const fetchPrev=window.fetch.bind(window);

   const j=JSON.parse(o.body),m=j.messages&&j.messages[0];
   if(m&&m.role==='system'&&typeof m.content==='string'){
    const k=Q.findIndex(x=>m.content.includes('你是'+x.name));
    if(k>-1){const x=Q.splice(k,1)[0];m.content=compose(m.content,x);o={...o,body:JSON.stringify(j)}}
   }
  }
 }catch(e){}
 return fetchPrev(u,o);
};
})();

  const c=e.target.closest&&e.target.closest('.wbc[data-k^="f:"]');if(!c)return;

 r.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)clearTimeout(t)});
 ['pointerup','pointercancel'].forEach(n=>r.addEventListener(n,()=>clearTimeout(t)));
 r.addEventListener('click',e=>{if(fired&&e.target.closest('.wbc')){e.stopPropagation();e.preventDefault();fired=0}},true);

};

 search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3',
 mic:'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3',
 compose:'M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.4 2.6a2 2 0 0 1 3 3L12 15l-4 1 1-4z',
 mail:'M4 6h16v12H4zM4 7l8 6 8-6',
 bell:'M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7M10.3 21a1.94 1.94 0 0 0 3.4 0M2 2l20 20',
 trash:'M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6'
};
const CHV='<svg viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg>';

/* ===== 数据：未读 / 静音 / 隐藏都存在 S 里 ===== */
const init=()=>{
 S.imRead=S.imRead||{};S.imUnread=S.imUnread||{};S.imMute=S.imMute||{};S.imHide=S.imHide||{};
 if(!S.imBase){S.imBase=Date.now();save()}
};
const hist=c=>S.chats['im'+c.id]||[];
const lastOf=c=>{const h=hist(c);return h[h.length-1]};
const isFail=m=>!!(m&&m.r==='ai'&&String(m.c||'').startsWith('⚠️'));
const isUn=c=>{
 if(S.imUnread[c.id])return true;
 const m=lastOf(c);
 return !!(m&&m.r==='ai'&&!isFail(m)&&m.t>Math.max(S.imRead[c.id]||0,S.imBase||0));
};
const preview=(m,c)=>{
 if(!m)return c.sign||'';
 if(isFail(m))return T.fail;
 if(m.c)return String(m.c).replace(/\s+/g,' ');
 return m.img?'[圖片]':m.stk?'[表情]':m.card?'[名片]':'';
};
const WK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const tl=t=>{
 if(!t)return '';
 const d=new Date(t),n=new Date(),p=x=>String(x).padStart(2,'0'),day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),df=Math.round((day(n)-day(d))/864e5);
 if(df<=0)return p(d.getHours())+':'+p(d.getMinutes());
 if(df===1)return '昨天';
 if(df<7)return WK[d.getDay()];
 return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
};
const rows=()=>S.contacts.map((c,i)=>({c,m:lastOf(c),i}))
 .filter(x=>!S.imHide[x.c.id]||hist(x.c).length)
 .sort((a,b)=>((b.m&&b.m.t)||0)-((a.m&&a.m.t)||0)||a.i-b.i);

/* ===== 主界面 ===== */
window.im=function(r){
 init();
 let edit=0,filt='all',open=null,fm=null;
 const sel=new Set(),q=s=>r.querySelector(s),W=216;

 r.innerHTML=`<div class="imp">
  <div class="imh" id="imh"><button class="imcap" id="imed"></button><b id="imsm"></b><button class="imcap ic" id="imft">${ico(I.filter)}</button></div>
  <div class="imsc" id="imsc"><h1 class="imt" id="imt"></h1><div id="iml"></div></div>
  <div class="imbar" id="imbar"><div class="imq" id="imsq">${ico(I.search)}<span>${T.search}</span>${ico(I.mic)}</div><div class="imqc" id="imcp">${ico(I.compose)}</div></div>
  <div class="imeb" id="imeb"></div>
 </div>`;

 /* ===== 打开对话：进入即已读，返回时回到列表 ===== */
 const openChat=c=>{
  S.imRead[c.id]=Date.now();delete S.imUnread[c.id];delete S.imHide[c.id];save();
  chat(r,'im',c,()=>{S.imRead[c.id]=Date.now();save();window.im(r)});
 };
 const closeOpen=()=>{if(open){open.querySelector('.imrow').style.transform='';open=null}};
 const markRead=ids=>{ids.forEach(id=>{S.imRead[id]=Date.now();delete S.imUnread[id]});save()};

 /* ===== 删除：清空 iMessage 记录并从列表移除（微信好友和微信聊天不受影响） ===== */
 const askDel=cs=>modal(r,T.delTitle,`<p class="tip">将删除与${cs.length>1?`所选 ${cs.length} 位好友`:`「${esc(cs[0].name)}」`}的 iMessage 记录。微信好友和微信聊天记录不受影响。</p>`,()=>{
  cs.forEach(c=>{S.chats['im'+c.id]=[];S.imHide[c.id]=1;delete S.imUnread[c.id]});
  save();sel.clear();edit=0;open=null;draw();
 });

 const rowHTML=x=>{
  const c=x.c,m=x.m,un=isUn(c),mu=!!S.imMute[c.id];
  return `<div class="imr" data-id="${esc(c.id)}">
   <div class="imac">
    <button class="rd" data-a="rd">${ico(I.mail)}<span>${un?T.markRead:T.markUnread}</span></button>
    <button class="mu" data-a="mu">${ico(I.bell)}<span>${mu?T.unmute:T.mute}</span></button>
    <button class="dl" data-a="dl">${ico(I.trash)}<span>${T.del}</span></button>
   </div>
   <div class="imrow${un?' un':''}">
    <div class="imdt"><i></i><div class="imck${sel.has(c.id)?' on':''}"></div></div>
    <div class="imav" style="background-image:url('${esc(c.avatar||DEF)}')"></div>
    <div class="imx"><div class="n"><span>${esc(c.name)}</span>${mu?ico(I.bell):''}</div><div class="p${isFail(m)?' er':''}">${esc(preview(m,c))}</div></div>
    <div class="imtm"><span>${tl(m&&m.t)}</span>${CHV}</div>
   </div>
  </div>`;
 };

 /* ===== 编辑模式底栏 ===== */
 const ebar=()=>{
  const eb=q('#imeb');
  eb.innerHTML=`<button id="imrd">${sel.size?T.read:T.readAll}</button><button class="dl" id="imdl"${sel.size?'':' disabled'}>${T.del}</button>`;
  eb.querySelector('#imrd').onclick=()=>{markRead(sel.size?[...sel]:rows().map(x=>x.c.id));edit=0;sel.clear();draw()};
  eb.querySelector('#imdl').onclick=()=>{if(sel.size)askDel(S.contacts.filter(c=>sel.has(c.id)))};
 };

 /* ===== 行的点击 / 左滑 ===== */
 const bindRows=()=>{
  r.querySelectorAll('.imr').forEach(w=>{
   const id=w.dataset.id,c=S.contacts.find(x=>x.id===id),row=w.querySelector('.imrow');
   let sx=0,sy=0,bx=0,dx=0,mv=0,on=0;
   row.onpointerdown=e=>{
    if(edit)return;
    if(open&&open!==w)closeOpen();
    sx=e.clientX;sy=e.clientY;bx=open===w?-W:0;dx=bx;mv=0;on=1;row.classList.add('dr');
   };
   row.onpointermove=e=>{
    if(!on)return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(!mv&&Math.abs(my)>6&&Math.abs(my)>Math.abs(mx)){on=0;row.classList.remove('dr');return}
    if(Math.abs(mx)>6)mv=1;
    if(mv){dx=Math.max(-W-30,Math.min(0,bx+mx));row.style.transform=`translateX(${dx}px)`}
   };
   const end=()=>{
    if(!on)return;on=0;row.classList.remove('dr');
    if(mv){const o=dx<-W/2;row.style.transform=o?`translateX(${-W}px)`:'';open=o?w:(open===w?null:open)}
   };
   row.onpointerup=end;row.onpointercancel=end;
   row.onclick=()=>{
    if(mv){mv=0;return}
    if(open){closeOpen();return}
    if(edit){sel.has(id)?sel.delete(id):sel.add(id);w.querySelector('.imck').classList.toggle('on',sel.has(id));ebar();return}
    openChat(c);
   };
   w.querySelectorAll('.imac button').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const a=b.dataset.a;
    if(a==='dl'){closeOpen();askDel([c]);return}
    if(a==='mu'){S.imMute[id]?delete S.imMute[id]:S.imMute[id]=1;save();open=null;draw();return}
    if(isUn(c)){row.classList.remove('un');markRead([id])}else{S.imUnread[id]=1;save()}
    open=null;row.style.transform='';setTimeout(draw,220);
   });
  });
 };

 /* ===== 整体刷新 ===== */
 function draw(){
  open=null;
  const list=rows().filter(x=>filt==='all'||(filt==='unread'?isUn(x.c):!!S.imMute[x.c.id]));
  const title=filt==='all'?T.title:T[filt];
  q('#imt').textContent=title;q('#imsm').textContent=title;
  q('#imed').textContent=edit?T.done:T.edit;
  q('#imft').style.visibility=edit?'hidden':'visible';
  q('.imp').classList.toggle('edm',!!edit);
  q('#imbar').style.display=edit?'none':'flex';
  q('#imeb').style.display=edit?'flex':'none';
  ebar();
  q('#iml').innerHTML=list.length?list.map(rowHTML).join(''):`<p class="empty">${S.contacts.length?T.none:T.empty}</p>`;
  bindRows();
 }

 /* ===== 顶部按钮、筛选菜单 ===== */
 q('#imsc').onscroll=e=>q('#imh').classList.toggle('sc',e.target.scrollTop>38);
 q('#imed').onclick=()=>{edit=edit?0:1;sel.clear();closeOpen();draw()};
 q('#imft').onclick=()=>{
  if(fm){fm.remove();fm=null;return}
  fm=document.createElement('div');fm.className='imfm';
  fm.innerHTML=[['all',T.all],['unread',T.unread],['muted',T.muted]].map(([k,t])=>`<div data-k="${k}"><i>${filt===k?'✓':''}</i>${t}</div>`).join('');
  q('.imp').appendChild(fm);
  fm.querySelectorAll('div').forEach(d=>d.onclick=()=>{filt=d.dataset.k;fm.remove();fm=null;draw()});
 };
 r.addEventListener('pointerdown',e=>{if(fm&&!fm.contains(e.target)&&!e.target.closest('#imft')){fm.remove();fm=null}});

 /* ===== 全屏搜索：检索好友与 iMessage 历史消息 ===== */
 const hl=(s,k)=>{
  const i=s.toLowerCase().indexOf(k);
  if(i<0)return esc(s.slice(0,60));
  const a=Math.max(0,i-12);
  return (a?'…':'')+esc(s.slice(a,i))+'<mark>'+esc(s.slice(i,i+k.length))+'</mark>'+esc(s.slice(i+k.length,i+k.length+40));
 };
 q('#imsq').onclick=()=>{
  const s=document.createElement('div');s.className='imsr';
  s.innerHTML=`<div class="imsb"><label>${ico(I.search)}<input id="imsi" placeholder="${T.search}"></label><button id="imsx">${T.cancel}</button></div><div class="imsl" id="imsl"></div>`;
  q('.imp').appendChild(s);
  const inp=s.querySelector('#imsi'),box=s.querySelector('#imsl');
  const av=c=>`<div class="imav" style="background-image:url('${esc(c.avatar||DEF)}')"></div>`;
  inp.oninput=()=>{
   const k=inp.value.trim().toLowerCase();
   if(!k){box.innerHTML='';return}
   const cs=S.contacts.filter(c=>String(c.name).toLowerCase().includes(k)),ms=[];
   S.contacts.forEach(c=>hist(c).forEach(m=>{if(m.c&&String(m.c).toLowerCase().includes(k))ms.push({c,m})}));
   ms.sort((a,b)=>(b.m.t||0)-(a.m.t||0));
   box.innerHTML=(cs.length?`<div class="imsh">${T.contacts}</div>`+cs.map(c=>`<div class="imsi" data-id="${esc(c.id)}">${av(c)}<b>${esc(c.name)}</b></div>`).join(''):'')
    +(ms.length?`<div class="imsh">${T.msgs}</div>`+ms.slice(0,50).map(x=>`<div class="imsi" data-id="${esc(x.c.id)}">${av(x.c)}<div><b>${esc(x.c.name)}</b><small>${hl(String(x.m.c),k)}</small></div></div>`).join(''):'')
    ||`<p class="empty">${T.none}</p>`;
   box.querySelectorAll('.imsi').forEach(e=>e.onclick=()=>openChat(S.contacts.find(c=>c.id===e.dataset.id)));
  };
  s.querySelector('#imsx').onclick=()=>s.remove();
  setTimeout(()=>inp.focus(),60);
 };

 /* ===== 新建对话：选联系人 ===== */
 q('#imcp').onclick=()=>{
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="sh"><h3>${T.newMsg}</h3>${S.contacts.length?S.contacts.map(c=>`<div class="imsi" data-id="${esc(c.id)}"><div class="imav" style="background-image:url('${esc(c.avatar||DEF)}')"></div><b>${esc(c.name)}</b></div>`).join(''):`<p class="empty">${T.empty}</p>`}</div>`;
  r.appendChild(o);
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.querySelectorAll('.imsi').forEach(e=>e.onclick=()=>{o.remove();openChat(S.contacts.find(c=>c.id===e.dataset.id))});
 };

 draw();
};
})();
</script>

<script>
(()=>{
/* ===== 文案（想改简体 / 繁体，只改这里） ===== */
const T={sent:'已送達',read:'已讀',ph:'文字訊息 • SMS',today:'今天',yday:'昨天',fail:'訊息傳送失敗',
 bg:'更換聊天背景',bgR:'恢復預設背景',img:'傳送圖片',cancel:'取消'};

/* ===== 图标 ===== */
const ico=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const CHL='<svg viewBox="0 0 12 20"><path d="M10 2L2 10l8 8"/></svg>';
const CHR='<svg viewBox="0 0 7 12"><path d="M1 1l5 5-5 5"/></svg>';
const MIC=ico('M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3');
const GAP=5*60*1000;
const isErr=m=>!!(m&&m.r==='ai'&&String(m.c||'').startsWith('⚠️'));

/* ===== 时间分隔文案 ===== */
const tlab=t=>{
 const d=new Date(t),n=new Date(),p=x=>String(x).padStart(2,'0'),hm=p(d.getHours())+':'+p(d.getMinutes());
 const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),df=Math.round((day(n)-day(d))/864e5);
 if(df<=0)return T.today+' '+hm;
 if(df===1)return T.yday+' '+hm;
 return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
};

/* ===== 只接管 iMessage 单聊，其余照旧 ===== */
const prevChat=window.chat;
window.chat=function(r,st,c,back){
 if(st!=='im'||c.members)return prevChat(r,st,c,back);
 imChat(r,c,back);
};

function imChat(r,c,back){
 const k='im'+c.id,H=()=>S.chats[k]||(S.chats[k]=[]);
 S.imRead=S.imRead||{};S.imUnread=S.imUnread||{};S.imHide=S.imHide||{};
 let busy=0;
 r.classList.remove('sx');void r.offsetWidth;r.classList.add('sx');
 r.innerHTML=`<div class="imc" id="imc" data-cid="${esc(c.id)}">
  <div class="imcl" id="imcl"></div>
  <div class="imch">
   <div class="imcb" id="imcb">${CHL}<span class="bd" id="imbd"></span></div>
   <div class="imcn" id="imcn"><div class="imca" style="background-image:url('${esc(c.avatar||DEF)}')"></div><div class="imcm"><span>${esc(c.remark||c.name)}</span>${CHR}</div></div>
   <div></div>
  </div>
  <div class="imcf" id="imcf">
   <button class="imcp" id="imcp">${ico('M12 5v14M5 12h14')}</button>
   <div class="imci"><input id="imin" placeholder="${T.ph}" enterkeyhint="send" autocomplete="off">${MIC}<button class="imsd" id="imsd">${ico('M12 19V5M5 12l7-7 7 7')}</button></div>
  </div>
 </div>`;
 const q=s=>r.querySelector(s),box=q('#imc'),cl=q('#imcl'),inp=q('#imin'),bar=q('#imcf');
 const live=()=>r.isConnected&&r.querySelector('#imc')&&r.querySelector('#imc').dataset.cid===c.id;

 /* ===== 自定义壁纸 ===== */
 const applyBg=()=>{box.style.backgroundImage=c.imBg?`url('${String(c.imBg).replace(/'/g,'%27')}')`:''};
 applyBg();

 /* ===== 返回按钮上的未读总数（其他对话里未读的消息条数） ===== */
 const unreadTotal=()=>{
  let n=0;
  S.contacts.forEach(x=>{
   if(x.id===c.id)return;
   if(S.imUnread[x.id]){n++;return}
   const b=Math.max(S.imRead[x.id]||0,S.imBase||0);
   (S.chats['im'+x.id]||[]).forEach(m=>{if(m.r==='ai'&&!isErr(m)&&m.t>b)n++});
  });
  return n;
 };
 const n0=unreadTotal(),bd=q('#imbd');
 if(n0){bd.textContent=n0>99?'99+':n0;bd.style.display='flex'}

 /* ===== 绘制消息 ===== */
 const paint=stick=>{
  const h=H();let html='',pt=0,lastMe=-1;
  h.forEach((m,i)=>{if(m.r==='me')lastMe=i});
  h.forEach((m,i)=>{
   if(isErr(m)){html+=`<div class="imfn">${T.fail}：${esc(String(m.c).replace(/^⚠️\s*/,''))}</div>`;return}
   if(!m.c&&!m.img)return;
   const t=m.t||0;
   if(!pt||(t&&t-pt>=GAP))html+=`<div class="imtd">${tlab(t||Date.now())}</div>`;
   if(t)pt=t;
   const nx=h[i+1],tail=!nx||nx.r!==m.r||isErr(nx)||((nx.t||0)-t>=GAP);
   const side=m.r==='me'?'r':'l';
   html+=m.img
    ?`<div class="imb ${side} pic"><img src="${esc(m.img)}"></div>`
    :`<div class="imb ${side}${tail?' tl':''}">${esc(m.c)}</div>`;
   if(i===lastMe&&!isErr(nx)){
    const replied=h.slice(i+1).some(x=>x.r==='ai'&&!isErr(x));
    html+=`<div class="imrc">${replied?T.read:T.sent}</div>`;
   }
  });
  if(busy)html+='<div class="imb l ty tl"><i></i><i></i><i></i></div>';
  cl.innerHTML=html;
  if(stick)cl.scrollTop=1e9;
 };

 /* ===== 发送 → 等 AI 回复（AI 回复按换行拆成多个气泡） ===== */
 const pump=async()=>{
  if(busy)return;busy=1;paint(1);
  try{
   while(H().length&&H()[H().length-1].r==='me'){
    const hist=H().map(m=>({r:m.r,c:m.c||(m.img?'[图片]':''),t:m.t})).filter(m=>m.c&&!String(m.c).startsWith('⚠️'));
    const t=String(await ai(c,hist)||'');
    const parts=t.split(/\n+/).map(s=>s.trim()).filter(Boolean),now=Date.now();
    (parts.length?parts:[t||'…']).forEach((s,i)=>H().push({r:'ai',c:s,t:now+i}));
    if(live()){S.imRead[c.id]=Date.now();delete S.imUnread[c.id]}
    save();if(live())paint(1);
   }
  }catch(e){H().push({r:'ai',c:'⚠️ '+e,t:Date.now()});save()}
  busy=0;if(live())paint(1);
 };
 const send=()=>{
  const v=inp.value.trim();if(!v)return;
  inp.value='';bar.classList.remove('has');
  H().push({r:'me',c:v,t:Date.now()});
  delete S.imHide[c.id];S.imRead[c.id]=Date.now();delete S.imUnread[c.id];save();
  paint(1);pump();
 };

 /* ===== 底部弹出选项 ===== */
 const sheet=rows=>{
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="sh">${rows.map(([key,t])=>`<div class="imso" data-k="${key}">${t}</div>`).join('')}<div class="imso cc" data-k="x">${T.cancel}</div></div>`;
  r.appendChild(o);
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.querySelectorAll('.imso').forEach(e=>e.onclick=()=>{
   const key=e.dataset.k;o.remove();
   if(key==='img')pick(v=>{H().push({r:'me',img:v,t:Date.now()});delete S.imHide[c.id];save();paint(1);pump()},720);
   if(key==='bg')pick(v=>{c.imBg=v;save();applyBg()},1080);
   if(key==='bgr'){delete c.imBg;save();applyBg()}
  });
 };

 /* ===== 事件 ===== */
 q('#imcb').onclick=()=>{S.imRead[c.id]=Date.now();save();back&&back()};
 q('#imcn').onclick=()=>sheet([['bg',T.bg]].concat(c.imBg?[['bgr',T.bgR]]:[]));
 q('#imcp').onclick=()=>sheet([['img',T.img]]);
 inp.oninput=()=>bar.classList.toggle('has',!!inp.value.trim());
 inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send()}};
 q('#imsd').onclick=()=>{send();inp.focus()};

 paint(1);
 if(H().length&&H()[H().length-1].r==='me')pump();
}
})();
</script>

<script>
(()=>{
/* ===== 文案 ===== */
const T={bub:'泡泡',scr:'荧幕'};
const ANIM=[['grow','放大'],['shrink','缩小'],['wob','摇晃'],['nod','点头'],['rip','波纹'],['blm','绽放'],['jit','抖动']];
const BUB=[['slam','震撼'],['loud','放大'],['gentle','缩小'],['ink','隐形墨水']];
const SCR=[['heart','爱心'],['balloon','气球'],['confetti','彩纸'],['firework','烟花'],['laser','激光'],['meteor','流星']];
const ico=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const isErr=m=>!!(m&&m.r==='ai'&&String(m.c||'').startsWith('⚠️'));
const rnd=(a,b)=>a+Math.random()*(b-a),pk=a=>a[Math.random()*a.length|0];
const TAU=6.2832;

/* ===== 全屏粒子引擎：每个特效返回 step(dt,t)，返回 false 表示播完 ===== */
const FX={};
const heart=(g,x,y,s,c,a,rot)=>{
 const k=s/2;g.save();g.translate(x,y);g.rotate(rot);g.globalAlpha=a;g.fillStyle=c;g.beginPath();
 g.moveTo(0,k*.9);g.bezierCurveTo(-k*1.6,-k*.2,-k*.7,-k*1.3,0,-k*.45);g.bezierCurveTo(k*.7,-k*1.3,k*1.6,-k*.2,0,k*.9);g.fill();g.restore();
};
FX.heart=(W,H,g,loop)=>{
 const P=[],S=W/390,col=['#ff2d55','#ff5e7e','#ff8fa3','#ff3b6b','#ffc2d1'];
 const add=()=>P.push({x:rnd(-10,W+10),y:H+rnd(20,80),s:rnd(14,44)*S,vy:rnd(120,330)*S,ph:rnd(0,6.3),sw:rnd(8,26)*S,c:pk(col),rot:rnd(-.5,.5)});
 for(let i=0;i<70;i++)add();
 let acc=0;
 return {step(dt,t){
  if(loop||t<2.4){acc+=dt*(t<1.2?90:40);while(acc>=1){add();acc--}}
  for(let i=P.length-1;i>=0;i--){
   const p=P[i];p.y-=p.vy*dt;p.ph+=dt*2.2;
   heart(g,p.x+Math.sin(p.ph)*p.sw,p.y,p.s,p.c,Math.max(0,Math.min(1,(p.y+40)/(H*.25))),p.rot);
   if(p.y<-60)P.splice(i,1);
  }
  return loop||t<2.4||P.length>0;
 }};
};
const balloon=(g,x,y,r,c,ph)=>{
 g.save();g.translate(x,y);
 g.strokeStyle='rgba(120,120,125,.7)';g.lineWidth=1.2;g.beginPath();g.moveTo(0,r*1.25);g.bezierCurveTo(-r*.5*Math.sin(ph),r*2.1,r*.5*Math.sin(ph),r*2.8,0,r*3.5);g.stroke();
 g.fillStyle=c;g.beginPath();g.ellipse(0,0,r*.82,r,0,0,TAU);g.fill();
 g.beginPath();g.moveTo(0,r*1.02);g.lineTo(-r*.14,r*1.25);g.lineTo(r*.14,r*1.25);g.closePath();g.fill();
 g.fillStyle='rgba(255,255,255,.38)';g.beginPath();g.ellipse(-r*.32,-r*.38,r*.17,r*.3,.5,0,TAU);g.fill();
 g.restore();
};
FX.balloon=(W,H,g,loop)=>{
 const P=[],S=W/390,col=['#ff3b30','#ff9500','#ffcc00','#34c759','#5ac8fa','#007aff','#af52de','#ff2d55'];
 const add=()=>P.push({x:rnd(20,W-20),y:H+rnd(60,260),r:rnd(20,34)*S,vy:rnd(70,160)*S,ph:rnd(0,6.3),sw:rnd(6,18)*S,c:pk(col)});
 for(let i=0;i<22;i++)add();
 let acc=0;
 return {step(dt,t){
  if(loop||t<2.5){acc+=dt*(t<1.2?10:4);while(acc>=1){add();acc--}}
  P.sort((a,b)=>a.r-b.r);
  for(let i=P.length-1;i>=0;i--){
   const p=P[i];p.y-=p.vy*dt;p.ph+=dt*1.6;
   balloon(g,p.x+Math.sin(p.ph)*p.sw,p.y,p.r,p.c,p.ph);
   if(p.y<-p.r*4)P.splice(i,1);
  }
  return loop||t<2.5||P.length>0;
 }};
};
FX.confetti=(W,H,g,loop)=>{
 const P=[],S=W/390,col=['#ff3b30','#ff9500','#ffcc00','#34c759','#5ac8fa','#007aff','#af52de','#ff2d55'];
 const add=(x,y,vx,vy)=>P.push({x,y,vx,vy,w:rnd(6,11)*S,h:rnd(10,17)*S,r:rnd(0,6.3),vr:rnd(-9,9),ph:rnd(0,6.3),c:pk(col)});
 const burst=n=>{for(let i=0;i<n;i++){const L=Math.random()<.5;add(L?-8:W+8,H*rnd(.35,.7),(L?1:-1)*rnd(260,640)*S,-rnd(420,880)*S)}};
 const rain=()=>add(rnd(0,W),-16,rnd(-30,30)*S,rnd(60,180)*S);
 burst(100);for(let i=0;i<40;i++)rain();
 let acc=0,nb=2.2;
 return {step(dt,t){
  if(loop&&t>nb){burst(70);nb+=2.2}
  if(loop||t<2.6){acc+=dt*30;while(acc>=1){rain();acc--}}
  for(let i=P.length-1;i>=0;i--){
   const p=P[i];p.vy=Math.min(p.vy+560*S*dt,250*S);p.vx*=1-1.3*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.ph+=dt*9;
   g.save();g.translate(p.x,p.y);g.rotate(p.r);g.scale(1,Math.cos(p.ph));g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();
   if(p.y>H+30)P.splice(i,1);
  }
  return loop||t<2.6||P.length>0;
 }};
};
FX.firework=(W,H,g,loop)=>{
 const R=[],P=[],S=W/390,col=['#ff453a','#ff9f0a','#ffd60a','#32d74b','#64d2ff','#bf5af2','#ff375f','#ffffff'];
 const launch=()=>R.push({x:rnd(W*.15,W*.85),y:H+10,vy:-rnd(560,780)*S,ty:rnd(H*.16,H*.48),c:pk(col)});
 const boom=(x,y,c)=>{for(let i=0;i<72;i++){const a=i/72*TAU+rnd(-.04,.04),v=rnd(70,270)*S;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:rnd(.8,1.4),c:Math.random()<.18?'#fff':c})}};
 let acc=.45;
 return {step(dt,t){
  if(loop||t<3){acc+=dt;if(acc>.5){acc=0;launch();if(Math.random()<.55)launch()}}
  g.fillStyle=`rgba(0,0,0,${.38*Math.min(1,t*3)*Math.min(1,(R.length+P.length)/40)})`;g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='lighter';
  for(let i=R.length-1;i>=0;i--){
   const p=R[i];p.y+=p.vy*dt;g.strokeStyle=p.c;g.lineWidth=2.4*S;g.globalAlpha=.9;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x,p.y+22*S);g.stroke();
   if(p.y<=p.ty){boom(p.x,p.y,p.c);R.splice(i,1)}
  }
  for(let i=P.length-1;i>=0;i--){
   const p=P[i];p.vy+=160*S*dt;p.vx*=1-1.1*dt;p.vy*=1-.6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt/p.d;
   if(p.l<=0){P.splice(i,1);continue}
   g.globalAlpha=p.l;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,2.6*S*(.5+p.l*.5),0,TAU);g.fill();
  }
  g.restore();
  return loop||t<3||R.length>0||P.length>0;
 }};
};
FX.laser=(W,H,g,loop)=>{
 const cols=['#ff2bd6','#00e5ff','#7cff4d','#ffe14d','#8a5bff'],D=3.2;
 return {step(dt,t){
  if(!loop&&t>D)return false;
  const fade=loop?Math.min(1,t*4):Math.min(1,t*4,(D-t)*2);
  g.save();g.fillStyle=`rgba(0,0,0,${.35*fade})`;g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';g.lineCap='round';
  for(let i=0;i<7;i++){
   const a=-Math.PI/2+Math.sin(t*1.6+i*.9)*(i%2?1:-1)+(i-3)*.12,x0=W*(.15+.7*i/6),len=Math.hypot(W,H)*1.2,c=cols[i%cols.length];
   g.strokeStyle=c;g.globalAlpha=.9*fade;g.shadowColor=c;g.shadowBlur=22;g.lineWidth=3+(i%3);
   g.beginPath();g.moveTo(x0,H+10);g.lineTo(x0+Math.cos(a)*len,H+10+Math.sin(a)*len);g.stroke();
  }
  g.restore();return true;
 }};
};
FX.meteor=(W,H,g,loop)=>{
 const M=[],S=W/390,D=3.6,st=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H*.85),r:rnd(.6,1.8)*S,ph:rnd(0,6.3)}));
 const add=()=>{const a=rnd(.6,.9),v=rnd(560,960)*S;M.push({x:rnd(W*.25,W*1.15),y:rnd(-60,H*.35),vx:-Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(120,240)*S})};
 let acc=0;
 return {step(dt,t){
  const fade=Math.max(0,loop?Math.min(1,t*3):Math.min(1,t*3,(D+.8-t)*1.5));
  g.save();g.fillStyle=`rgba(4,8,28,${.55*fade})`;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';
  st.forEach(s=>{g.globalAlpha=fade*(.35+.65*Math.abs(Math.sin(t*2+s.ph)));g.beginPath();g.arc(s.x,s.y,s.r,0,TAU);g.fill()});
  if(loop||t<D){acc+=dt*(t<.8?9:4.5);while(acc>=1){add();acc--}}
  for(let i=M.length-1;i>=0;i--){
   const p=M[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
   const sp=Math.hypot(p.vx,p.vy),nx=p.vx/sp,ny=p.vy/sp,gr=g.createLinearGradient(p.x,p.y,p.x-nx*p.l,p.y-ny*p.l);
   gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(160,190,255,0)');
   g.globalAlpha=fade;g.strokeStyle=gr;g.lineWidth=2.6*S;g.lineCap='round';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-nx*p.l,p.y-ny*p.l);g.stroke();
   g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,2.2*S,0,TAU);g.fill();
   if(p.x<-300||p.y>H+300)M.splice(i,1);
  }
  g.restore();
  return loop||t<D||M.length>0;
 }};
};
/* loop=true 是预览（一直循环），false 是发送（播一遍就移除画布） */
const fxRun=(type,cv,loop)=>{
 const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.parentNode.clientWidth,H=cv.parentNode.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
 const g=cv.getContext('2d');g.scale(dpr,dpr);
 const E=FX[type](W,H,g,loop);
 let last=performance.now(),t0=last,stop=0,raf=0;
 const go=now=>{
  if(stop||!cv.isConnected)return;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  g.clearRect(0,0,W,H);
  if(!E.step(dt,(now-t0)/1000)&&!loop){cv.remove();return}
  raf=requestAnimationFrame(go);
 };
 raf=requestAnimationFrame(go);
 return ()=>{stop=1;cancelAnimationFrame(raf);g.clearRect(0,0,W,H)};
};

};

   const m=hs[i];if(!m||m.img||!m.c)return;

 const closePanel=()=>{if(panel){panel.remove();panel=null}};

 /* ===== 用特别效果传送：全屏遮罩（泡泡 / 荧幕） ===== */
 const openFx=()=>{
  if(box.querySelector('.imfo'))return;
  closePanel();inp.blur();
  const txt=(inp.value.trim()||'預覽').slice(0,60);
  const opt=(t,key,l)=>`<div class="imfop" data-t="${t}" data-k="${key}"><span>${l}</span><i></i></div>`;
  const o=document.createElement('div');o.className='imfo';

   <div class="imfb"><div class="imft2" id="imft2">

  o.querySelector('#imfsd').onclick=()=>{
   halt();
   pend.bub=sel.t==='bub'?sel.k:'';pend.scr=sel.t==='scr'?sel.k:'';
   o.remove();fired=0;btn.click();
   pend.bub='';pend.scr='';

}
})();

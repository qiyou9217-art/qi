  return `<div class="dy-p" data-id="${p.id}"><div class="dy-h"><div class="dy-av" style="background-image:url('${a.av}')"></div><div class="dy-hn"><b>${esc(a.id)}${V}</b><small>${fmt(p.ts)}${p.priv?' · 私密':''}</small></div>${p.priv?'':`<div class="dy-pl" data-a="plus">${svg(I.pl)}</div>`}</div>
  <div class="dy-tx">${esc(p.text)}</div>${n?`<div class="dy-im c${n===1?1:n===2||n===4?2:3}">${p.imgs.map(s=>`<i style="background-image:url('${s}')"></i>`).join('')}</div>`:''}
  <div class="dy-ft"><span data-a="cm">${svg(I.cm)}<i>${cm.length}</i></span><span data-a="lk" class="${p.liked?'on':''}">${svg(I.ht)}<i>${num(p.likes)}</i></span><span data-a="fw">${svg(I.fw)}</span><span class="dy-vw">${svg(I.ey)}<i>${num(p.views)}</i></span></div>
  ${xtra(p)}</div>`};
 const hue=x=>{let h=0;for(const ch of String(x))h=(h*31+ch.charCodeAt(0))%360;return h};
 const cav=c=>{if(c.cid==='me')return `<div class="dy-ca" style="background-image:url('${S.me.avatar||DEF}')"></div>`;
  const k=S.contacts.find(x=>x.id===c.cid);if(k)return `<div class="dy-ca" style="background-image:url('${k.avatar||DEF}')"></div>`;
  const h=hue(c.n);return `<div class="dy-ca" style="background:hsl(${h},60%,86%);color:hsl(${h},40%,32%)">${esc(String(c.n).slice(0,1))}</div>`};
 const cmItem=(c,rt)=>`<div class="dy-cr${rt&&rt.id===c.id?' sel':''}" data-a="rc" data-cid="${c.id}">${cav(c)}<div><div class="dy-cn"><b>${esc(c.n)}</b><small>${fmt(c.t)}</small></div><p>${c.to?`回复 <em>${esc(c.to)}</em>：`:''}${esc(c.c)}</p></div></div>`;
 /* 动态详情页：上面是动态主内容，下面是评论 */
 const detH=p=>{const cm=p.comments||[],rt=reply[p.id];return cardH(p)+`<div class="dy-cmh">评论 ${cm.length}${rt?'':' · 点某条评论可以回复 TA'}</div>`+(cm.map(c=>cmItem(c,rt)).join('')||'<p class="dy-no">还没有评论，来说点什么吧</p>')};
 const detBar=p=>{const rt=reply[p.id];return `<div class="dy-dbar">${rt?`<div class="dy-rt"><span>回复 ${esc(rt.n)}</span><b>✕</b></div>`:''}<div class="dy-ci"><input placeholder="${rt?'回复 '+esc(rt.n):'写评论…'}"><button>发送</button></div></div>`};
 const refresh=id=>det===id?render():redraw(id);
 const redraw=id=>{const el=r.querySelector(`.dy-p[data-id="${id}"]`),p=S.dfeed.find(x=>x.id===id);if(el&&p)el.outerHTML=cardH(p)};

 /* 好友判定：只有在 Diary 发布过动态的角色才算好友 */
 const dfriends=()=>{const cnt={};S.dfeed.forEach(p=>{if(p.uid!=='me')cnt[p.uid]=(cnt[p.uid]||0)+1});return friends().filter(c=>cnt[c.id]).map(c=>({c,n:cnt[c.id]}))};
 const row=(n,ic,t,c)=>`<div class="dy-row" data-n="${n}">${svg(ic)}<span>${t}</span><em>${c}</em>${svg(I.ch)}</div>`;
 const subH=t=>`<div class="dy-sub"><span data-n="bk">${svg(I.bk)}返回</span><b>${t}</b><i></i></div>`;
 const meH=()=>{const mine=S.dfeed.filter(p=>p.uid==='me').length,fr=dfriends().length,lk=S.dfeed.filter(p=>p.liked).length;
  return `<div class="dy-pf"><div class="dy-av xl" data-n="av" style="background-image:url('${S.me.avatar||DEF}')"></div><h2 class="dy-nm" data-n="nm">${esc(S.me.name)}</h2></div>
  <div class="dy-card"><div class="dy-sr"><div class="dy-sg"><div>${svg(I.doc)}<b>${mine}</b><small>发布内容</small></div><div>${svg(I.fan)}<b data-fans>${num(S.dmeta.fans)}</b><small>被关注</small></div><div>${svg(I.fr)}<b>${fr}</b><small>好友</small></div></div><div class="dy-cv" data-n="cv"${S.dmeta.cover?` style="background-image:url('${S.dmeta.cover}')"`:''}>${S.dmeta.cover?'':svg(I.pl)}</div></div><div class="dy-sig" data-n="sg">${S.me.sign?esc(S.me.sign):'点击编辑个性签名'}</div></div>
  <div class="dy-card dy-mn">${row('mine',I.bkm,'我的日记',mine)}${row('likes',I.ht,'我的喜欢',lk)}${row('fr',I.fr,'好友列表',fr)}</div>
  <div class="dy-card dy-ext${EXT.length?' has':''}">${EXT.length?EXT.map((x,i)=>row('ext'+i,x.icon||I.pl,esc(x.name||'扩展'),'')).join(''):'下面功能待开发'}</div>`};
 const friendsH=()=>{const a=dfriends();return subH('好友列表')+'<p class="dy-tip">在 Diary 发布过动态的角色才会成为好友，点击可发私信</p>'+(a.map(({c,n})=>`<div class="dy-fr" data-n="f:${c.id}"><div class="dy-av" style="background-image:url('${c.avatar||DEF}')"></div><div><b>${esc(c.name)}${V}</b><small>${n} 条动态${c.sign?' · '+esc(c.sign):''}</small></div>${svg(I.ch)}</div>`).join('')||'<p class="empty">还没有好友发布过动态</p>')};
 const subList=a=>subH(sub==='mine'?'我的日记':'我的喜欢')+`<div id="dyl">${a.slice(0,shown).map(cardH).join('')}</div>`+(a.length?'':`<p class="empty">${sub==='mine'?'还没有发布过内容':'还没有点赞过的动态'}</p>`);


 /* ===== 私密页：顶部毛玻璃状态卡 + 好友列表 + 上帝视角私密日记 ===== */
 const glassH=()=>{const th=S.dmeta.thumbs,ic=(S.dmeta.status||{}).icon||'🟢';
  const sq=i=>`<div class="dy-sq dy-ph" data-n="th${i}"${th[i]?` style="background-image:url('${th[i]}')"`:''}>${th[i]?'':svg(I.pl)}</div>`;
  return `<div class="dy-gs"><div class="dy-sq dy-u"><div class="dy-uh"><div class="dy-av" style="background-image:url('${S.me.avatar||DEF}')"></div><span class="dy-si" data-n="st">${ic}</span></div><b>${esc(myId())}</b></div>${sq(0)}${sq(1)}<div class="dy-tall">+3</div></div>`};
 const stEdit=()=>{const cur=(S.dmeta.status||{}).icon||'🟢',EM=['🟢','😊','🥰','😴','🤔','😎','🥲','🌙','🔥','🎧','📖','☕'];let ic=cur;
  const o=modal(r,'编辑状态图标',`<div class="dy-chips dy-wrap" id="se">${EM.map(x=>`<i class="${x===ic?'on':''}">${x}</i>`).join('')}</div><input id="sx" maxlength="4" placeholder="或输入任意表情作为状态图标">`,o=>{const c=o.querySelector('#sx').value.trim();S.dmeta.status={icon:c||ic};save();render()});
  o.querySelectorAll('#se i').forEach(i=>i.onclick=()=>{ic=i.textContent;o.querySelector('#sx').value='';o.querySelectorAll('#se i').forEach(x=>x.classList.toggle('on',x===i))})};
 const listH=()=>{const a=dfriends();
  return `<div class="dy-lh"><b>好友 ${a.length}</b><span class="dy-eye${god?' on':''}" data-n="god">${svg(I.eoff)}</span></div>${god?'<p class="dy-tip">已解锁上帝视角：点击好友，查看 TA 的私密日记</p>':''}`+
  (a.length?`<div class="dy-card dy-fl2">${a.map(({c})=>`<div class="dy-fr2${god?' god':''}" data-n="${god?'sec':'chat'}:${c.id}"><div class="dy-av" style="background-image:url('${c.avatar||DEF}')"></div><b>${esc(c.name)}</b>${svg(god?I.eoff:I.ch)}</div>`).join('')}</div>`:'<p class="empty">还没有好友发布过动态<br>让好友在主页生成动态后，他们就会出现在这里</p>')};
 const privH=()=>glassH()+listH();
 const sdate=t=>new Date(t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
 const secH=()=>{const c=S.contacts.find(x=>x.id===secId);if(!c){sub=null;return privH()}
  const arr=(c.secrets||[]).slice().sort((x,y)=>y.ts-x.ts);
  return `<div class="dy-sub"><span data-n="bk">${svg(I.bk)}返回</span><b>私密日记</b><span class="rt" data-n="gen">${svg(I.rf)}</span></div><div class="dy-sh"><div class="dy-av" style="background-image:url('${c.avatar||DEF}')"></div><div><b>${esc(c.name)}</b><small>${svg(I.lk)}仅你可见 · 上帝视角</small></div></div>`+
  (secBusy?'<div class="dy-sc dy-ld">正在翻开 TA 的日记…</div>':'')+
  arr.map(e=>`<div class="dy-sc"><div class="dy-sd">${sdate(e.ts)}</div><p>${esc(e.text)}</p><div class="dy-act"><span class="rd" data-n="sdl:${e.id}">删除</span></div></div>`).join('')+
  (!arr.length&&!secBusy?'<p class="empty">还没有私密日记，点右上角让 TA 写一篇</p>':'')+
  `<div class="dy-gen" data-n="gen">${svg(I.rf)}再偷看一篇</div>`};
 /* 私密日记完全按人设生成；只存在角色的 secrets 里，不会进入聊天提示词，角色并不知道你能看到 */
 const genSecret=async c=>{
  if(secBusy)return;secBusy=1;render();
  const old=(c.secrets||[]).slice(-3).map(e=>'· '+e.text.slice(0,40)).join('\n');
  const q=`你现在要写一篇【只有你自己知道的私密日记】，它被锁在抽屉里，绝不会给${S.me.name}看。请完全根据你的人设，写下你不会、也不敢告诉${S.me.name}的秘密：可以是没有告诉对方的事件、真实的内心独白、占有欲、嫉妒、暗地里的小动作或不为人知的一面（如果你的人设本来就有阴暗面，请集中体现；如果人设温和，就写不敢说出口的情感和小秘密）。结合你们最近的聊天和现在的时间，用第一人称、符合你人设的口吻写，像真的日记，150到300字，开头不要写日期，不要提到“上帝视角”“用户”“Diary”这些词。${old?'你之前已经写过这些，这次请写不同的内容：\n'+old+'\n':''}只输出日记正文。`;
  try{const t=clean(await ai(c,[...hist(c),{r:'me',c:'（系统指令：请不要回复我，'+q+'）'}]));(c.secrets=c.secrets||[]).push({id:uid(),ts:Date.now(),text:t});save()}
  catch(e){toast(String(e))}
  secBusy=0;if(tab==='priv'&&sub==='sec'&&secId===c.id)render()};

 /* 个人资料编辑：头像 / 昵称 / 封面 / 个签 */
 const focusIn=(o,id)=>setTimeout(()=>{const i=o.querySelector(id);if(i){i.focus();i.select&&i.select()}},60);
 const nav=k=>{
  if(k==='av')pick(v=>{S.me.avatar=v;save();render()},320);
  else if(k==='cv')pick(v=>{S.dmeta.cover=v;save();render()},480);
  else if(k==='nm'){const o=modal(r,'修改昵称',`<input id="vn" maxlength="20" value="${esc(S.me.name)}">`,o=>{const v=o.querySelector('#vn').value.trim();if(!v){toast('昵称不能为空');return false}S.me.name=v;save();render()});focusIn(o,'#vn')}
  else if(k==='sg'){const o=modal(r,'个性签名',`<textarea id="vs" rows="3" maxlength="60" placeholder="写一句个性签名…">${esc(S.me.sign||'')}</textarea>`,o=>{S.me.sign=o.querySelector('#vs').value.trim();save();render()});focusIn(o,'#vs')}
  else if(k==='bk'){sub=null;secId=null;shown=8;render()}
  else if(k==='god'){god=!god;render()}
  else if(k==='st')stEdit();
  else if(k==='th0'||k==='th1')pick(v=>{S.dmeta.thumbs[+k[2]]=v;save();render()},360);
  else if(k==='dbk'){det=null;anim=1;render()}
  else if(k.startsWith('chat:'))openDM(k.slice(5));
  else if(k.startsWith('sec:')){const c=S.contacts.find(x=>x.id===k.slice(4));if(c){sub='sec';secId=c.id;anim=1;render();if(!(c.secrets||[]).length)genSecret(c)}}
  else if(k==='gen'){const c=S.contacts.find(x=>x.id===secId);c&&genSecret(c)}
  else if(k.startsWith('sdl:')){const c=S.contacts.find(x=>x.id===secId),id=k.slice(4);c&&modal(r,'删除这篇私密日记','<p class="tip">确定删除吗？删除后无法恢复。</p>',()=>{c.secrets=(c.secrets||[]).filter(e=>e.id!==id);save();render()})}
  else if(k==='mine'||k==='likes'||k==='fr'){sub=k;shown=8;anim=1;render()}
  else if(k.startsWith('f:'))openDM(k.slice(2));
  else if(k.startsWith('ext')){const x=EXT[+k.slice(3)];x&&x.fn&&x.fn(r)}
 };

 /* ===== Diary 私信：App 内的一对一私聊（独立于微信，聊天记录存在 S.chats['dy'+id]）===== */
 const dmList=id=>S.chats['dy'+id]=S.chats['dy'+id]||[];
 const dst=id=>dmSt[id]=dmSt[id]||{timer:0,busy:0};
 const tlab=t=>{const n=new Date(),d=new Date(t),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  if(n.toDateString()===d.toDateString())return hm;
  if(new Date(n-864e5).toDateString()===d.toDateString())return '昨天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm};
 const dmAv=c=>`<div class="dy-av s" style="background-image:url('${c.avatar||DEF}')"></div>`;
 const typing=c=>{const s=dst(c.id);return s.timer||s.busy};
 const typingH=c=>typing(c)?`<div class="dy-mr sa">${dmAv(c)}<div class="dy-bb dy-ty"><i></i><i></i><i></i></div></div>`:'';
 const msgsH=c=>{const a=dmList(c.id);if(!a.length)return '<p class="dy-dmempty">打个招呼吧<br>这里是你们在 Diary 里的私聊</p>';let out='',last=0;
  a.forEach(m=>{if(m.t-last>30*60000)out+=`<div class="dy-ts">${tlab(m.t)}</div>`;last=m.t;out+=`<div class="dy-mr ${m.r==='me'?'sm':'sa'}">${m.r==='me'?'':dmAv(c)}<div class="dy-bb">${esc(m.c)}</div></div>`});return out};
 const dmDraw=c=>{const ml=r.querySelector('#dml');if(!ml||dm!==c.id)return;ml.innerHTML=msgsH(c)+typingH(c);ml.scrollTop=ml.scrollHeight;
  const sm=r.querySelector('.dy-dmn small');if(sm)sm.textContent=typing(c)?'对方正在输入…':'Diary 私信'};
 const renderDM=()=>{const c=S.contacts.find(x=>x.id===dm);if(!c){dm=null;return render()}
  r.innerHTML=`<div class="dy-dm"><div class="dy-dmh"><span data-k="bk">${svg(I.bk)}</span>${dmAv(c)}<div class="dy-dmn"><b>${esc(c.name)}${V}</b><small>Diary 私信</small></div><span data-k="cl">${svg(I.tr)}</span></div><div class="dy-ml" id="dml"></div><div class="dy-mi"><input id="dmi" placeholder="发消息…" maxlength="500" enterkeyhint="send"><button data-k="sd">${svg(I.snd)}</button></div></div>`;
  dmDraw(c);
  r.querySelector('[data-k=bk]').onclick=()=>{dm=null;anim=1;render()};
  r.querySelector('[data-k=cl]').onclick=()=>modal(r,'清空聊天记录','<p class="tip">确定清空和 '+esc(c.name)+' 的私聊记录吗？</p>',()=>{S.chats['dy'+c.id]=[];save();dmDraw(c)});
  r.querySelector('[data-k=sd]').onclick=()=>dmSend(c);
  r.querySelector('#dmi').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)dmSend(c)}};
 const openDM=id=>{const c=S.contacts.find(x=>x.id===id);if(!c)return;dm=id;renderDM()};
 const dmSend=c=>{const i=r.querySelector('#dmi'),v=i&&i.value.trim();if(!v)return;
  dmList(c.id).push({r:'me',c:v,t:Date.now()});save();i.value='';
  const st=dst(c.id);clearTimeout(st.timer);
  const fire=()=>{if(st.busy){st.timer=setTimeout(fire,800);return}st.timer=0;dmReply(c)};   /* 连发几条时稍等一下，合成一次回复 */
  st.timer=setTimeout(fire,1200);dmDraw(c)};
 const DMI=()=>`\n\n（系统提示：这是你和${S.me.name}在 Diary App 里的私信聊天，不是微信。请完全按你的人设像真人发私信一样回复：口语化，一次回复 1~3 条短消息，用 <|message|> 分隔，不要加引号和旁白，也不要提到这条系统提示。）`;
 const dmReply=async c=>{const st=dst(c.id);
  const H=dmList(c.id).slice(-30).map(m=>({r:m.r,c:m.c}));if(!H.length)return;
  st.busy=1;dmDraw(c);H[H.length-1]={...H[H.length-1],c:H[H.length-1].c+DMI()};
  try{const t=String(await ai(c,H,'dm'));
   const parts=t.split(/\s*<\|message\|>\s*/).map(clean).filter(Boolean).slice(0,4);if(!parts.length)parts.push('……');
   for(let i=0;i<parts.length;i++){
    if(i){st.busy=1;dmDraw(c);await new Promise(x=>setTimeout(x,Math.min(1800,500+parts[i].length*60)))}
    st.busy=0;dmList(c.id).push({r:'ai',c:parts[i],t:Date.now()});save();dmDraw(c)}
  }catch(e){toast(String(e))}
  st.busy=0;dmDraw(c)};

 const render=()=>{
  clearInterval(tick);
  if(dm)return renderDM();
  const kv=det&&r.querySelector('.dy-ci input')?r.querySelector('.dy-ci input').value:'',sct=det&&det===lastDet&&r.querySelector('#dyb')?r.querySelector('#dyb').scrollTop:0;
  const dp=det&&S.dfeed.find(x=>x.id===det);if(det&&!dp)det=null;
  const top=dp?`<div class="dy-top dy-dt"><span data-n="dbk">${svg(I.bk)}返回</span><h1>动态详情</h1><i></i></div>`:tab==='me'||tab==='priv'?`<div class="dy-top"><h1>${tab==='me'?'我的':'私密'}</h1></div>`:`<div class="dy-top"><h1>Diary</h1><div class="dy-tr"><div class="dy-me"><div class="dy-av" style="background-image:url('${S.me.avatar||DEF}')"></div><div><b>${esc(myId())}</b><small>${esc(S.me.sign||'')}</small></div></div><div class="dy-pen" id="pen">${svg(I.pen)}</div></div></div>`;
  const a=feed();
  const body=dp?detH(dp):tab==='priv'?(sub==='sec'?secH():privH()):tab==='me'?(sub==='fr'?friendsH():sub?subList(a):meH()):`<div id="dyl">${a.slice(0,shown).map(cardH).join('')}</div>`+(!a.length&&tab!=='me'?`<p class="empty">还没有动态，点右上角的笔来发布或让好友生成</p>`:'');
  const bar=dp?detBar(dp):`<div class="dy-bar">${[['home','主页',I.hm],['priv','私密',I.lk],['me','我的',I.us]].map(([k,n,d])=>`<b data-t="${k}" class="${tab===k?'on':''}">${svg(d)}<span>${n}</span></b>`).join('')}</div>`;
  r.innerHTML=top+`<div class="body dy${anim?' in':''}${dp?' dd':''}" id="dyb">${body}</div>`+bar;anim=0;
  const b=r.querySelector('#dyb');
  r.querySelectorAll('.dy-top [data-n]').forEach(x=>x.onclick=()=>nav(x.dataset.n));
  lastDet=dp?dp.id:null;
  if(dp&&sct){b.style.scrollBehavior='auto';b.scrollTop=sct;setTimeout(()=>b.style.scrollBehavior='',50)}
  if(dp){const inp=r.querySelector('.dy-ci input');if(kv)inp.value=kv;const cr=r.querySelector('.dy-rt b');if(cr)cr.onclick=()=>{delete reply[dp.id];render()};r.querySelector('.dy-ci button').onclick=()=>sendC(dp);inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)sendC(dp)}}
  const pen=r.querySelector('#pen');if(pen)pen.onclick=openPub;
  r.querySelectorAll('.dy-bar b').forEach(x=>x.onclick=()=>{if(tab===x.dataset.t){if(sub){sub=null;secId=null;shown=8;render()}return}tab=x.dataset.t;sub=null;secId=null;shown=8;render()});
  b.onclick=e=>{const nv=e.target.closest('[data-n]');if(nv){nav(nv.dataset.n);return}const t=e.target.closest('[data-a]');if(!t)return;const el=t.closest('[data-id]');let p=el&&S.dfeed.find(x=>x.id===el.dataset.id);if(!p&&dp&&t.dataset.a==='rc')p=dp;if(p)act(t.dataset.a,p,t,el)};
  /* 长按任意动态卡片：弹出删除确认 */
  let lp,lx,ly,lpDone=0;const clr=()=>clearTimeout(lp);
  b.onpointerdown=e=>{const el=e.target.closest('.dy-p');if(!el||e.target.closest('input,button,.dy-pm'))return;lx=e.clientX;ly=e.clientY;clr();
   lp=setTimeout(()=>{lpDone=1;setTimeout(()=>lpDone=0,700);navigator.vibrate&&navigator.vibrate(12);delPost(el.dataset.id)},550)};
  b.onpointermove=e=>{if(lp&&Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly)>10)clr()};

 const TOPIC=['窗外的天气和光线','今天读到或听到的东西','路上的小见闻','夜里突然的感慨','手头在做的事','一顿饭或一杯饮品','关于旧物或旧事的回忆','对某件艺术品或建筑的感受'];

/* ===== 最外层：同一个角色的 AI 请求排队依次执行（内层补丁会临时改人设，同时调用会互相写乱）；AI 在聊天时可读取 Diary 动态 ===== */
(function(){
 const prev=window.ai,q={},strip=s=>String(s||'').replace(/\n?⟦Diary⟧[\s\S]*?⟦\/Diary⟧/g,'');
 const run=(c,hist,mode)=>{
  if(c.persona)c.persona=strip(c.persona);
  const ps=mode?[]:(S.dfeed||[]).filter(p=>!p.priv&&p.text).sort((a,b)=>b.ts-a.ts).slice(0,5);
  if(!ps.length)return prev(c,hist,mode);
  const nm=p=>p.uid==='me'?S.me.name:((S.contacts.find(x=>x.id===p.uid)||{}).name||p.n||'某人');
  const old=c.persona;
  c.persona=(old||'')+'\n⟦Diary⟧最近的 Diary 动态（你们都能看到，聊天时可以自然地提起，不必刻意）：\n'+ps.map(p=>nm(p)+'：'+String(p.text).slice(0,60)).join('\n')+'⟦/Diary⟧';
  return Promise.resolve().then(()=>prev(c,hist,mode)).finally(()=>{c.persona=old})};
 window.ai=function(c,hist,mode){
  if(!c||!c.id)return prev(c,hist,mode);
  const wait=Promise.race([(q[c.id]||Promise.resolve()).catch(()=>{}),new Promise(r=>setTimeout(r,60000))]);
  const t=wait.then(()=>run(c,hist,mode));q[c.id]=t;return t};
})();

 };

<script>

const p2=n=>String(n).padStart(2,'0');

/* ===== 一天从早上 5 点算起（凌晨 0~5 点仍算前一天），offset = 距 5:00 的分钟数 ===== */
const off=(h,m)=>((h*60+m-300)%1440+1440)%1440;
const dayKey=d=>{const x=new Date(d.getTime()-5*36e5);return `${x.getFullYear()}-${p2(x.getMonth()+1)}-${p2(x.getDate())}`};

const genderOf=c=>{
 const t=(c.persona||'')+' '+(c.sign||'');
 let m=t.match(/性别[:：\s]*([男女])/);if(m)return m[1]==='女'?'她':'他';
 if(/女性|女生|女孩|少女|姐姐|妹妹|小姐|女人|女朋友|她是/.test(t)&&!/男性|男生|男孩|少年|哥哥|弟弟|先生|男人|男朋友|他是/.test(t))return '她';
 if(/男性|男生|男孩|少年|哥哥|弟弟|先生|男人|男朋友|他是/.test(t)&&!/女性|女生|女孩|少女|姐姐|妹妹|小姐|女人|女朋友|她是/.test(t))return '他';
 return 'TA';
};

const parse=(txt,nowOff)=>{
 const out=[];
 String(txt).split(/\n+/).forEach(l=>{

  out.push({h,m:mi,o,x:cl(m[3]),v:cl(m[4])});
 });

const prompt=(c,now)=>{

格式严格：每行一条，用竖线分隔：时间|我做的事|心声
- 时间用 24 小时制 H:MM；

- “心声”是你做这件事时联想到${u}而产生的真实想法，第一人称，不超过 25 字，要随机出现：大约一半的事情没有心声，没有就留空（保留最后一个竖线）；心声要符合你的人设、性格，以及你对${u}的好感度和占有欲；

只输出这些行，不要标题、序号、解释、引号和星号。严禁出现：丫头、小没良心、小东西。）`;
};

<script>
(()=>{
const ap=window.phoneApps.find(a=>a.k==='wechat');
const REFRESH='<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>';
const p2=n=>String(n).padStart(2,'0');
ap.st={sub:null,busy:0};
ap.enter=()=>{ap.st={sub:null,busy:0}};
ap.gray=true;ap.hideWho=true;
ap.title=c=>{const s=ap.st.sub;if(!s)return '微信';if(s==='user')return userName(c);const k=(S.pdata[c.id]||{}).wx;const x=k&&k.list.find(y=>y.id===s);return x?x.name:'微信'};
ap.back=()=>{if(ap.st.sub){ap.st.sub=null;return true}return false};
ap.tool=c=>ap.st.sub?null:{icon:REFRESH,label:'刷新',run:(ctx,btn)=>refresh(ctx,btn)};

/* ===== 时间显示 ===== */
const day=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const tShort=t=>{const d=new Date(t),n=new Date(),k=Math.round((day(n)-day(d))/864e5),hm=p2(d.getHours())+':'+p2(d.getMinutes());
 if(k<=0)return hm;if(k===1)return '昨天';if(k<7)return '周'+'日一二三四五六'[d.getDay()];return `${d.getMonth()+1}/${d.getDate()}`};
const tLong=t=>{const d=new Date(t),k=Math.round((day(new Date())-day(d))/864e5),hm=p2(d.getHours())+':'+p2(d.getMinutes());
 return k<=0?hm:k===1?'昨天 '+hm:`${d.getMonth()+1}月${d.getDate()}日 ${hm}`};

/* ===== User 行：以 Char 的第一视角，用 Char 给 User 的备注 / 昵称 ===== */
const userName=c=>c.myRemark||c.myName||S.me.name;
const plain=m=>{
 if(m.img)return '[图片]';if(m.card)return '[音乐邀请]';
 const x=typeof m.c==='string'?m.c:'';
 return x.replace(/^【语音】.*/,'[语音]').replace(/^【图片】.*/,'[图片]').replace(/^【转账】.*/,'[转账]').replace(/^【表情包】.*/,'[表情]').replace(/^【通话】.*/,'[通话]').replace(/^【线下】.*/,'[线下]').replace(/\n[\s\S]*$/,'').trim()};
const chatOf=c=>(S.chats['wx'+c.id]||[]).filter(m=>!m.rc&&(m.c||m.img||m.card)&&!String(m.c||'').startsWith('【好友申请】'));
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};
const av=(name,url)=>url?`<div class="pw-av" style="background-image:url('${url}')"></div>`:`<div class="pw-av" style="background:hsl(${hue(name)},38%,62%)">${esc([...name][0]||'?')}</div>`;
const userAv=c=>c.myAv||S.me.avatar||DEF;

/* ===== 列表 ===== */
const list=(box,c,ctx)=>{
 const H=chatOf(c),last=H[H.length-1],wx=(S.pdata[c.id]||{}).wx,un=userName(c);
 const row=(id,a,name,pre,t,top)=>`<button class="pw-r${top?' pw-pin':''}" data-id="${id}">${a}<div class="pw-m"><b>${esc(name)}</b><small>${esc(pre)}</small></div><span class="pw-t">${esc(t)}</span></button>`;
 const items=wx?wx.list.slice().sort((a,b)=>b.ts-a.ts):[];
 box.innerHTML=`<div class="pw-card">${row('user',av(un,userAv(c)),un,last?plain(last):'还没有聊天记录',last&&last.t?tShort(last.t):'',1)}${items.map(x=>row(x.id,av(x.name,''),x.name,x.last,tShort(x.ts))).join('')}</div>`
  +(wx?'':'<p class="pv-ph" style="margin-top:50px">点击右上角刷新<br>加载 TA 的好友列表</p>');
 box.querySelectorAll('.pw-r').forEach(b=>b.onclick=()=>{ap.st.sub=b.dataset.id;ctx.redraw()});
};

/* ===== 聊天页 ===== */
const bubbles=(box,rows,mineAv,theirAv,theirName)=>{
 let pt=0,out='';
 rows.forEach(m=>{
  if(m.t&&(!pt||m.t-pt>5*60000)){out+=`<div class="pw-tm">${tLong(m.t)}</div>`}
  if(m.t)pt=m.t;
  out+=`<div class="pw-g${m.me?' pw-me':''}">${m.me?mineAv:theirAv}<div class="pw-b">${esc(m.x)}</div></div>`});
 box.innerHTML=`<div class="pw-ch">${out||'<p class="pv-ph">还没有聊天记录</p>'}</div>`;
};
const BZ=new Set();
const detail=async(box,c,ctx,x)=>{
 if(!x.msgs){
  box.innerHTML='<p class="pv-ph">正在生成聊天记录…</p>';
  if(BZ.has(x.id))return;BZ.add(x.id);
  try{
   const t=await ai(c,[...recent(c),{r:'me',c:chatQ(c,x)}],'dy');
   const ms=parseChat(t,x);if(!ms.length)throw '没有生成出有效内容';
   x.msgs=ms;save();
  }catch(e){BZ.delete(x.id);if(ap.st.sub===x.id&&box.isConnected)box.innerHTML=`<p class="pv-ph"><b>生成失败</b>${esc(e&&e.message||e)}<br><button class="btn g" id="pwr" style="margin-top:14px;padding:8px 22px">重试</button></p>`,box.querySelector('#pwr').onclick=()=>detail(box,c,ctx,x);return}
  BZ.delete(x.id);
  if(!(ap.st.sub===x.id&&box.isConnected))return;
 }
 bubbles(box,x.msgs,av(c.name,c.avatar||''),av(x.name,''),x.name);
 const bd=box.closest('.pv-bd');if(bd)bd.scrollTop=bd.scrollHeight;
};
const userChat=(box,c)=>{
 const rows=chatOf(c).slice(-40).map(m=>({me:m.r==='ai',x:plain(m)||'[消息]',t:m.t||0}));
 bubbles(box,rows,av(c.name,c.avatar||''),av(userName(c),userAv(c)),userName(c));
 const bd=box.closest('.pv-bd');if(bd)bd.scrollTop=bd.scrollHeight;
};

ap.render=(box,ctx)=>{
 const c=ctx.friend,s=ap.st.sub;
 if(!s)return list(box,c,ctx);
 if(s==='user')return userChat(box,c);
 const wx=(S.pdata[c.id]||{}).wx,x=wx&&wx.list.find(y=>y.id===s);
 if(!x){ap.st.sub=null;return list(box,c,ctx)}
 detail(box,c,ctx,x);
};

/* ===== AI：最近聊天作为背景 ===== */
const recent=c=>chatOf(c).slice(-10).filter(m=>typeof m.c==='string').map(m=>({r:m.r,c:m.c}));
const BAN='严禁出现：丫头、小没良心、小东西。';

const allQ=(c,now)=>{
 const u=userName(c);
 return `（系统指令：请不要回复我，现在你要一次性生成【你自己微信里的好友列表，以及你和每个好友的聊天记录】。当前时间是 ${p2(now.getHours())}:${p2(now.getMinutes())}。
请生成 5～7 个联系人（不要包含${u}，${u}已经单独置顶了）。
输出格式严格如下，每个联系人先写一行联系人信息，再写 3～6 行你和 TA 的聊天记录，然后写下一个联系人：
#你给对方的备注名|对方和你的关系|最后一条消息距现在多少分钟（整数，有长有短，从几分钟到几天）
我|你说的内容
对方|对方说的内容
（聊天行按时间先后排列，“我”是你本人，最后一行就是微信列表里显示的最后一条消息。）
【硬性规则，必须严格遵守】
1. 联系人必须严格根据你的人设和世界观设定里“明确写明”的人际关系来生成（例如人设写明有哥哥、助理、特助，就必须出现对应的人）。
2. 严禁无中生有、违背人设的基础背景：人设写明或暗示你是孤儿 / 父母双亡 / 没有父母，绝对不能出现父母、爸妈等；你不是学生（已毕业或已工作），绝对不能出现老师、同学；其他类似的基础背景同理。
3. 人设里没有特别指明的社交细节，只能随机补充符合你身份、地位的合理关系（朋友、同事、客户、合作方、可能联系的人等）。
4. 备注要像真人给别人起的（如“陈特助”“哥”“老周”）。聊天内容的语气和说话习惯必须完全符合你的性格，以及你与对方的关系（对下属冷淡简短、对朋友随意幽默等），每条不超过 30 字，有来有回，不要动作描写、括号、引号。
只输出以上格式的内容，不要标题、解释、代码块标记。${BAN}）`};

const clean=s=>String(s||'').replace(/\*\*|`/g,'').replace(/^["「“]+|["」”]+$/g,'').trim();
const parseAll=(t,now,skip)=>{
 const out=[];let cur=null;
 String(t).split(/\n+/).forEach(l=>{
  l=l.replace(/｜/g,'|').replace(/^\s*(?:[-*•]|\d+[.、)）])\s+/,'').trim();
  let m=l.match(/^[#＃]\s*([^|]+)\|([^|]*)(?:\|\s*(\d+))?/);
  if(m){cur={name:clean(m[1]).slice(0,12),rel:clean(m[2]).slice(0,20),ago:m[3]?+m[3]:Math.round(30+Math.random()*3000),rows:[]};out.push(cur);return}
  m=l.match(/^(我|对方)\s*[|:：]\s*(.+)$/);
  if(m&&cur){const x=clean(m[2]);if(x)cur.rows.push({me:m[1]==='我',x})}
 });
 const seen=new Set([skip]);
 return out.filter(x=>x.name&&x.rows.length&&!seen.has(x.name)&&seen.add(x.name)).slice(0,8).map(x=>{
  const rows=x.rows.slice(-6),ts=now.getTime()-Math.max(1,x.ago)*60000;let k=ts;
  for(let i=rows.length-1;i>=0;i--){rows[i].t=k;k-=(1+Math.floor(Math.random()*(Math.random()<.25?600:20)))*60000}
  return {id:'g'+Math.random().toString(36).slice(2,8),name:x.name,rel:x.rel,last:rows[rows.length-1].x.slice(0,30),ts,msgs:rows};
 });
};

const chatQ=(c,x)=>`（系统指令：请不要回复我，现在你要生成你和微信好友「${x.name}」（关系：${x.rel||'朋友'}）的微信聊天记录。
请生成 3～6 条，按时间先后排列，每行一条，格式严格为：我|内容 或 对方|内容（“我”是你本人）。
语气和说话习惯必须完全符合你的性格，以及你与对方的关系（例如对下属冷淡简短、对朋友随意幽默、对亲人有你自己的方式）。内容要自然、有来有回，每条不超过 30 字，不要动作描写、括号、引号。
最后一条消息的内容必须是：「${x.last}」（是谁发的由内容和关系决定）。
只输出这些行，不要解释。${BAN}）`;

const parseChat=(t,x)=>{
 const rows=[];
 String(t).split(/\n+/).forEach(l=>{
  const m=l.trim().match(/^(我|对方)\s*[|｜:：]\s*(.+)$/);if(m)rows.push({me:m[1]==='我',x:m[2].replace(/^["「“]+|["」”]+$/g,'').trim()})});
 const out=rows.slice(-6);let ts=x.ts;
 for(let i=out.length-1;i>=0;i--){out[i].t=ts;ts-=(1+Math.floor(Math.random()*(Math.random()<.25?600:20)))*60000}
 return out;
};

const refresh=async(ctx,btn)=>{
 if(ap.st.busy)return;
 const c=ctx.friend,now=new Date();
 ap.st.busy=1;btn.classList.add('spin');
 try{
  const t=await ai(c,[...recent(c),{r:'me',c:allQ(c,now)}],'dy');
  const lst=parseAll(t,now,userName(c));
  if(!lst.length)throw '没有生成出有效内容，再点一次试试';
  const d=ctx.store.data(c.id);d.wx={at:now.getTime(),list:lst};save();
  ap.st.sub=null;ctx.redraw();
  toast('好友列表和聊天记录已更新');
 }catch(e){toast('生成失败：'+(e&&e.message||e))}
 finally{ap.st.busy=0;btn.classList.remove('spin')}
};
})();
</script>

 /* 底部悬浮胶囊导航 */

 pv.append(bar);
 bar.querySelectorAll('.ps-t').forEach(b=>b.onclick=()=>{if(ap.st.tab!==b.dataset.k){ap.st.tab=b.dataset.k;ctx.redraw()}});
};

/* ===== AI 生成 ===== */
const userName=c=>c.myRemark||c.myName||S.me.name;
const recent=c=>(S.chats['wx'+c.id]||[]).filter(m=>!m.rc&&typeof m.c==='string'&&m.c&&(m.r==='me'||m.r==='ai')&&!m.c.startsWith('【好友申请】')).slice(-15).map(m=>({r:m.r,c:m.c}));
const Q=(c,now)=>{
 const u=userName(c);
 return `（系统指令：请不要回复我，现在你要一次性生成【你自己的购物订单（已经买下的东西）和购物车（加购了、喜欢但还没买的东西）】。当前时间是 ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${p2(now.getHours())}:${p2(now.getMinutes())}。
输出格式严格如下，每行一件商品，用竖线分隔：
买|商品名称|单价|数量|商品简介|emoji|多久前买的（分钟数，整数，从几小时到一个多月不等，有长有短）
车|商品名称|单价|数量|商品简介|emoji|多久前加入的（分钟数，整数，从几小时到两周不等）|状态（已加购 或 待付款）
先写 5～8 行“买”，再写 4～7 行“车”。
- 商品名称像真实电商标题，12字以内；单价、数量只写数字；商品简介是规格 / 颜色 / 尺码等，14字以内；emoji 只写一个最贴切的表情。
【规则】
1. 完全站在你自己的视角，按你的性格、职业、经济能力和消费习惯来生成：富裕的人买奢侈品、高科技配件；学生买书本、零食、日常用品；其他身份同理，价格要符合你的经济水平和现实行情。
2. 订单和购物车里各自可以有 1～3 件与${u}相关的物件，要结合你们最近的聊天和你对${u}的感情：比如准备送给${u}的礼物（生日、纪念日）、${u}随口提过喜欢的东西、情侣款物品、${u}尺码的衣服，或者为和${u}的约会提前准备的东西。你是成年人时，约会相关的私密类用品也可以出现，商品名称要写得含蓄自然，像真实电商标题，不写露骨描述；人设是未成年人则不要出现这类商品。
3. 其余商品是你自己的日常，不要都和${u}有关；购物车里的东西要是“喜欢但还没买”的，和订单不要重复。
只输出这些行，不要标题、序号、解释、代码块标记。严禁出现：丫头、小没良心、小东西。）`};

const num=s=>parseFloat(String(s||'').replace(/[,，¥￥元x×X\s]/g,''));
const parse=(t,now)=>{
 const out={buy:[],cart:[]};
 String(t).split(/\n+/).forEach(l=>{
  l=l.replace(/｜/g,'|').replace(/^\s*(?:[-*•]|\d+[.、)）])\s+/,'').trim();
  const a=l.split('|').map(s=>s.replace(/\*\*|`/g,'').trim());
  const k=(a[0]==='买'||a[0]==='购')?'buy':a[0]==='车'?'cart':null;
  if(!k||a.length<5)return;
  const price=num(a[2]);if(!a[1]||!(price>=0))return;
  const em=/\p{Extended_Pictographic}/u.test(a[5]||'')?[...a[5]].slice(0,3).join(''):'🛍️';
  out[k].push({id:'s'+Math.random().toString(36).slice(2,8),name:a[1].slice(0,20),price:Math.round(price*100)/100,qty:Math.max(1,Math.round(num(a[3])||1)),desc:a[4].slice(0,24),icon:em,
   ts:now.getTime()-Math.max(5,Math.round(num(a[6])||600))*60000,st:/待付/.test(a[7]||'')?'待付款':'已加购'});
 });
 out.buy=out.buy.slice(0,10);out.cart=out.cart.slice(0,10);
 return out;
};

const refresh=async(ctx,btn)=>{
 if(ap.st.busy)return;
 const c=ctx.friend,now=new Date();
 ap.st.busy=1;btn.classList.add('spin');
 try{
  const t=await ai(c,[...recent(c),{r:'me',c:Q(c,now)}],'dy');
  const o=parse(t,now);
  if(!o.buy.length&&!o.cart.length)throw '没有生成出有效内容，再点一次试试';
  const d=ctx.store.data(c.id);d.shop={buy:{at:now.getTime(),items:o.buy},cart:{at:now.getTime(),items:o.cart}};save();
  ctx.redraw();toast('订单和购物车已更新');
 }catch(e){toast('生成失败：'+(e&&e.message||e))}
 finally{ap.st.busy=0;btn.classList.remove('spin')}
};
})();
</script>

<script>
(()=>{
const ap=window.phoneApps.find(a=>a.k==='wallet');
const REFRESH='<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>';
const p2=n=>String(n).padStart(2,'0');
ap.st={busy:0};
ap.white=true;
ap.title=c=>`· ${window.phoneGender(c)}的资产 ·`;
ap.tool={icon:REFRESH,label:'刷新',run:(ctx,btn)=>refresh(ctx,btn)};

/* ===== 交易图标（极简线条）===== */
const IC={
 shop:'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2',
 food:'M8 3v7a2 2 0 0 1-4 0V3M6 10v11M18 3c-2.5 1.5-3.5 4-3.5 8h3.5v10',
 transfer:'M7 8h12l-3-3M17 16H5l3 3',
 income:'M12 4v12M7 11l5 5 5-5M5 20h14',
 transport:'M5 16V9a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v7zM5 16v3M19 16v3M8.5 12h.01M15.5 12h.01',
 fun:'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z',
 other:'M6 12h.01M12 12h.01M18 12h.01'
};
const STY=['black','gold','silver','blue','green','red','purple','white'];
const money=(n,sign)=>{const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (sign||'')+'¥'+s};
const day=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const when=t=>{const now=Date.now(),m=Math.round((now-t)/60000),d=new Date(t),k=Math.round((day(new Date())-day(d))/864e5),hm=p2(d.getHours())+':'+p2(d.getMinutes());
 if(m<60)return Math.max(1,m)+'分钟前';return k<=0?'今天 '+hm:k===1?'昨天 '+hm:`${d.getMonth()+1}月${d.getDate()}日 ${hm}`};

/* ===== 渲染 ===== */
ap.render=(box,ctx)=>{
 const c=ctx.friend,w=(S.pdata[c.id]||{}).wallet,g=window.phoneGender(c);
 if(!w){box.innerHTML=`<p class="pv-ph"><b>还没有资产数据</b>点击右上角刷新<br>看看 ${esc(g)} 的钱包里有什么</p>`;return}
 const bal=money(w.balance).replace('¥','¥ ');
 box.innerHTML=`<div class="pq-ov"><div><b>${esc(g)}的权益</b><small>共 ${w.cards.length} 张卡券</small></div><div><b>钱包</b><strong${bal.length>12?' class="s"':''}>${esc(bal)}</strong></div></div>
 <div class="pq-h">卡券权益</div>
 <div class="pq-cs">${w.cards.map(x=>`<div class="pq-c"><div class="pq-f pq-${x.style}"><i>${esc(x.mark)}</i><u></u></div><span>${esc(x.name)}</span></div>`).join('')}</div>
 <div class="pq-h">最近消费记录</div>
 <div>${w.tx.map(x=>`<div class="pq-t"><div class="pq-i"><svg viewBox="0 0 24 24"><path d="${IC[x.cat]||IC.other}"/></svg></div><div class="pq-m"><b>${esc(x.title)}</b><small>${when(x.ts)}</small></div><div class="pq-a${x.dir==='in'?' in':''}">${money(x.amount,x.dir==='in'?'+':'-')}</div></div>`).join('')}</div>`;
};

/* ===== AI 生成 ===== */
const userName=c=>c.myRemark||c.myName||S.me.name;
const recent=c=>(S.chats['wx'+c.id]||[]).filter(m=>!m.rc&&typeof m.c==='string'&&m.c&&(m.r==='me'||m.r==='ai')&&!m.c.startsWith('【好友申请】')).slice(-15).map(m=>({r:m.r,c:m.c}));
const friends=c=>{const w=(S.pdata[c.id]||{}).wx;return w?w.list.map(x=>x.name):[]};
const todayTrack=c=>{const t=(S.pdata[c.id]||{}).track;if(!t)return '';const d=new Date(Date.now()-5*36e5),k=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
 return t.day===k?t.items.map(x=>`${x.h}:${p2(x.m)} ${x.x}`).join('；'):''};

const Q=(c,now,names)=>{
 const u=userName(c),tr=todayTrack(c),g=window.phoneGender(c);
 return `（系统指令：请不要回复我，现在你要生成【你自己的钱包资产】。当前时间是 ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${p2(now.getHours())}:${p2(now.getMinutes())}。
输出格式严格如下，每行一条，用竖线分隔：
余额|数字（人民币，两位小数）
卡|卡券名称|卡面颜色（黑、金、银、蓝、绿、红、紫、白 选一个）|卡面字样（2～4个字）
流|交易事项|转账对象（只有转账才填名字，其余留空）|支出 或 收入|金额（数字）|分类（购物、餐饮、转账、收入、交通、娱乐、其他 选一个）|多少分钟前（整数，从几分钟到几天，有长有短）
先写 1 行“余额”，再写 3～6 行“卡”，最后写 7 行“流”（我会取最新的 5 条）。
【规则】
1. 全部站在你自己的视角，严格按你的人设、身份、职业和财富背景生成：余额要符合你的经济水平的量级（富豪是千万级，普通上班族是几千，学生是几十到几百）。
2. 卡：富裕、高端人设给黑卡、金卡、VIP 卡、私人会所会员卡等；学生 / 普通人设给校园卡、公交卡、优惠券、连锁饮品或超市会员卡等；其他身份按身份来。
3. 流：每一笔都必须符合你的日常行为逻辑${tr?`，可以参考你今天的行踪：${tr}`:''}。消费类写具体的事项，如“餐厅买单”“打车”“买东西”。
4. 转账类交易的对象，名字必须严格从下面这个名单里选，一个字都不能错，严禁自己编造人名：【${[u,...names].join('、')}】。其中「${u}」是你最重要的人，可以出现有情侣含义的金额（如 520、1314、5200）。如果名单里只有「${u}」，就只和${u}发生转账，其余都用商家消费。收到的钱也可以是名单里下属 / 助理 / 家人的报销或转账，但前提是名单里确实有这个人。
5. 你是${g}，不要出现与人设矛盾的内容。
只输出这些行，不要标题、解释、代码块标记。严禁出现：丫头、小没良心、小东西。）`};

const num=s=>parseFloat(String(s||'').replace(/[,，¥￥元\s]/g,''));
const SMAP={黑:'black',金:'gold',银:'silver',蓝:'blue',绿:'green',红:'red',紫:'purple',白:'white'};
const CMAP=[[/购物|买/,'shop'],[/餐|吃|饮|食/,'food'],[/转账/,'transfer'],[/收入|报销|工资/,'income'],[/交通|打车|出行|车/,'transport'],[/娱乐|玩|游戏/,'fun']];
const parse=(t,now,ok)=>{
 let balance=NaN;const cards=[],tx=[];
 String(t).split(/\n+/).forEach(l=>{
  l=l.replace(/｜/g,'|').replace(/^\s*(?:[-*•]|\d+[.、)）])\s+/,'').trim();
  const a=l.split('|').map(s=>s.replace(/\*\*|`/g,'').trim());
  if(a[0]==='余额'){balance=num(a[1]);return}
  if(a[0]==='卡'&&a[1]){const k=a[2]||'';cards.push({name:a[1].slice(0,14),style:SMAP[k[0]]||(STY.includes(k)?k:'silver'),mark:(a[3]||a[1]).slice(0,6)});return}
  if(a[0]==='流'&&a.length>=6){
   const amount=num(a[4]);if(!(amount>0))return;
   const who=/^(无|没有|-|—)?$/.test(a[2])?'':a[2],dir=/收|in/i.test(a[3])?'in':'out',cs=a[5]||'';
   let cat='other';for(const [re,v] of CMAP)if(re.test(cs)){cat=v;break}
   const ts=now.getTime()-Math.max(1,Math.round(num(a[6])||60))*60000;
   if(who||cat==='transfer'){
    if(!ok.has(who))return; /* 转账对象必须是 User 或微信好友 */
    tx.push({title:dir==='in'?`收到${who}的转账`:`转账给${who}`,dir,amount,cat:'transfer',ts});return}
   tx.push({title:(a[1]||'消费').slice(0,16),dir,amount,cat:dir==='in'&&cat==='other'?'income':cat,ts});
  }
 });
 tx.sort((x,y)=>y.ts-x.ts);
 return {balance,cards:cards.slice(0,8),tx:tx.slice(0,5)};
};

const refresh=async(ctx,btn)=>{
 if(ap.st.busy)return;
 const c=ctx.friend,now=new Date(),names=friends(c),ok=new Set([userName(c),...names]);
 ap.st.busy=1;btn.classList.add('spin');
 try{
  const t=await ai(c,[...recent(c),{r:'me',c:Q(c,now,names)}],'dy');
  const o=parse(t,now,ok);
  if(!(o.balance>=0)||!o.cards.length||o.tx.length<5)throw '生成的数据不完整，再点一次试试';
  const d=ctx.store.data(c.id);d.wallet={at:now.getTime(),balance:Math.round(o.balance*100)/100,cards:o.cards,tx:o.tx};save();
  ctx.redraw();toast('资产已更新');
 }catch(e){toast('生成失败：'+(e&&e.message||e))}
 finally{ap.st.busy=0;btn.classList.remove('spin')}
};
})();
</script>

<script>
(()=>{
const ap=window.phoneApps.find(a=>a.k==='social');
const REFRESH='<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>';
const I={home:'M4 11l8-6.5L20 11M6 9.5V20h12V9.5',dm:'M4 5h16v11H9l-5 4z',me:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5',
 heart:'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',rt:'M7 7h10l-3-3M17 17H7l3 3',star:'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z',
 follow:'M10 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM3 21c0-4 3.2-6.5 7-6.5M18 15v6M15 18h6',fans:'M9 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.6 2.9-5.5 6.5-5.5s6.5 1.9 6.5 5.5M16 5.5a3.5 3.5 0 0 1 0 6.6M18 14.8c2.2.7 3.5 2.4 3.5 5.2',
 img:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9.5h.01',box:'M5 11V8a7 7 0 0 1 14 0v3M5 11h14v9H5z'};
const p2=n=>String(n).padStart(2,'0');
ap.st={tab:'home',dm:null,open:{},busy:0};
ap.enter=()=>{ap.st={tab:'home',dm:null,open:{},busy:0}};
ap.gray=true;ap.hideWho=true;ap.keep=true;
ap.title=c=>ap.st.dm?(dmOf(c,ap.st.dm)||{}).name||'私信':'Social software';
ap.back=()=>{if(ap.st.dm){ap.st.dm=null;return true}return false};
ap.tool=c=>ap.st.dm?null:{icon:REFRESH,label:'刷新',run:(ctx,btn)=>refresh(ctx,btn)};
const sd=c=>(S.pdata[c.id]||{}).social;
const dmOf=(c,id)=>{const s=sd(c);return s&&s.dms.find(x=>x.id===id)};

/* ===== 显示辅助 ===== */
const day=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const tAgo=t=>{const m=Math.round((Date.now()-t)/60000),d=new Date(t),k=Math.round((day(new Date())-day(d))/864e5);
 if(m<60)return Math.max(1,m)+'分钟前';if(k<=0)return Math.floor(m/60)+'小时前';if(k===1)return '昨天';if(k<7)return k+'天前';return `${d.getMonth()+1}月${d.getDate()}日`};
const tLong=t=>{const d=new Date(t),k=Math.round((day(new Date())-day(d))/864e5),hm=p2(d.getHours())+':'+p2(d.getMinutes());return k<=0?hm:k===1?'昨天 '+hm:`${d.getMonth()+1}月${d.getDate()}日 ${hm}`};
const cnt=n=>n>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+'w':String(n);
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};
const av=(name,url)=>url?`<div class="po-av" style="background-image:url('${url}')"></div>`:`<div class="po-av" style="background:hsl(${hue(name)},38%,62%)">${esc([...name][0]||'?')}</div>`;
const sv=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const cmHtml=f=>`<div class="po-cm">${f.comments.length?f.comments.map(x=>`<div><b>${esc(x.n)}</b>${esc(x.x)}</div>`).join(''):'<div>暂无评论详情</div>'}</div>`;

/* ===== 渲染 ===== */
ap.render=(box,ctx)=>{
 const c=ctx.friend,s=sd(c),st=ap.st,pv=box.closest('.pv');
 const old=pv&&pv.querySelector('.ps-bar');if(old)old.remove();
 if(!s){box.innerHTML='<p class="pv-ph"><b>还没有社交动态</b>点击右上角刷新<br>一次生成主页、私信和个人中心</p>';return}
 const cav=av(s.profile.id,c.avatar||DEF);
 if(st.dm){chat(box,c,dmOf(c,st.dm));return}
 if(st.tab==='home'){
  box.innerHTML=s.feed.map(f=>`<div class="po-card"><div class="po-fd"><div class="po-hd">${cav}<div><b>${esc(s.profile.id)}</b><small>${tAgo(f.ts)}</small></div></div>
  <div class="po-tx">${f.text.split('//').map(x=>x.trim()).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')}</div>
  ${f.img?`<div class="po-im">${sv(I.img)}<span>${esc(f.img)}</span></div>`:''}
  <div class="po-bar"><button class="po-bt">${sv(I.heart)}${cnt(f.likes)}</button><button class="po-bt" data-cm="${f.id}">${sv(I.dm)}${cnt(f.cm)}</button><button class="po-bt">${sv(I.rt)}${cnt(f.rt)}</button></div>
  ${st.open[f.id]?cmHtml(f):''}</div></div>`).join('')||'<p class="pv-ph">还没有动态</p>';
  /* 评论只在原地展开 / 收起，不重画页面，所以屏幕不会跳 */
  box.querySelectorAll('[data-cm]').forEach(b=>b.onclick=e=>{
   e.preventDefault();e.stopPropagation();
   const bd=b.closest('.pv-bd'),top=bd?bd.scrollTop:0;
   const id=b.dataset.cm,card=b.closest('.po-fd'),f=s.feed.find(x=>x.id===id),el=card.querySelector('.po-cm');
   st.open[id]=!st.open[id];
   if(el)el.remove();else card.insertAdjacentHTML('beforeend',cmHtml(f));
   b.blur();
   if(bd){bd.scrollTop=top;requestAnimationFrame(()=>{bd.scrollTop=top});setTimeout(()=>{bd.scrollTop=top},60)}
  });
 }else if(st.tab==='dm'){
  const L=s.dms.slice().sort((a,b)=>b.ts-a.ts);
  box.innerHTML=L.length?`<div class="po-card">${L.map(x=>{const lm=x.msgs[x.msgs.length-1];return `<button class="po-row" data-id="${x.id}">${av(x.name,'')}<div class="po-m"><b>${esc(x.name)}</b><small>${esc(x.state==='block'?'你已将对方拉黑':(lm?lm.x:''))}</small></div><span class="po-t">${tAgo(x.ts)}${x.state==='block'?'<em>已拉黑</em>':''}</span></button>`}).join('')}</div>`:'<p class="pv-ph">还没有私信</p>';
  box.querySelectorAll('.po-row').forEach(b=>b.onclick=()=>{st.dm=b.dataset.id;ctx.redraw()});
 }else{
  const p=s.profile;
  box.innerHTML=`<div class="po-card po-me"><div class="po-top">${cav}<div><b>${esc(p.id)}</b><p>${esc(p.bio)}</p></div></div>
  <div class="po-gr">${[['关注',p.follow,I.follow],['粉丝',p.fans,I.fans],['获赞',p.likes,I.heart],['收藏',p.favs,I.star]].map(([n,v,d])=>`<div>${sv(d)}<b>${cnt(v)}</b><small>${n}</small></div>`).join('')}</div></div>
  <div class="po-card"><div class="po-qh">${sv(I.box)}匿名提问</div>${s.qa.map(x=>`<div class="po-q"><i>匿名用户 提问</i><div class="q">${esc(x.q)}</div><div class="a">${esc(x.a)}</div></div>`).join('')||'<p class="pv-ph" style="margin:30px 0">还没有提问</p>'}</div>`;
 }
 if(pv&&!st.dm){
  const bar=document.createElement('div');bar.className='ps-bar';
  bar.innerHTML=[['home','主页'],['dm','私信'],['me','我的']].map(([k,n])=>`<button class="ps-t${st.tab===k?' on':''}" data-k="${k}">${sv(I[k])}${n}</button>`).join('');
  pv.append(bar);
  bar.querySelectorAll('.ps-t').forEach(b=>b.onclick=()=>{if(st.tab!==b.dataset.k){st.tab=b.dataset.k;ctx.redraw();const bd=document.querySelector('.pv-bd');if(bd)bd.scrollTop=0}});
 }
};
const chat=(box,c,x)=>{
 if(!x){ap.st.dm=null;box.innerHTML='';return}
 let k=x.ts-x.msgs.length*3*60000,out='';
 x.msgs.forEach((m,i)=>{
  const t=x.ts-(x.msgs.length-1-i)*3*60000;
  if(i===0)out+=`<div class="pw-tm">${tLong(t)}</div>`;
  out+=`<div class="pw-g${m.me?' pw-me':''}">${m.me?av(c.name,c.avatar||DEF):av(x.name,'')}<div class="pw-b">${esc(m.x)}</div></div>`});
 if(x.state==='block')out+='<div class="po-sys">你已将对方拉黑</div>';
 box.innerHTML=`<div class="pw-ch">${out}</div>`;
 const bd=box.closest('.pv-bd');if(bd)bd.scrollTop=bd.scrollHeight;
};

/* ===== AI 生成：主页 + 私信 + 我的，一次请求 ===== */
const userName=c=>c.myRemark||c.myName||S.me.name;
const recent=c=>(S.chats['wx'+c.id]||[]).filter(m=>!m.rc&&typeof m.c==='string'&&m.c&&(m.r==='me'||m.r==='ai')&&!m.c.startsWith('【好友申请】')).slice(-15).map(m=>({r:m.r,c:m.c}));
const Q=(c,now)=>{
 const u=userName(c);
 return `（系统指令：请不要回复我，现在你要生成【你自己在社交软件（类似小红书 / 微博）上的账号内容】。当前时间是 ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${p2(now.getHours())}:${p2(now.getMinutes())}。
输出格式严格如下，每行一条，用竖线分隔，按这个顺序：
我的|账号ID|个性签名|关注数|粉丝数|获赞数|收藏数
动态|正文（长文用 // 分段）|配图描述（没有配图就留空）|点赞数|评论数|转发数|多久前（分钟数，整数）
评论|评论者网名|评论内容   （紧跟在对应动态后面，0～4 条）
……（再写 2～4 条动态，共 3～5 条）
私信|陌生人随机网名|多久前（分钟数，整数）|状态（已回复 或 已拉黑 或 未回复）
对方|陌生人说的话
我|你的回复
……（共 3～6 个私信会话，每个会话 1～4 行对话，对方先说话）
问答|匿名提问内容|你的回答
……（共 3～6 条）
【规则】
1. 账号ID：如果你的人设里提到了社交账号 ID / 网名，就严格按人设写；没有提到就根据人设随机取一个像真人的 ID。个性签名、关注 / 粉丝 / 获赞 / 收藏数都要符合你的人设和知名度（普通人几十几百，有名气的人几万几十万）。
2. 动态：紧扣你的人设，写你的日常、工作、记录生活，口吻是你自己的；其中要有 1～2 条与${u}相关的事（比如和${u}的约会记录、想着${u}的碎碎念），结合你们最近的聊天。配图描述用一两句话描述画面内容，不是每条都有配图。
3. 私信：陌生人的内容可以是搭讪、交友、讨论、粉丝留言等；你要完全按自己的人设处理：有的会回复（语气符合你的性格），有的不回（状态写“未回复”，只写对方的话），遇到骚扰或让你不舒服的可以拉黑（状态写“已拉黑”）。
4. 问答：来自粉丝、路人或特定关系人的好奇提问，类型要不同；你的回答要有你自己的个性，可以犀利、傲娇、直白，必须符合人设。
只输出这些行，不要标题、序号、解释、代码块标记。严禁出现：丫头、小没良心、小东西。）`};

const num=s=>{const v=String(s||'').trim(),n=parseFloat(v.replace(/[,，]/g,''));return isNaN(n)?0:/[wW万]/.test(v)?Math.round(n*10000):/[kK]/.test(v)?Math.round(n*1000):Math.round(n)};
const clean=s=>String(s||'').replace(/\*\*|`/g,'').trim();
const parse=(t,now)=>{
 const s={profile:null,feed:[],dms:[],qa:[]};let fd=null,dm=null;
 String(t).split(/\n+/).forEach(l=>{
  l=l.replace(/｜/g,'|').replace(/^\s*(?:[-*•]|\d+[.、)）])\s+/,'').trim();
  const a=l.split('|').map(clean),k=a[0];
  if(k==='我的'&&a[1]){s.profile={id:a[1].slice(0,20),bio:(a[2]||'').slice(0,60),follow:num(a[3]),fans:num(a[4]),likes:num(a[5]),favs:num(a[6])};return}
  if(k==='动态'&&a[1]){fd={id:'f'+Math.random().toString(36).slice(2,7),text:a[1],img:(a[2]||'').slice(0,80),likes:num(a[3]),cm:num(a[4]),rt:num(a[5]),ts:now.getTime()-Math.max(5,num(a[6])||600)*60000,comments:[]};s.feed.push(fd);dm=null;return}
  if(k==='评论'&&fd&&a[2]){fd.comments.push({n:a[1].slice(0,12),x:a[2]});return}
  if(k==='私信'&&a[1]){dm={id:'d'+Math.random().toString(36).slice(2,7),name:a[1].slice(0,12),ts:now.getTime()-Math.max(2,num(a[2])||120)*60000,state:/拉黑/.test(a[3]||'')?'block':/未回/.test(a[3]||'')?'none':'reply',msgs:[]};s.dms.push(dm);fd=null;return}
  if((k==='对方'||k==='我')&&dm&&a[1]){dm.msgs.push({me:k==='我',x:a.slice(1).join('|')});return}
  if(k==='问答'&&a[1]&&a[2]){s.qa.push({q:a[1],a:a.slice(2).join('|')})}
 });
 s.feed.forEach(f=>{f.cm=Math.max(f.cm,f.comments.length)});
 s.feed=s.feed.slice(0,6).sort((x,y)=>y.ts-x.ts);s.dms=s.dms.filter(x=>x.msgs.length).slice(0,6);s.qa=s.qa.slice(0,6);
 return s;
};

const refresh=async(ctx,btn)=>{
 if(ap.st.busy)return;
 const c=ctx.friend,now=new Date();
 ap.st.busy=1;btn.classList.add('spin');
 try{
  const t=await ai(c,[...recent(c),{r:'me',c:Q(c,now)}],'dy');
  const s=parse(t,now);
  if(!s.profile||!s.feed.length)throw '没有生成出有效内容，再点一次试试';
  s.at=now.getTime();
  ctx.store.data(c.id).social=s;save();
  ap.st.dm=null;ctx.redraw();toast('社交内容已更新');
 }catch(e){toast('生成失败：'+(e&&e.message||e))}
 finally{ap.st.busy=0;btn.classList.remove('spin')}
};
})();
</script>

.pp-n{position:relative;padding:16px 16px 12px;font-family:"Kaiti SC","STKaiti","KaiTi",cursive,sans-serif;color:#3a2f2a;box-shadow:0 4px 10px rgba(0,0,0,.09)}
.pp-n p{font-size:16px;line-height:1.7;word-break:break-word}
.pp-n small{display:block;margin-top:10px;text-align:right;font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;color:#8a7d75}
.pp-n0{background:#fff3a6;transform:rotate(-1.4deg);border-radius:3px}
.pp-n0::before{content:"";position:absolute;top:-9px;left:50%;width:64px;height:18px;margin-left:-32px;background:rgba(255,255,255,.65);box-shadow:0 1px 3px rgba(0,0,0,.1);transform:rotate(2deg)}
.pp-n1{background:#ffd6e0;transform:rotate(1.2deg);border-radius:3px 3px 18px 3px}
.pp-n1::after{content:"♡";position:absolute;right:12px;top:6px;color:#ff7fa0;font-size:18px}
.pp-n2{background:#e1efff repeating-linear-gradient(transparent 0 26px,rgba(106,160,230,.28) 26px 27px);transform:rotate(-.8deg);border-radius:6px;border-left:6px solid #6aa0e6}
.pp-n3{background:#fff;border:1.5px dashed #d8b88a;transform:rotate(.9deg);border-radius:8px}
.pp-n3::before{content:"";position:absolute;top:-8px;left:14px;width:56px;height:16px;background:repeating-linear-gradient(45deg,#ffb3c1 0 6px,#ffe0e6 6px 12px);opacity:.9;transform:rotate(-4deg)}
.pp-n3::after{content:"✦";position:absolute;right:12px;top:8px;color:#e6b84d;font-size:16px}

/* ===== 页头标题按钮 ===== */
.pv .pp-ti{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-ta{width:100%;min-height:110px;border:0;outline:0;background:#f2f2f7;border-radius:14px;padding:12px;font:inherit;font-size:15px;resize:none;color:#000}
.pp-bt{display:flex;gap:10px;margin-top:12px}
.pv .pp-bt button{flex:1;height:44px;border-radius:22px;font-size:15px;font-weight:600;background:#f2f2f7}
.pv .pp-bt button.ok{background:#000;color:#fff}
.pv .pp-ch{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.pp-ch b{flex:1;font-size:17px;font-weight:700;color:#000}
.pp-ch small{font-size:12px;color:#8e8e93}
.pp-cv{display:grid;place-items:center;transition:transform .25s}
.pp-cv svg{width:16px;height:16px;fill:none;stroke:#8e8e93;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pp-cv.o{transform:rotate(90deg)}
.pp-cg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px;margin-top:14px}
.pp-cp{aspect-ratio:1/1;border-radius:18px;background:#ececf0 center/cover;display:grid;place-items:center;padding:10px;text-align:center;font-size:15px;font-weight:600;color:#6c6c70;word-break:break-all}
.pp-ci p{margin-top:8px;font-size:12.5px;line-height:1.6;color:#555;word-break:break-word}

</style>

<script>
(()=>{
S.ppd=S.ppd||{};
const p2=n=>String(n).padStart(2,'0');
const REFRESH='<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>';
const CHEV='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const NXT='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PEN='<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14 7l3 3"/></svg>';

/* ===== 心情表情：对方是方块脸，我是圆脸 ===== */
const MOODS=['开心','失落','得意','生气','平静','幸运','委屈','困倦'];
const COL={开心:'#FFD84D',失落:'#8FB8FF',得意:'#FFA94D',生气:'#FF7A70',平静:'#A8DDB5',幸运:'#F4A6D7',委屈:'#C8B6FF',困倦:'#B8C4D6'};
const DOT='<circle cx="8.5" cy="10" r="1.3" fill="#3a2f2a" stroke="none"/><circle cx="15.5" cy="10" r="1.3" fill="#3a2f2a" stroke="none"/>';
const FEAT={
 开心:'<path d="M6.5 10.5q1.5-2.5 3 0M14.5 10.5q1.5-2.5 3 0M8 14q4 5 8 0"/>',
 失落:DOT+'<path d="M8.5 17q3.5-3.5 7 0"/><path d="M16.8 12.5q-1.1 1.7 0 2.5q1.1-.8 0-2.5" fill="#5b94f0" stroke="none"/>',
 得意:'<path d="M7 10.5h3M14 10.5h3M13.5 7.8l3.8-1.2M8 14.5q5 3.5 8.5-1"/>',
 生气:DOT+'<path d="M6.5 6.8l4 2.4M17.5 6.8l-4 2.4M8.5 16.5q3.5-3 7 0"/>',
 平静:DOT+'<path d="M9 15.5h6"/>',
 幸运:'<path d="M6.5 10.5q1.5-2.5 3 0M14.5 10.5q1.5-2.5 3 0M8 14q4 4 8 0"/><path d="M19 2.2l.7 1.7 1.7.2-1.3 1.1.4 1.7-1.5-.9-1.5.9.4-1.7-1.3-1.1 1.7-.2z" fill="#fff" stroke="none"/>',
 委屈:DOT+'<path d="M6 7.8l4-1.6M18 7.8l-4-1.6M8.5 17q1.2-1.5 2.5 0t2.5 0"/>',
 困倦:'<path d="M6.5 10.5h4M13.5 10.5h4M17 3h3l-3 3h3"/><circle cx="12" cy="15.5" r="1.6"/>'
};
const face=(m,sq,sz)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}">${sq?`<rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="${COL[m]}"/>`:`<circle cx="12" cy="12" r="11" fill="${COL[m]}"/>`}<g fill="none" stroke="#3a2f2a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${FEAT[m]}</g></svg>`;

const nm=c=>c.remark||c.name;
const key=(y,m,d)=>`${y}-${p2(m+1)}-${p2(d)}`;
const hash=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h};
const userName=c=>c.myRemark||c.myName||S.me.name;

window.ppApp=function(r){
 const now=new Date();
 let y=now.getFullYear(),mo=now.getMonth(),busy=0,sel=null,colOpen=0;
 const list=()=>(S.contacts||[]).filter(c=>!c.fdel);
 const cur=()=>{const c=list().find(x=>x.id===S.ppcur);if(!c)S.ppcur=null;return c||null};
 const dat=c=>{
  const d=S.ppd[c.id]||(S.ppd[c.id]={days:{},notes:[]});
  /* 迁移：心情只从当天开始记，把今天之前自动补出来的心情清掉（我自己选的状态保留） */
  if(!d.v){const tk=today();Object.keys(d.days).forEach(k=>{if(k<tk){delete d.days[k].o;if(!d.days[k].u)delete d.days[k]}});d.v=2;save()}
  return d};
 const today=()=>key(now.getFullYear(),now.getMonth(),now.getDate());

 /* ===== 页面骨架：返回 / 选择好友 / 加载图标 ===== */
 const build=()=>{
  const c=cur();
  r.innerHTML=`<div class="pv pv-g"><div class="pv-hd"><button class="pv-bk" id="ppb" aria-label="返回">${CHEV}</button><button class="pp-ti" id="ppt">- ${c?esc(nm(c)):'选择好友'} -</button><button class="pv-tl" id="ppr" aria-label="加载">${REFRESH}</button></div><div class="pv-bd" id="ppbd"></div></div>`;
  r.querySelector('#ppb').onclick=()=>closeApp();
  r.querySelector('#ppt').onclick=choose;
  r.querySelector('#ppr').onclick=gen;
  const bd=r.querySelector('#ppbd');
  if(!c){bd.innerHTML='<p class="pv-ph"><b>还没有选择好友</b>点击上方「选择好友」<br>邀请 TA 一起来怦怦</p>';return}
  bd.innerHTML=`<div class="pp-cd" id="ppc"></div>
  <div class="pp-cd pp-pad" id="pps"></div><div class="pp-cd pp-pad" id="ppn"></div><div class="pp-cd pp-pad" id="ppz"></div>`;
  drawCal();drawMine();drawNotes();drawCol();
 };

 /* ===== 月度心情日历（只重画这一块，页面不会跳）===== */
 const drawCal=()=>{
  const c=cur(),box=r.querySelector('#ppc');if(!c||!box)return;
  const d=dat(c),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),tk=today();
  let cells='<span></span>'.repeat(first);
  for(let i=1;i<=n;i++){const k=key(y,mo,i),v=d.days[k]||{};
   cells+=`<div class="pp-d${k===tk?' t':''}${k===(sel||tk)?' s':''}" data-k="${k}"><div class="pp-fs">${v.o?face(v.o,1,17):''}${v.u?face(v.u,0,17):''}</div><span>${i}</span></div>`}
  box.innerHTML=`<div class="pp-mh"><button class="pp-ar" id="ppp" aria-label="上个月">${CHEV}</button><b>${y}年${mo+1}月</b><button class="pp-ar" id="ppx" aria-label="下个月">${NXT}</button></div>
  <div class="pp-wk">${'日一二三四五六'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="pp-gd">${cells}</div>
  <div class="pp-lg"><i>${face('开心',1,14)}${esc(nm(c))}</i><i>${face('开心',0,14)}我</i></div>`;
  box.querySelectorAll('.pp-d').forEach(x=>x.onclick=()=>{sel=x.dataset.k===today()?null:x.dataset.k;drawCal();drawNotes()});
  box.querySelector('#ppp').onclick=()=>{mo--;if(mo<0){mo=11;y--}drawCal()};
  box.querySelector('#ppx').onclick=()=>{mo++;if(mo>11){mo=0;y++}drawCal()};
 };

 /* ===== 我的状态：选今天的圆脸表情，日历实时更新 ===== */
 const drawMine=()=>{
  const c=cur(),box=r.querySelector('#pps');if(!c||!box)return;
  const v=(dat(c).days[today()]||{}).u;
  box.innerHTML=`<div class="pp-h"><b>我的状态</b><small>今天 ${now.getMonth()+1}月${now.getDate()}日</small></div><div class="pp-mg">${MOODS.map(m=>`<button class="pp-mo${v===m?' on':''}" data-m="${m}">${face(m,0,34)}<span>${m}</span></button>`).join('')}</div>`;
  box.querySelectorAll('.pp-mo').forEach(b=>b.onclick=()=>{
   const d=dat(c),k=today();d.days[k]=d.days[k]||{};
   if(d.days[k].u===b.dataset.m)delete d.days[k].u;else d.days[k].u=b.dataset.m;
   save();drawMine();y=now.getFullYear();mo=now.getMonth();drawCal();
  });
 };

 /* ===== 今日留言：手帐 / 便利贴 / 贴纸样式 ===== */
 const drawNotes=()=>{
  const c=cur(),box=r.querySelector('#ppn');if(!c||!box)return;
  const tk=sel||today(),isT=tk===today(),ns=dat(c).notes.filter(x=>x.day===tk).sort((a,b)=>a.ts-b.ts),pd=tk.split('-');
  box.innerHTML=`<div class="pp-h"><b>${isT?'今日留言':`${+pd[1]}月${+pd[2]}日的留言`}</b><span style="display:flex;align-items:center;gap:10px">${isT?'':'<button class="pp-bk0" id="ppbk">回到今天</button>'}<button class="pp-pen" id="pppen" aria-label="写留言">${PEN}</button></span></div>`+
  (ns.length?`<div class="pp-ns">${ns.map(x=>{const t=new Date(x.ts);return `<div class="pp-n pp-n${hash(x.id)%4}"><p>${esc(x.x)}</p><small>— ${x.from==='ta'?esc(nm(c)):'我'} · ${p2(t.getHours())}:${p2(t.getMinutes())}${x.from==='me'?' · TA 已查看':''}</small></div>`}).join('')}</div>`:(isT?'<div class="pp-em">今天还没有留言<br>点右上角的加载图标，让 TA 写一条<br>或者点笔，自己写给 TA</div>':'<div class="pp-em">这一天没有留言</div>'));
  box.querySelector('#pppen').onclick=write;
  const bk=box.querySelector('#ppbk');if(bk)bk.onclick=()=>{sel=null;drawCal();drawNotes()};
 };

 /* ===== 他的藏品：默认折叠，点击入口才展开 ===== */
 const drawCol=()=>{
  const c=cur(),box=r.querySelector('#ppz');if(!c||!box)return;
  const L=dat(c).col||[];
  box.innerHTML=`<button class="pp-ch" id="ppzh"><b>他的藏品</b><small>${L.length?L.length+' 件':'还没有'}</small><i class="pp-cv${colOpen?' o':''}">${NXT}</i></button>${colOpen?(L.length?`<div class="pp-cg">${L.map(x=>`<div class="pp-ci"><div class="pp-cp"${x.img?` style="background-image:url('${esc(x.img)}')"`:''}>${x.img?'':esc(x.n)}</div><p>${esc(x.x)}</p></div>`).join('')}</div>`:'<div class="pp-em" style="margin-top:12px">还没有藏品<br>点右上角的加载图标，让 TA 翻翻自己的小盒子</div>'):''}`;
  box.querySelector('#ppzh').onclick=()=>{colOpen=!colOpen;drawCol()};
 };

 /* ===== 选择好友面板（和微信好友实时同步）===== */
 const choose=()=>{
  const l=list(),c0=cur();
  const o=document.createElement('div');o.className='pv-ov';
  o.innerHTML=`<div class="pv-sh"><i class="pv-gr"></i><h3>选择好友</h3><div class="pv-ls">${l.length?l.map(c=>`<button class="pv-r${c0&&c.id===c0.id?' on':''}" data-id="${c.id}"><div class="pv-av" style="background-image:url('${c.avatar||DEF}')"></div><div><b>${esc(nm(c))}</b><small>${esc(c.sign||c.name)}</small></div>${CHK}</button>`).join(''):'<p class="pv-em" style="margin:30px 0">微信里还没有好友</p>'}</div></div>`;
  r.append(o);
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.querySelectorAll('.pv-r').forEach(b=>b.onclick=()=>{S.ppcur=b.dataset.id;save();o.remove();y=now.getFullYear();mo=now.getMonth();build()});
 };

 /* ===== 笔：用户写留言，对方自动查看 ===== */
 const write=()=>{
  const c=cur();if(!c)return;
  const o=document.createElement('div');o.className='pv-ov';
  o.innerHTML=`<div class="pv-sh"><i class="pv-gr"></i><h3>写给 ${esc(nm(c))}</h3><textarea class="pp-ta" id="ppta" maxlength="120" placeholder="今天想对 TA 说点什么…"></textarea><div class="pp-bt"><button id="ppc0">取消</button><button class="ok" id="ppok">贴上去</button></div></div>`;
  r.append(o);
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.querySelector('#ppc0').onclick=()=>o.remove();
  o.querySelector('#ppok').onclick=()=>{
   const x=o.querySelector('#ppta').value.trim();if(!x)return toast('写点什么吧');
   dat(c).notes.push({id:'n'+Math.random().toString(36).slice(2,8),from:'me',x,day:today(),ts:Date.now()});
   save();o.remove();sel=null;drawCal();drawNotes();toast('留言已贴上，TA 会看到');
  };
 };

 /* ===== 加载：生成心情（缺的日子 + 今天）和今日留言 ===== */
 const gen=async()=>{
  const c=cur();if(!c)return toast('先选择一位好友');
  if(busy)return;
  const btn=r.querySelector('#ppr');busy=1;btn.classList.add('spin');
  try{
   const d=dat(c),u=userName(c),ny=now.getFullYear(),nmn=now.getMonth(),td=now.getDate();
   const a0=new Date(ny,nmn,td).getTime();
   const H=(S.chats['wx'+c.id]||[]).filter(m=>!m.rc&&typeof m.c==='string'&&m.c&&(m.r==='me'||m.r==='ai')&&!m.c.startsWith('【好友申请】')&&typeof m.t==='number');
   const ms=H.filter(m=>m.t>=a0).slice(-12).map(m=>(m.r==='ai'?'我':u)+':'+m.c.replace(/\s+/g,' ').slice(0,30));
   const mine=(d.days[today()]||{}).u,mynotes=d.notes.filter(x=>x.day===today()&&x.from==='me').map(x=>x.x);
   const Q=`（系统指令：请不要回复我，现在你要为【怦怦】（一个记录每天心情的小日历）生成内容。当前时间是 ${ny}年${nmn+1}月${td}日 ${p2(now.getHours())}:${p2(now.getMinutes())}。
请依据你的人设、你今天和${u}的聊天记录，以及你今天可能经历的事，选出你【今天】的心情。心情只能从这些词里选一个：${MOODS.join('、')}。
今天的聊天（“我”是你本人）：${ms.length?ms.join(' / '):'（今天还没有聊天，请凭你的人设和生活自行推测）'}
${mine?`${u}今天的心情状态是：${mine}。\n`:''}${mynotes.length?`${u}今天在怦怦上给你留言说：${mynotes.join(' / ')}（你已经看到了，可以在心情和你写的留言里体现）\n`:''}输出格式严格如下，先是两行，再接着 6~10 行藏品（每行一件）：
心情|${nmn+1}-${td}|心情词
留言|你今天想对${u}说的一句话（30字以内，符合你的人设和说话语气，可以撒娇、傲娇、关心或碎碎念，不要加引号）
藏品|物品名（2~8 个字，例如：一根皮筋、一张票根）|你对这件物品的一句内心独白/备注（30字以内，符合你的人设和说话语气）\n藏品的要求：随机生成 6~10 件，每一件都必须和${u}有关，比如你们一起经历过的物件、${u}送你的礼物、${u}遗留在你这里的东西、你偷偷留下的纪念信物等；物品要具体、有画面感、互不重复；物品的选择和你的说法都必须严格符合你的人设和性格。\n只输出这些行，不要标题、解释、代码块标记。严禁出现：丫头、小没良心、小东西。）`;
   const t=await ai(c,[...H.slice(-10).map(m=>({r:m.r,c:m.c})),{r:'me',c:Q}],'dy');
   let ok=0,msg='';const cols=[];
   String(t).split(/\n+/).forEach(l=>{
    l=l.replace(/｜/g,'|').replace(/^\s*(?:[-*•]|\d+[.、)）])\s+/,'').trim();
    const a=l.split('|').map(s=>s.replace(/\*\*|`/g,'').trim());
    if(a[0]==='心情'&&a[2]){const w=MOODS.find(x=>a[2].includes(x));if(w){const k=today();d.days[k]=d.days[k]||{};d.days[k].o=w;ok++}}
    else if(a[0]==='留言'&&a[1])msg=a.slice(1).join('|').replace(/^["「“]+|["」”]+$/g,'').slice(0,60);
    else if(a[0]==='藏品'&&a[1]&&a[2])cols.push({id:'c'+Math.random().toString(36).slice(2,8),n:a[1].replace(/^["「“]+|["」”]+$/g,'').slice(0,10),x:a.slice(2).join('|').replace(/^["「“]+|["」”]+$/g,'').slice(0,50)});
   });
   if(!ok&&!msg&&!cols.length)throw '没有生成出有效内容，再点一次试试';
   /* 每天一条新的：同一天重新生成只替换当天那条，前几天的留言和心情都保留 */
   if(msg){d.notes=d.notes.filter(x=>!(x.day===today()&&x.from==='ta'));d.notes.push({id:'n'+Math.random().toString(36).slice(2,8),from:'ta',x:msg,day:today(),ts:Date.now()})}
   if(cols.length)d.col=cols.slice(0,10);
   save();y=ny;mo=nmn;sel=null;drawCal();drawNotes();drawCol();toast(cols.length?'心情、留言和藏品已更新':'今天的心情和留言已更新');
  }catch(e){toast('生成失败：'+(e&&e.message||e))}
  finally{busy=0;btn.classList.remove('spin')}
 };
 build();
};

/* ===== 聊天时对方记得怦怦里的留言（最近 3 天，双方的都记得）===== */
const noteCtx=c=>{
 const d=S.ppd[c.id];if(!d||!d.notes||!d.notes.length)return '';
 const u=userName(c),n=new Date(),lim=new Date(n.getFullYear(),n.getMonth(),n.getDate()-2).getTime();
 const ns=d.notes.filter(x=>x.ts>=lim).sort((a,b)=>a.ts-b.ts).slice(-6);
 if(!ns.length)return '';
 const fm=t=>{const x=new Date(t);return `${x.getMonth()+1}月${x.getDate()}日`};
 return `（系统提示，不用回复这条：你和${u}在「怦怦」里会互相留言。最近的留言：${ns.map(x=>x.from==='me'?`${fm(x.ts)} ${u}留言给你：「${x.x}」（你已经看到了）`:`${fm(x.ts)} 你留言给${u}：「${x.x}」（这是你自己写的，你记得）`).join('；')}。聊天时你可以自然地提起或回应这些留言，不必每次都提。）`};
const aiN=window.ai;
window.ai=function(c,hist,mode){
 if(!mode&&c&&c.id&&Array.isArray(hist)&&!/^（系统指令/.test(String(hist.length?hist[hist.length-1].c:''))){
  const t=noteCtx(c);if(t)hist=[{r:'me',c:t},...hist]}
 return aiN.call(this,c,hist,mode);
};
})();
</script>

<!-- ===== 补丁二十九：微信「我」→ 钱包（余额 / 开卡 / 我的卡片 / 流水）+ 表情包商店（精选 / 更多，预留资源接口） ===== -->
<style>
.wl{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;color:#000}
.wl button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.wl-pm{margin:10px 0 4px;text-align:left}
.wl-pm small{display:block;font-size:12px;color:#8e8e93;margin-bottom:6px}
.wl-pm .wl-pr{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:14px;flex-direction:row}
.wl-pm .wl-pr input{width:18px;height:18px;min-width:18px;flex:none;margin:0;padding:0;background:none;box-shadow:none}
.wl-pm .wl-pr span{flex:1;white-space:nowrap;text-align:left}.wl-pr em{font-style:normal;color:#8e8e93;font-size:13px}
.wl-ov button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.wl-hd{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;flex:none;min-height:52px}
.wl-hd b{font-size:17px;font-weight:700}
.wl-bk,.wl-sp{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.wl-bk svg{width:22px;height:22px;fill:none;stroke:#1c1c1e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wl-bd{flex:1;min-height:0;overflow-y:auto;padding:6px 18px calc(env(safe-area-inset-bottom) + 30px)}

/* ===== 余额 ===== */
.wl-bal{padding:22px 4px 20px}
.wl-bal small{display:block;font-size:13px;color:#8e8e93}
.wl-bal strong{display:block;margin-top:8px;font-size:40px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.wl-act{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wl .wl-act button{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:28px;background:#f2f2f7;font-size:16px;font-weight:600}
.wl-act svg{width:22px;height:22px;fill:none;stroke:#1c1c1e;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wl-h{margin:28px 2px 6px;font-size:17px;font-weight:700}

/* ===== 流水 ===== */
.wl-t{display:flex;align-items:center;gap:12px;padding:13px 2px}
.wl-t+.wl-t{border-top:1px solid #f0f0f3}
.wl-ti{width:42px;height:42px;border-radius:50%;background:#f2f2f7;display:grid;place-items:center;flex:none}
.wl-ti svg{width:20px;height:20px;fill:none;stroke:#1c1c1e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wl-tm{flex:1;min-width:0}
.wl-tm b{display:block;font-size:15px;font-weight:600}
.wl-tm small{display:block;margin-top:4px;font-size:12px;color:#8e8e93;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-ta{text-align:right;flex:none}
.wl-ta b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.wl-ta b.in{color:#07c160}
.wl-ta small{display:block;margin-top:4px;font-size:11px;color:#b4b4ba}
.wl-em{text-align:center;color:#b4b4ba;font-size:14px;line-height:1.8;padding:40px 0}

/* ===== 卡片：金属质感 ===== */
.wl-cs{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.wl-cd{position:relative;overflow:hidden;width:100%;aspect-ratio:1.586;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.18)}
.wl-cd::before{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.34) 48%,rgba(255,255,255,.06) 54%,transparent 62%);animation:wlsh 6s ease-in-out infinite;pointer-events:none}
.wl-cd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;pointer-events:none}
@keyframes wlsh{0%,100%{transform:translateX(-30%)}50%{transform:translateX(30%)}}
.wl-cd>*{position:relative;z-index:1}
.wl-ct{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;letter-spacing:1px}
.wl-ct svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.wl-mid{display:flex;justify-content:space-between;align-items:center}
.wl-bl{text-align:right;line-height:1.25}
.wl-bl small{display:block;font-size:10px;opacity:.75}
.wl-bl b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.wl-ty .wl-cd .wl-bl b{font-size:13px}.wl-ty .wl-cd .wl-bl small{font-size:8px}
.wl-chip{width:44px;height:33px;border-radius:7px;background:linear-gradient(135deg,#f7e7a8,#c9a24a 55%,#ecd58a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);position:relative}
.wl-chip::after{content:"";position:absolute;inset:6px 8px;border:1px solid rgba(0,0,0,.28);border-radius:3px}
.wl-no{font-size:19px;letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.wl-cb{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px}
.wl-cb em{font-style:normal;font-size:11px;opacity:.8}
.wl-silver{background:linear-gradient(135deg,#f6f7f9 0%,#b7bcc6 28%,#eceef2 50%,#9aa1ad 76%,#d9dce2 100%);color:#363a42}
.wl-gold{background:linear-gradient(135deg,#fbefb8 0%,#d9ac45 28%,#fae8a6 50%,#b5832a 76%,#eccf7a 100%);color:#4a3508}
.wl-black{background:linear-gradient(135deg,#3a3a3f 0%,#0b0b0c 30%,#26262a 52%,#050505 78%,#1d1d20 100%);color:#e6cf94}

/* ===== 弹层 ===== */
.wl-ov{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;animation:fade .2s}
.wl-ov.mid{align-items:center;justify-content:center}
.wl-sh{width:100%;max-height:82%;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.wl-sh h3{text-align:center;font-size:17px;margin-bottom:12px}
.wl-dg{width:78%;background:#fff;border-radius:20px;padding:22px 20px 16px;text-align:center}
.wl-dg h3{font-size:17px}
.wl-dg p{margin:10px 0 18px;font-size:14px;line-height:1.7;color:#6c6c70}
.wl-ov .wl-ok{width:100%;height:44px;border-radius:22px;background:#000;color:#fff;font-size:15px;font-weight:600}
.wl-ty{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wl-ty .wl-cd{width:62%;padding:12px 14px;border-radius:12px}
.wl-ty .wl-cd .wl-chip{width:30px;height:23px}
.wl-ty .wl-cd .wl-no{font-size:12px;letter-spacing:1px}
.wl-ty .wl-cd .wl-ct{font-size:11px}.wl-ty .wl-cd .wl-cb{font-size:10px}
.wl-ov .wl-ty button.op{flex:1;height:40px;border-radius:20px;background:#000;color:#fff;font-size:14px;font-weight:600}
.wl-ov .wl-ty button.op[disabled]{background:#f2f2f7;color:#b4b4ba}

/* ===== 表情包商店 ===== */
.es-tabs{display:flex;background:#f2f2f7;border-radius:18px;padding:3px;gap:2px}
.wl .es-tabs button{height:30px;padding:0 18px;border-radius:15px;font-size:14px;color:#6c6c70}
.wl .es-tabs button.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.es-g{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:14px}
.es-c{background:#f7f7f9;border-radius:18px;padding:12px;cursor:pointer}
.es-cv{aspect-ratio:1;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden}
.es-cv img{width:76%;height:76%;object-fit:contain}
.es-c b{display:block;margin-top:10px;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.es-c small{display:block;margin-top:3px;font-size:12px;color:#8e8e93;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .es-ad{display:block;width:100%;height:32px;margin-top:10px;border-radius:16px;background:#000;color:#fff;font-size:13px;font-weight:600}
.wl .es-ad.d{background:#e6e6ea;color:#8e8e93}
.es-l{padding-top:6px}
.wl .es-r{display:flex;align-items:center;gap:14px;padding:12px 4px;cursor:pointer;position:relative}
.wl .es-r+.es-r::before{content:"";position:absolute;left:82px;right:0;top:0;height:.5px;background:rgba(60,60,67,.18)}
.es-r .es-cv{width:64px;height:64px;aspect-ratio:auto;border-radius:16px;flex:none;background:#f7f7f9}
.es-r .es-cv img{width:100%;height:100%;object-fit:cover}
.es-r b{flex:1;min-width:0;margin-top:0;font-size:16px;font-weight:600}
.wl .es-r .es-ad{width:auto;min-width:64px;height:36px;margin-top:0;padding:0 18px;border-radius:12px;background:#f2f2f7;color:#000;font-size:14px;font-weight:600;flex:none}
.wl .es-r .es-ad.d{background:none;color:#8e8e93}
.es-pv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 16px}
.es-pv div{text-align:center}
.es-pv i{display:block;aspect-ratio:1;border-radius:12px;background:#f7f7f9;display:grid;place-items:center;overflow:hidden}
.es-pv img{width:80%;height:80%;object-fit:contain}
.es-pv span{display:block;margin-top:4px;font-size:11px;color:#6c6c70;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-ov .es-rm{width:100%;height:40px;margin-top:8px;border-radius:20px;background:#f2f2f7;font-size:14px;color:#e5484d}
</style>

<script>
(()=>{
const p2=n=>String(n).padStart(2,'0');
S.wal=S.wal||{bal:100,tx:[],cards:[]};

/* ===== 用户钱包账户：余额 + 流水（转账收支都会自动记进来）===== */
const fmt=n=>Number.isInteger(n)?n.toLocaleString('en-US'):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const TIER={silver:1000,gold:10000,black:20000};
const KN0={silver:'银卡',gold:'金卡',black:'黑卡'};
const r2=n=>Math.round(n*100)/100;
S.wal.cards.forEach(c=>{if(c.bal==null)c.bal=TIER[c.k]});
const cname=c=>`${KN0[c.k]} 尾号${c.no.slice(-4)}`;
window.wal={
 bal:()=>S.wal.bal,fmt,
 /* 零钱收支：改余额并记流水 */
 add(type,name,amt){S.wal.bal=r2(S.wal.bal+amt);S.wal.tx.unshift({id:uid(),type,name,amt,ts:Date.now()});S.wal.tx=S.wal.tx.slice(0,300);save()},
 /* 只记流水（卡片里的钱动了，零钱没动）*/
 log(type,name,amt){S.wal.tx.unshift({id:uid(),type,name,amt,ts:Date.now()});S.wal.tx=S.wal.tx.slice(0,300)},
 find(id){if(id==='wal')return{id:'wal',name:'零钱',bal:S.wal.bal};const c=S.wal.cards.find(x=>x.id===id);return c?{id:c.id,name:cname(c),bal:c.bal,card:c}:null},
 /* 支付方式选择：零钱 / 我的卡片 */
 payHtml(){const L=[wal.find('wal'),...S.wal.cards.map(c=>wal.find(c.id))];
  return `<div class="wl-pm"><small>支付方式</small>${L.map((s,i)=>`<label class="wl-pr"><input type="radio" name="wlpm" value="${s.id}" ${i?'':'checked'}><span>${esc(s.name)}</span><em>￥${fmt(s.bal)}</em></label>`).join('')}</div>`},
 pick(o){const x=o.querySelector('input[name=wlpm]:checked');return x?x.value:'wal'},
 canPay(id,a){const s=wal.find(id);return !!s&&s.bal>=a},
 pay(id,a,name){const s=wal.find(id)||wal.find('wal');
  if(s.card){s.card.bal=r2(s.card.bal-a);wal.log('转账支出',`${name} · ${s.name}`,-a);save()}else wal.add('转账支出',name,-a)},
 /* 对方不收：钱原路退回（退回当时付款的零钱或卡片）*/
 refund(m,c){
  if(!m||m.ref||m.acc||!m.src)return;
  const a=parseFloat(String(m.c).slice(4));if(!(a>0))return;
  m.ref=true;const s=wal.find(m.src),who=(c&&(c.remark||c.name))||'对方';
  if(s&&s.card){s.card.bal=r2(s.card.bal+a);wal.log('转账退还',`${who}未收款 · 退回${s.name}`,a);save()}
  else wal.add('转账退还',`${who}未收款 · 退回零钱`,a);
  save();
 },
 /* 超过 24 小时没人收的转账，自动退回 */
 sweep(){const now=Date.now();
  Object.keys(S.chats).forEach(k=>{if(!k.startsWith('wx'))return;const c=S.contacts.find(x=>x.id===k.slice(2));
   S.chats[k].forEach(m=>{if(m.r==='me'&&m.src&&typeof m.c==='string'&&m.c.startsWith('【转账】')&&!m.acc&&!m.ref&&m.t&&now-m.t>864e5)wal.refund(m,c)})})}
};
wal.sweep();
const when=t=>{const d=new Date(t),k=Math.round((new Date(new Date().toDateString())-new Date(d.toDateString()))/864e5),hm=p2(d.getHours())+':'+p2(d.getMinutes());return k<=0?'今天 '+hm:k===1?'昨天 '+hm:`${d.getMonth()+1}/${d.getDate()} ${hm}`};
const I={back:'M15 5l-7 7 7 7',add:'M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 11h18M16 3v4M14 5h4',cards:'M4 8h16v11H4zM7 5h13v3M8 14h4',
 in:'M12 5v13M6 13l6 6 6-6',out:'M12 19V6M6 11l6-6 6 6',wave:'M9 6c3 3 3 9 0 12M13 4c4.5 4 4.5 12 0 16'};
const sv=d=>`<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;

/* ===== 卡片视觉 ===== */
const KN={silver:'银卡 SILVER',gold:'金卡 GOLD',black:'黑卡 BLACK'};
const cardHtml=(k,no,name,ts,bal,pre)=>{const d=new Date(ts||Date.now());
 return `<div class="wl-cd wl-${k}"><div class="wl-ct"><b>${KN[k]}</b>${sv(I.wave)}</div><div class="wl-mid"><div class="wl-chip"></div><div class="wl-bl"><small>${pre||'卡内余额'}</small><b>￥${fmt(bal||0)}</b></div></div><div class="wl-no">${no.slice(0,4)} **** **** ${no.slice(-4)}</div><div class="wl-cb"><span>${esc(name)}</span><em>${d.getFullYear()}/${p2(d.getMonth()+1)} 开通</em></div></div>`};
const dialog=(r,title,msg)=>{const o=document.createElement('div');o.className='wl-ov mid';o.innerHTML=`<div class="wl-dg"><h3>${title}</h3><p>${msg}</p><button class="wl-ok">知道了</button></div>`;r.append(o);o.onclick=e=>{if(e.target===o)o.remove()};o.querySelector('.wl-ok').onclick=()=>o.remove()};

/* ===== 钱包页 ===== */
window.wxWallet=(r,back)=>{
 wal.sweep();
 const head=(t,fn)=>`<div class="wl-hd"><button class="wl-bk" id="wlb" aria-label="返回">${sv(I.back)}</button><b>${t}</b><span class="wl-sp"></span></div>`;
 const home=()=>{
  const w=S.wal;
  r.innerHTML=`<div class="wl">${head('钱包')}<div class="wl-bd"><div class="wl-bal"><small>余额</small><strong>￥${fmt(w.bal)}</strong></div>
  <div class="wl-act"><button id="wlo">${sv(I.add)}开卡</button><button id="wlc">${sv(I.cards)}我的卡片</button></div>
  <div class="wl-h">流水</div>
  ${w.tx.length?w.tx.map(x=>`<div class="wl-t"><div class="wl-ti">${sv(x.amt>=0?I.in:I.out)}</div><div class="wl-tm"><b>${esc(x.type)}</b><small>${esc(x.name)}</small></div><div class="wl-ta"><b class="${x.amt>=0?'in':''}">${x.amt>=0?'+':'-'}${fmt(Math.abs(x.amt))}</b><small>${when(x.ts)}</small></div></div>`).join(''):'<div class="wl-em">暂无流水<br>转账、收款的记录都会出现在这里</div>'}</div></div>`;
  r.querySelector('#wlb').onclick=back;
  r.querySelector('#wlo').onclick=open;
  r.querySelector('#wlc').onclick=mine;
 };
 /* 开卡：银卡 1000 / 金卡 10000 / 黑卡 20000，开卡的钱从余额扣掉，存进卡片 */
 const open=()=>{
  if(S.wal.bal<TIER.silver)return dialog(r,'余额不足',`最低的银卡也需要 ￥${fmt(TIER.silver)} 才能开通，当前余额 ￥${fmt(S.wal.bal)}，先攒一攒吧。`);
  const o=document.createElement('div');o.className='wl-ov';
  const own=k=>S.wal.cards.some(c=>c.k===k);
  o.innerHTML=`<div class="wl-sh"><h3>选择要开通的卡片</h3>${['silver','gold','black'].map(k=>`<div class="wl-ty">${cardHtml(k,'6217000000000000',S.me.name,Date.now(),TIER[k],'开卡存入')}<button class="op" data-k="${k}" ${own(k)?'disabled':''}>${own(k)?'已开通':'￥'+fmt(TIER[k])}</button></div>`).join('')}<p style="text-align:center;font-size:12px;color:#8e8e93;margin-top:4px">开卡的钱会从余额转入卡片，之后可选择用余额或卡片付款</p></div>`;
  r.append(o);o.onclick=e=>{if(e.target===o)o.remove()};
  o.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
   const k=b.dataset.k,cost=TIER[k];
   if(S.wal.bal<cost){o.remove();return dialog(r,'余额不足',`开通${KN0[k]}需要从余额转入 ￥${fmt(cost)}，当前余额 ￥${fmt(S.wal.bal)}。`)}
   let no='6217';for(let i=0;i<12;i++)no+=Math.floor(Math.random()*10);
   S.wal.cards.push({id:uid(),k,no,ts:Date.now(),bal:cost});
   wal.add('开卡转入',`${KN0[k]}开卡 · 余额转入卡片`,-cost);
   o.remove();toast('开卡成功');mine();
  });
 };
 /* 我的卡片：垂直排列 */
 const mine=()=>{
  const cs=S.wal.cards.slice().sort((a,b)=>['black','gold','silver'].indexOf(a.k)-['black','gold','silver'].indexOf(b.k));
  r.innerHTML=`<div class="wl">${head('我的卡片')}<div class="wl-bd"><div class="wl-cs">${cs.map(c=>cardHtml(c.k,c.no,S.me.name,c.ts,c.bal)).join('')||'<div class="wl-em">还没有卡片<br>回到钱包点「开卡」，银卡 ￥1,000 起</div>'}</div></div></div>`;
  r.querySelector('#wlb').onclick=home;
 };
 home();
};

/* ===== 表情包商店 ===== */
/* 预留的资源接口：
   1) 直接把表情包写进下面的 BUILTIN（featured = 精选表情，more = 更多表情）
   2) 或者在 CONFIG 里填外部资源链接，链接返回的 JSON 格式：
      {"packs":[{"id":"唯一ID","name":"表情包名","desc":"简介","items":[{"name":"表情名","src":"图片链接"}]}]}
   3) 代码里也可以随时调用 wxStickerStore.register('featured' 或 'more', 表情包对象) */
const emo=(e,bg)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="${bg}"/><text x="60" y="84" font-size="68" text-anchor="middle">${e}</text></svg>`);
const mk=(id,name,desc,bg,arr)=>({id,name,desc,items:arr.map(([n,e])=>({name:n,src:emo(e,bg)}))});
const pk=(id,name,arr)=>({id,name,desc:'',items:arr.map(([n,u])=>({name:n,src:u}))});

<!-- ===== 补丁三十：聊天里长按展开的 Work —— 对方根据人设写一个 800～1500 字的小故事，从屏幕上方弹出 ===== -->
<style>

</style>

<script>
(()=>{
const XI='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const busy=new Set();
window.wxWork=(r,c)=>{
 if(r.querySelector('.wk-ov'))return;
 const nm=c.remark||c.name,o=document.createElement('div');o.className='wk-ov';
 o.innerHTML=`<div class="wk-bx"><div class="wk-hd"><b>${esc(nm)} 的小故事</b><button class="wk-x" aria-label="关闭">${XI}</button></div><div class="wk-bd"></div></div>`;
 r.append(o);
 const bd=o.querySelector('.wk-bd'),close=()=>o.remove();
 o.onclick=e=>{if(e.target===o)close()};
 o.querySelector('.wk-x').onclick=close;
 const run=async()=>{
  if(busy.has(c.id))return;busy.add(c.id);
  bd.innerHTML=`<p class="wk-ld">${esc(nm)}正在构思一个故事…</p>`;
  try{
   const H=(S.chats['wx'+c.id]||[]).filter(m=>typeof m.c==='string'&&m.c&&(m.r==='me'||m.r==='ai')&&!m.c.startsWith('【好友申请】')).slice(-8).map(m=>({r:m.r,c:m.c}));
   const Q='（系统指令：请不要回复我，现在你要根据你的人设，随机写一个 800～1500 字的小故事，题材不限，日常、回忆、奇想、童话、小悬疑、你自己的某段经历……任何故事都可以，要完整，有开头、发展和结尾，用你自己的叙述口吻和文字风格。第一行写故事标题，用《》括起来；从第二行开始是正文，自然分段。不要写成聊天消息，不要用 <|message|>，不要加前言、解释和 markdown 符号。严禁出现：丫头、小没良心、小东西。）';
   const t=await ai(c,[...H,{r:'me',c:Q}],'dy');
   const ls=String(t).replace(/\*\*|[#`]/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
   if(!ls.length)throw '没有生成出内容';
   let title='',body=ls;
   if(/^《.{1,30}》$/.test(ls[0])||(ls[0].length<=20&&ls.length>2&&!/[。！？]$/.test(ls[0]))){title=ls[0].replace(/^《|》$/g,'');body=ls.slice(1)}
   /* 控制在 1500 字左右：太长就在段落处截断 */
   let n=0;const keep=[];for(const p of body){if(n>=1500)break;keep.push(p);n+=p.length}
   if(!o.isConnected)return;
   bd.innerHTML=(title?`<h4>《${esc(title)}》</h4>`:'')+keep.map(p=>`<p>${esc(p)}</p>`).join('')+`<small>全文约 ${n} 字</small>`;
  }catch(e){
   if(!o.isConnected)return;
   bd.innerHTML=`<p class="wk-ld" style="animation:none">生成失败：${esc(e&&e.message||e)}</p><button class="wk-rt">重试</button>`;
   bd.querySelector('.wk-rt').onclick=()=>{busy.delete(c.id);run()};
  }finally{busy.delete(c.id)}
 };
 run();
};
})();
</script>

<script>

/* ===== 心声面板：居中弹出，下方关闭键 ===== */

/* 可自定义部分：点面板右上角的调色板图标，就能看到并修改下面这些样式 */
const VX_CSS=`/* ===== 心声面板样式（改完点「保存」立即生效）=====
   .vx-ov  全屏遮罩        .vx-box 面板主体      .vx-hd  标题栏

mkStyle('vx-base',VX_FIX+'\n'+VX_CSS);

const HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
const PAL='<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-1.4-1.2-1.7-1.2-2.9 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3zM7.5 11h.01M10 7.5h.01M14.5 7.5h.01"/></svg>';

window.wxVoice=(r,c)=>{
 if(r.querySelector('.vx-ov'))return;
 const o=document.createElement('div');o.className='vx-ov';
 let tried=0;
 const draw=()=>{
  const v=c.voice,d=v&&new Date(v.t);
  o.innerHTML=`<div class="vx-box"><div class="vx-hd"><span class="vx-ic">${HEART}</span><b class="vx-ti">${esc(c.remark||c.name)} 的心声</b><button class="vx-st" aria-label="自定义样式">${PAL}</button></div><div class="vx-tx">${v?esc(v.text):'还没有心声，对方回复你之后会自动生成'}</div>${v?`<div class="vx-tm">${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}</div>`:''}<button class="vx-cl">关闭</button></div>`;
  o.querySelector('.vx-cl').onclick=()=>o.remove();
  o.querySelector('.vx-st').onclick=()=>style();
 };
 o.onclick=e=>{if(e.target===o)o.remove()};
 r.append(o);draw();
 /* 以前留下的心声不足 15 字：打开时自动补写一条够长的 */
 if(c.voice&&c.voice.text.length<15&&!tried){tried=1;
  const H=(S.chats['wx'+c.id]||[]).filter(m=>!m.rc&&typeof m.c==='string'&&m.c&&(m.r==='me'||m.r==='ai')).slice(-10).map(m=>({r:m.r,c:m.c}));
  ai(c,[...H,{r:'me',c:'（系统指令：请不要回复我，用第一人称写出你此刻没有说出口的内心想法，不少于15字，60字以内，只输出内容）'}]).then(t=>{t=String(t).trim();if(t.length>=15){c.voice={text:t.slice(0,120),t:Date.now()};save();if(o.isConnected&&!o.querySelector('.vx-ed'))draw()}}).catch(()=>{});
 }
 /* 自定义样式：把心声面板的 CSS 结构摆出来直接改，边改边看效果 */
 const style=()=>{
  if(r.querySelector('.vx-ed'))return;

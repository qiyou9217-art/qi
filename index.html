  e.style.cssText='position:absolute;left:0;right:0;bottom:0;z-index:75;background:#fff;border-radius:22px 22px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:up .28s cubic-bezier(.2,.8,.2,1)';
  e.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><b style="font-size:16px">自定义心声样式</b><small style="color:#8e8e93;font-size:12px">改动会实时预览</small></div><textarea spellcheck="false" style="width:100%;height:210px;border:0;outline:0;background:#f2f2f7;border-radius:12px;padding:10px 12px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#222;resize:none;white-space:pre-wrap"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="vxb" data-a="rs" style="flex:1;height:40px;border-radius:20px;background:#f2f2f7">恢复默认</button><button class="vxb" data-a="cn" style="flex:1;height:40px;border-radius:20px;background:#f2f2f7">取消</button><button class="vxb" data-a="ok" style="flex:1;height:40px;border-radius:20px;background:#000;color:#fff;font-weight:600">保存</button></div>`;

  const ta=e.querySelector('textarea');ta.value=saved||VX_CSS;

  e.querySelector('[data-a=rs]').onclick=()=>{ta.value=VX_CSS;mkStyle('vx-user','')};
  e.querySelector('[data-a=ok]').onclick=()=>{const v=ta.value===VX_CSS?'':ta.value;S.vcss=v;save();mkStyle('vx-user',v);e.remove();toast('样式已保存')};
  o.append(e);
 };
};

/* ===== 我的 → 收藏：我收藏的聊天记录 / 语音 / 图片 ===== */
const BK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const WAVE='<svg viewBox="0 0 24 24"><path d="M9 6c3 3 3 9 0 12M13 4c4.5 4 4.5 12 0 16"/></svg>';
const TRASH='<svg viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
window.wxFav=(r,back)=>{
 let tab='all';
 const kind=f=>f.img?'img':/^【语音】/.test(f.text||'')?'voice':'text';
 const when=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};

  <div class="wl-bd">${L.length?L.map(f=>{const k=kind(f),cc=S.contacts.find(x=>x.id===f.cid);

   return `<div class="fv-it">${body}<div class="fv-ft"><span>${esc(f.from)}${cc?' · '+esc(cc.remark||cc.name)+' 的聊天':''} · ${when(f.ts)}</span><button class="fv-dl" data-d="${f.id}" aria-label="删除">${TRASH}</button></div></div>`}).join(''):'<div class="wl-em">还没有收藏<br>在聊天里长按消息，选择「收藏」就会出现在这里</div>'}</div></div>`;
  r.querySelector('#fvb').onclick=back;
  r.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});

 };
 draw();
};

.cl-fb small{font-size:14px;color:#a1a1a6;line-height:1.7}
.cl-fk{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.cl-fk button{height:50px;border-radius:25px;font:inherit;font-size:16px;font-weight:600;border:0;cursor:pointer}
.cl-fg{background:#fff;color:#000}
.cl-fx{background:rgba(255,255,255,.12);color:#fff}
</style>

<script>
(()=>{
document.title='Celyra';

/* ===== 主屏幕新增两个 App —— 提问箱、当当铺（目前是空壳页面，功能后续再做） ===== */
P.qa='M4 8h16v12H4zM4 8l2-4h12l2 4M12 11.5a1.8 1.8 0 1 1 1.2 1.7c-.8.3-1.2.8-1.2 1.6M12 17.5h.01';
P.dd='M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9M10 20v-5h4v5';
N.qa='提问箱';N.dd='当当铺';
{let ch=0;
 ['qa','dd'].forEach(id=>{
  if([...S.layout.grid,...S.layout.dock].includes(id))return;
  const i=S.layout.grid.findIndex(x=>!x);i<0?S.layout.grid.push(id):S.layout.grid[i]=id;ch=1});
 if(ch)save()}
const stub=(r,name)=>{
 r.innerHTML=`<div class="pv pv-w"><div class="pv-hd"><button class="pv-bk" id="pvb" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b class="pv-t">${name}</b><span class="pv-tl"></span></div><div class="pv-bd"><p class="pv-ph"><b>${name}</b>内容开发中</p></div></div>`;
 r.querySelector('#pvb').onclick=()=>closeApp();
};
window.qaApp=r=>stub(r,'提问箱');
window.ddApp=r=>stub(r,'当当铺');
renderHome();
const {APPS,REAL0,POOL,p2,rnd,cel,nm,uName,nOf,fr,act,lockedV,lockedR,clearLocks,lockedList,myApp,chatOf,tip,stOf,tick}=window.__cel;

const CK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const LK='<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const RT='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const UP='<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const I_HOME='<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>';
const I_CHAT='<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>';
const icV=id=>`<i class="cl-ic" style="${S.icons[id]?`background-image:url('${S.icons[id]}')`:''}">${S.icons[id]?'':svg(P[id])}</i>`;
const icR=a=>`<i class="cl-ic"><b>${esc([...a][0])}</b></i>`;
const batSvg=(p,chg,w=24)=>{
 const iw=Math.max(1.5,p/100*17.2),col=chg?'#34c759':p<=20?'#ff3b30':'currentColor';
 return `<svg viewBox="0 0 26 12" width="${w}" height="${w/2.1667}" style="stroke:none"><rect x=".6" y=".6" width="20.8" height="10.8" rx="3.2" fill="none" stroke-width="1.2" opacity=".45" style="stroke:currentColor"/><rect x="2.4" y="2.4" width="${iw}" height="7.2" rx="1.6" fill="${col}"/><rect x="22.4" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".45"/>${chg?'<path d="M11.8 2.6 8.6 6.6h2.3l-.7 2.8 3.3-4.2h-2.3z" fill="#fff"/>':''}</svg>`};

/* ===== 好友选择面板 ===== */
const choose=(r,done)=>{
 const l=(S.contacts||[]).filter(c=>!c.fdel),c0=fr();
 const o=document.createElement('div');o.className='pv-ov';
 o.innerHTML=`<div class="pv-sh"><i class="pv-gr"></i><h3>选择好友</h3><div class="pv-ls">${l.length?l.map(c=>`<button class="pv-r${c0&&c.id===c0.id?' on':''}" data-id="${c.id}" style="background:none;border:0;font:inherit;color:inherit"><div class="pv-av" style="background-image:url('${c.avatar||DEF}')"></div><div><b>${esc(nm(c))}</b><small>${esc(c.sign||c.name)}</small></div>${CK}</button>`).join(''):'<p class="pv-em" style="margin:30px 0">微信里还没有好友</p>'}</div></div>`;
 r.append(o);
 o.onclick=e=>{if(e.target===o)o.remove()};
 o.querySelectorAll('.pv-r').forEach(b=>b.onclick=()=>{
  const c=cel();if(c.fid!==b.dataset.id){c.fid=b.dataset.id;clearLocks()}
  save();o.remove();done&&done()});
};

/* ===== 拦截：打开被锁的应用时弹出限制界面 ===== */
let goChat=0;
const showLock=id=>{
 const by=(cel().lock[id]||{}).by,f=(S.contacts||[]).find(x=>x.id===by)||fr();
 const o=document.createElement('div');o.className='cl-fs';
 o.innerHTML=`<div class="cl-fb"><div class="cl-fa">${icV(id)}<span class="cl-fl">${LK}</span></div><b>此应用已被 ${esc(f?nm(f):'TA')} 限制</b><small>「${esc(nOf(id))}」暂时无法打开<br>可以去聊天里请 TA 解锁</small></div><div class="cl-fk"><button class="cl-fg" data-g>去聊天请求解锁</button><button class="cl-fx" data-x>返回</button></div>`;
 document.body.append(o);
 o.querySelector('[data-x]').onclick=()=>o.remove();
 o.querySelector('[data-g]').onclick=()=>{o.remove();goChat=1;window.openApp('ir')};
};
const oaP=window.openApp;
window.openApp=function(id){
 if(lockedV(id)){showLock(id);return}
 const rv=oaP.apply(this,arguments);
 const top=stack[stack.length-1];if(top)top.dataset.cel=id;
 const f=act();if(f&&id!=='ir')tip(f,`你打开了「${nOf(id)}」`,'me');
 return rv};

/* ===== 对方正在使用的软件：AI 随机生成，失败时本地随机 ===== */
const busy={};
const genApp=async f=>{
 const s=stOf(f);
 if(busy[f.id]||(s.app&&Date.now()-s.at<1500000))return;
 busy[f.id]=1;
 let a='';
 try{
  const d=new Date();
  const Q=`（系统指令：请不要回复我，现在为你的手机状态生成内容。当前时间 ${p2(d.getHours())}:${p2(d.getMinutes())}。请依据你的人设和此刻时间，随机选出你此刻手机上正在使用的一个应用。输出只有一行：软件|应用名（6 个字以内，如 微信、抖音、小红书、哔哩哔哩、网易云音乐、备忘录、地图、相册、某款游戏）。不要解释，不要引号。）`;
  const t=await window.ai(f,[{r:'me',c:Q}],'dy');
  const m=String(t).match(/软件\s*[|｜]\s*([^\n|｜]+)/);
  a=(m?m[1]:'').replace(/[「」"“”*`]/g,'').trim().slice(0,8);
 }catch(e){}
 const old=s.app;
 s.app=a||POOL[Math.floor(Math.random()*POOL.length)];
 s.at=Date.now();busy[f.id]=0;
 if(s.app!==old)tip(f,`${nm(f)} 打开了「${s.app}」`,'app');else save();
};

/* ===== 我的手机电量：剩余 20% / 充满时，对方按人设弹框提醒（对方自己的电量不弹窗） ===== */
let realB=null;
try{if(navigator.getBattery)navigator.getBattery().then(b=>{realB=b}).catch(()=>{})}catch(e){}
const mine=()=>{
 const c=cel(),s=c.me=c.me||{bat:Math.round(rnd(35,90)),chg:false,ts:Date.now(),a20:0,a100:0,fa:0,p:0};
 if(realB){
  s.bat=Math.round(realB.level*100);s.chg=!!realB.charging;s.ts=Date.now();
  if(s.bat>30)s.a20=0;
  if(s.bat<90)s.a100=0;
  if(!s.chg&&s.bat<=20&&!s.a20){s.a20=1;s.p=20}
  if(s.bat>=100&&!s.a100){s.a100=1;s.p=100}
 }else tick(s);
 return s};
const batLine=async(f,p)=>{
 const fb=p===20?'手机快没电啦，快去充电':'手机已经充满电啦，可以拔掉了';
 try{
  const Q=`（系统指令：请不要回复我，现在${uName(f)}的手机${p===20?'电量只剩 20%，需要充电了':'已经充满电了'}。请完全按你的人设口吻，对 TA 说一句简短的提醒（${p===20?'提醒 TA 该充电了':'告诉 TA 手机已充满电'}），25 个字以内。只输出这一句话，不要引号，不要解释，不要用 <|message|>，不要写心声。）`;
  const t=await Promise.race([window.ai(f,[{r:'me',c:Q}],'dy'),new Promise((_,j)=>setTimeout(j,8000))]);
  const s=String(t).replace(/【心声】[\s\S]*$/,'').replace(/<\|message\|>/g,' ').replace(/["“”「」]/g,'').trim().split('\n')[0].slice(0,40);
  return s||fb;
 }catch(e){return fb}
};
const alertMine=async(f,p)=>{
 const text=await batLine(f,p);
 if(document.querySelector('.cl-ov,.cl-fs'))return;
 const o=document.createElement('div');o.className='cl-ov';
 o.innerHTML=`<div class="cl-al"><div class="cl-i0 cl-av" style="background-image:url('${f.avatar||DEF}')"></div><b>${esc(nm(f))}</b><small style="font-size:15px;color:#333;margin-top:8px">${esc(text)}</small><small>手机电量 ${p}%</small><div class="cl-bt"><button class="cl-ok" data-x>好的</button></div></div>`;
 document.body.append(o);
 o.onclick=e=>{if(e.target===o)o.remove()};
 o.querySelector('[data-x]').onclick=()=>o.remove();
};
let wb=0;
const watch=()=>{
 const f=act();if(!f||wb)return;
 stOf(f).p=0;
 const s=mine();
 if(!s.p)return;
 const p=s.p;s.p=0;save();
 tip(f,p===20?'你的手机电量剩余 20%':'你的手机已充满电（100%）','mybat');
 wb=1;alertMine(f,p).finally(()=>{wb=0});
};
setInterval(watch,20000);setTimeout(watch,1500);

/* ===== 独立聊天界面 ===== */
const sheet=(r,send)=>{
 const L=lockedList();if(!L.length)return;
 const o=document.createElement('div');o.className='pv-ov';
 o.innerHTML=`<div class="pv-sh"><i class="pv-gr"></i><h3>被 TA 限制的应用</h3><div class="pv-ls">${L.map((x,i)=>`<div class="cl-r" style="cursor:default"><span class="cl-nm">${esc(x.n)}<small>已被限制</small></span><button class="cl-rq" data-i="${i}">请求解锁</button></div>`).join('')}</div></div>`;
 r.append(o);
 o.onclick=e=>{if(e.target===o)o.remove()};
 o.querySelectorAll('.cl-rq').forEach(b=>b.onclick=()=>{const x=L[+b.dataset.i];o.remove();send(`能帮我把${x.say}解锁吗？`)});
};
const chatView=(r,f,back)=>{
 const H=chatOf(f);let bz=0;
 r.classList.remove('sx');void r.offsetWidth;r.classList.add('sx');
 r.innerHTML=`<div class="cl"><div class="cl-hd2"><button class="cl-bk" id="clk" aria-label="返回">${RT}</button><b>${esc(nm(f))}</b><span class="cl-lkw" id="cllw"></span></div><div class="cl-ms" id="clms"></div><div class="cl-ib"><input id="clin" placeholder="输入消息"><button id="clsd" aria-label="发送">${UP}</button></div></div>`;
 const ms=r.querySelector('#clms'),inp=r.querySelector('#clin');
 const draw=()=>{
  ms.innerHTML=H.map(m=>m.r==='sys'?`<div class="cl-sy">${esc(m.c)}</div>`:`<div class="cl-bw ${m.r==='me'?'u':'o'}"><div class="cl-av" style="background-image:url('${m.r==='me'?(f.myAv||DEF):(f.chatAv||f.avatar||DEF)}')"></div><div class="cl-bv">${esc(m.c)}</div></div>`).join('');
  ms.scrollTop=1e9;
  const L=lockedList(),w=r.querySelector('#cllw');
  w.innerHTML=L.length?`<button class="cl-lk">${LK}${L.length}</button>`:'';
  const b=w.querySelector('button');if(b)b.onclick=()=>sheet(r,send);
 };
 const push=m=>{m.ts=Date.now();H.push(m);save();draw()};
 const reply=async()=>{
  bz=1;
  const tmp=document.createElement('div');tmp.className='cl-sy';tmp.textContent=nm(f)+' 正在输入…';ms.append(tmp);ms.scrollTop=1e9;
  try{
   const hist=H.filter(m=>m.r!=='sys').slice(-30).map(m=>({r:m.r,c:m.c}));
   const t=String(await window.ai(f,hist,'cel')).replace(/【心声】[\s\S]*$/,'').trim();
   const parts=(window.scrubBan?window.scrubBan(t):t).split(/<\|message\|>/).map(s=>s.trim()).filter(Boolean);
   tmp.remove();
   for(let i=0;i<parts.length;i++){if(i)await new Promise(z=>setTimeout(z,450));if(!r.isConnected)break;push({r:'ai',c:parts[i]})}
  }catch(e){tmp.remove();push({r:'ai',c:'⚠️ '+e})}
  bz=0;
 };
 const send=v=>{v=(v||'').trim();if(!v||bz)return;push({r:'me',c:v});reply()};
 r.querySelector('#clk').onclick=back;
 r.querySelector('#clsd').onclick=()=>{const v=inp.value;inp.value='';send(v)};
 inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();const v=inp.value;inp.value='';send(v)}};

 /* 进入聊天：补上电量与软件的系统提示 */
 const s=stOf(f),last=k=>[...H].reverse().find(m=>m.k===k);
 const lb=last('bat');
 if(!lb||Date.now()-lb.ts>1800000)H.push({r:'sys',c:`${nm(f)} 的手机电量 ${Math.round(s.bat)}%${s.chg?' · 充电中':''}`,k:'bat',ts:Date.now()});
 const lm=last('me');
 if(!lm||lm.c!=='你正在使用「智能遥控」'||Date.now()-lm.ts>300000)H.push({r:'sys',c:'你正在使用「智能遥控」',k:'me',ts:Date.now()});
 save();draw();genApp(f);

 const upd=()=>{if(!r.isConnected||!r.querySelector('#clms')){window.removeEventListener('cel-chat',upd);clearInterval(tm);return}draw()};
 window.addEventListener('cel-chat',upd);
 const tm=setInterval(()=>{if(!r.isConnected||!r.querySelector('#clms')){clearInterval(tm);return}genApp(f)},60000);
};

/* ===== 智能遥控主页面 ===== */
window.irApp=function(r){
 const c=cel(),rl=c.real;
 const refresh=()=>{drawTop();drawHint();drawList()};

 const build=()=>{
  r.innerHTML=`<div class="cl">
   <div class="cl-hd"><button class="cl-rt" id="clr">Return</button>
    <div class="cl-sg"><button data-m="cel">管理Celyra</button><button data-m="real">管理真实手机</button></div><span></span></div>
   <div class="cl-bd"><div id="clpm"></div><div id="clht"></div><div id="cllist"></div></div>
   <div class="cl-bar"><button class="on">${I_HOME}<span>主页</span></button><button id="clch">${I_CHAT}<span>聊天</span></button></div></div>`;
  r.querySelector('#clr').onclick=()=>closeApp();
  r.querySelectorAll('.cl-sg button').forEach(b=>b.onclick=()=>{c.mode=b.dataset.m;save();paintMode();drawList()});
  r.querySelector('#clch').onclick=openChat;
  paintMode();refresh();
 };
 const paintMode=()=>r.querySelectorAll('.cl-sg button').forEach(b=>b.classList.toggle('on',b.dataset.m===(c.mode==='real'?'real':'cel')));

 /* ===== 好友授权与权限开关 ===== */
 const drawTop=()=>{
  const f=fr();
  r.querySelector('#clpm').innerHTML=`<div class="cl-cd cl-pm"><button class="cl-pl" id="clp"><b>- 开启权限 -</b><small>${f?'已绑定：'+esc(nm(f)):'点击选择微信好友'}</small></button><label class="cl-sw"><input type="checkbox" id="cls" ${c.on?'checked':''} aria-label="给好友开启权限"><i></i></label></div>`;
  r.querySelector('#clp').onclick=()=>choose(r,refresh);
  r.querySelector('#cls').onchange=e=>{
   c.on=e.target.checked;if(!c.on)clearLocks();save();
   if(c.on&&!fr())choose(r,refresh);
   drawHint();drawList()};
 };
 const drawHint=()=>{
  r.querySelector('#clht').innerHTML=!c.on?'<p class="cl-ht">开启右侧开关并选择好友后，勾选的应用才允许 TA 远程上锁。</p>'
   :!fr()?'<p class="cl-ht">还没有选择好友，点击「- 开启权限 -」绑定，管控暂未生效。</p>'
   :'<p class="cl-ht">权限已生效：勾选的应用，TA 可以远程上锁。</p>'};

 /* ===== 应用列表 ===== */
 const drawList=()=>{
  const box=r.querySelector('#cllist');
  if(c.mode!=='real'){
   box.innerHTML=`<div class="cl-sec">Celyra 内的应用</div><div class="cl-cd cl-ls">${APPS.map(id=>`<div class="cl-r" data-id="${id}">${icV(id)}<span class="cl-nm">${esc(nOf(id))}${lockedV(id)?'<small>已被限制</small>':''}</span><i class="cl-ck${c.ok[id]?' on':''}">${CK}</i></div>`).join('')}</div>`;
   box.querySelectorAll('.cl-r').forEach(x=>x.onclick=()=>{const id=x.dataset.id;c.ok[id]=!c.ok[id];if(!c.ok[id])delete c.lock[id];save();drawList()});
   return}
  if(!rl.paired){
   box.innerHTML=`<div class="cl-cd cl-cn"><h3>连接真实手机</h3><p>在真实手机的配套 App 中输入下面的配对码，完成桥接后即可选择要管控的应用。</p><div class="cl-c0">${rl.code||'······'}</div><button class="cl-bb" id="clpair">${rl.code?'开始配对':'生成配对码'}</button><p class="cl-nt">网页无法直接操作手机系统应用，上锁指令需要由手机端 App 接收执行。</p></div>`;
   r.querySelector('#clpair').onclick=pair;
   return}
  box.innerHTML=`<div class="cl-cd cl-lv"><i></i><span>已连接真实手机</span><button id="cldis">断开</button></div><div class="cl-sec">真实手机内的应用</div><div class="cl-cd cl-ls">${rl.apps.map((a,i)=>`<div class="cl-r" data-i="${i}">${icR(a)}<span class="cl-nm">${esc(a)}${lockedR(a)?'<small>已被限制</small>':''}</span><i class="cl-ck${rl.ok[a]?' on':''}">${CK}</i></div>`).join('')}<div class="cl-r cl-ad" id="cladd"><i class="cl-ic cl-plus">+</i><span class="cl-nm">添加应用</span></div></div>`;
  box.querySelectorAll('.cl-r[data-i]').forEach(x=>x.onclick=()=>{const a=rl.apps[+x.dataset.i];rl.ok[a]=!rl.ok[a];if(!rl.ok[a])delete rl.lock[a];save();drawList()});
  r.querySelector('#cladd').onclick=()=>{
   const n=(prompt('应用名称')||'').trim().slice(0,8);
   if(!n)return;if(rl.apps.includes(n))return toast('已经有这个应用了');
   rl.apps.push(n);save();drawList()};
  r.querySelector('#cldis').onclick=()=>{if(!confirm('断开与真实手机的连接？'))return;rl.paired=false;rl.code='';rl.lock={};save();drawList()};
 };
 const pair=()=>{
  if(!rl.code){rl.code=String(Math.floor(100000+Math.random()*900000));save();drawList();return}
  const b=r.querySelector('#clpair');b.textContent='正在配对…';b.disabled=true;
  setTimeout(()=>{rl.paired=true;rl.code='';save();toast('已连接真实手机');if(r.isConnected)drawList()},1300)};

 /* ===== 底部【聊天】：智能遥控自己的聊天界面 ===== */
 const openChat=()=>{
  const f=fr();
  if(!f){toast('先选择一位好友');choose(r,refresh);return}
  chatView(r,f,()=>build())};

 build();
 if(goChat){goChat=0;if(fr())openChat()}
};

/* ===== 智能遥控主页面 ===== */
window.irApp=function(r){
 const c=cel(),rl=c.real;
 const refresh=()=>{drawTop();drawHint();drawList()};

 const build=()=>{
  r.innerHTML=`<div class="cl">
   <div class="cl-hd"><button class="cl-rt" id="clr">Return</button>
    <div class="cl-sg"><button data-m="cel">管理Celyra</button><button data-m="real">管理真实手机</button></div><span></span></div>
   <div class="cl-bd"><div id="clpm"></div><div id="clht"></div><div id="cllist"></div></div>
   <div class="cl-bar"><button class="on">${I_HOME}<span>主页</span></button><button id="clch">${I_CHAT}<span>聊天</span></button></div></div>`;
  r.querySelector('#clr').onclick=()=>closeApp();
  r.querySelectorAll('.cl-sg button').forEach(b=>b.onclick=()=>{c.mode=b.dataset.m;save();paintMode();drawList()});
  r.querySelector('#clch').onclick=openChat;
  paintMode();refresh();
 };
 const paintMode=()=>r.querySelectorAll('.cl-sg button').forEach(b=>b.classList.toggle('on',b.dataset.m===(c.mode==='real'?'real':'cel')));

 /* ===== 好友授权与权限开关 ===== */
 const drawTop=()=>{
  const f=fr();

 /* ===== 应用列表 ===== */
 const drawList=()=>{

 }catch(e){return ''}
};

 viaCard(fid,m);
};
const sendImg=(fid,url,label)=>{
 const k='wx'+fid,H=S.chats[k]=S.chats[k]||[];
 H.push({r:'me',img:url,c:label,t:Date.now()});

};

/* ===== 提问箱主程序 ===== */
window.qaApp=function(r){
 let tab='home',bt='wait',sub=null,loading=false;
 const SUBT={fav:'收藏',boxall:'全部信箱',askall:'全部提问'};

 /* 底部弹层 */
 const ov=(html,bind)=>{
  const o=document.createElement('div');o.className='qa-ov';
  o.innerHTML=`<div class="qa-sh"><i class="qa-gr"></i>${html}</div>`;
  r.append(o);o.onclick=e=>{if(e.target===o)o.remove()};

 const textSheet=(title,val,ph,cb,single)=>ov(`<h3>${esc(title)}</h3>${single?`<input class="qa-in" id="qt" value="${esc(val)}" placeholder="${esc(ph)}">`:`<textarea class="qa-ta" id="qt" rows="5" placeholder="${esc(ph)}">${esc(val)}</textarea>`}<div class="qa-bt"><button data-x>取消</button><button class="k" data-k>确定</button></div>`,o=>{
  const t=o.querySelector('#qt');setTimeout(()=>t.focus(),80);
  o.querySelector('[data-x]').onclick=()=>o.remove();
  o.querySelector('[data-k]').onclick=()=>{const v=t.value.trim();if(!v)return toast('不能为空');o.remove();cb(v)}});
 const chooseFriend=(title,cur,cb)=>{
  const l=friends();
  ov(`<h3>${esc(title)}</h3><div class="qa-ls">${l.length?l.map(c=>`<button class="qa-r${cur&&c.id===cur?' on':''}" data-id="${c.id}"><i class="qa-av" style="background-image:url('${c.avatar||DEF}')"></i><span>${esc(nm(c))}</span>${ico.ck}</button>`).join(''):'<p class="qa-em">微信里还没有好友</p>'}</div>`,o=>{
   o.querySelectorAll('.qa-r').forEach(b=>b.onclick=()=>{o.remove();cb(b.dataset.id)})})};

 /* 向好友匿名提问，Char 按人设回答 */
 const answer=async(it,f)=>{
  busy.add(it.id);it.st='wait';paintBd();
  try{
   const Q=`（系统指令：请不要用聊天口吻回复。现在是${window.__cel.nowStr()}。你的「提问箱」里收到一条匿名提问，你不知道提问者是谁，不要猜测对方是谁，也不要默认对方是你认识的人，更不要称呼对方的名字或身份。请完全按你的人设，用一小段话简短地回答这个问题：一般 30~80 字，最多不超过 100 字，不要分段、不要换行、不要列点。只输出回答正文，不要写心声、动作旁白或引号，不要用 <|message|>。\n匿名提问：${it.q}）`;
   const t=await window.ai(f,[{r:'me',c:Q}],'dy');
   it.a=cap(clean(t));it.st=it.a?'ok':'err';
  }catch(e){it.st='err'}
  busy.delete(it.id);save();
  if(r.isConnected)paintBd();
 };
 const ask=(f,text)=>{
  const it={id:uid(),fid:f.id,q:text,a:'',ts:Date.now(),st:'wait',fav:0};
  Qd().asks.push(it);save();tab='home';sub=null;paint();
  const b=r.querySelector('#qb');setTimeout(()=>b&&b.scrollTo({top:1e9,behavior:'smooth'}),60);
  answer(it,f);
 };
 const askSheet=()=>{const f=target();if(!f)return toast('先选择要提问的好友');textSheet(`向 ${nm(f)} 匿名提问`,'','向TA提问吧~',v=>ask(f,v))};

 /* 获取新提问：3~6 条 */
 const fetchNew=async()=>{
  if(loading)return;
  loading=true;paintHd();
  const n=3+Math.floor(Math.random()*4);let qs=[];
  try{
   const cs=friends();
   if(cs.length){
    const c=cs[Math.floor(Math.random()*cs.length)];
    const Q=`（系统指令：请不要用聊天口吻回复。现在要为「${Qd().me.id}」的匿名提问箱生成 ${n} 条新提问。其中大约一半，请以你（角色）的身份匿名提问，问题要符合你的人设和你们的关系，但不能暴露你是谁；其余的请扮演素不相识的陌生网友，提出有趣、真诚或好奇的问题。每条 8~40 字，口语自然，互不重复。严格输出 ${n} 行，每行一个问题，不要编号、不要引号、不要解释，不要写心声。）`;
    qs=parseQs(await window.ai(c,[{r:'me',c:Q}],'dy'),n);
   }
  }catch(e){}
  const have=new Set(Qd().box.map(x=>x.q));
  qs=qs.filter(x=>!have.has(x));
  if(qs.length<n)qs.push(...POOLQ.filter(x=>!have.has(x)&&!qs.includes(x)).sort(()=>Math.random()-.5).slice(0,n-qs.length));
  qs=qs.slice(0,n);
  const now=Date.now();
  qs.forEach((x,i)=>Qd().box.push({id:uid(),q:x,ts:now-i,a:'',at:0,fav:0}));
  save();loading=false;
  if(r.isConnected){bt='wait';paint();toast(`收到 ${qs.length} 条新提问`)}
 };

 /* 转发 / 邀请 */
 const forward=it=>{
  const f=it.fid?(S.contacts||[]).find(c=>c.id===it.fid):null;
  const card={q:it.q,a:it.a,name:it.fid?(f?nm(f):'已删除好友'):Qd().me.id,av:it.fid?(f&&f.avatar||DEF):myAv()};
  chooseFriend('转发给',null,async id=>{const u=await qaImage(card);if(!u)return toast('生成失败');sendImg(id,u,'【提问箱】'+it.q)});
 };
 const invite=()=>{
  ov(`<h3>邀请提问</h3><div style="display:flex;justify-content:center;margin:6px 0 4px">${cardHtml(Qd().me,0)}</div><div class="qa-bt"><button data-x>取消</button><button class="k" data-k>发送给微信好友</button></div>`,o=>{
   o.querySelector('[data-x]').onclick=()=>o.remove();
   o.querySelector('[data-k]').onclick=()=>{o.remove();chooseFriend('发送给',null,id=>sendCard(id))}});
 };

 /* ===== 渲染 ===== */
 const tools=(it,withNew,ctl)=>`<div class="qa-tl">${ctl||`<button data-a="fav" data-i="${it.id}" class="${it.fav?'on':''}" aria-label="收藏">${ico.star}</button><button data-a="fw" data-i="${it.id}" aria-label="转发">${ico.fw}</button><button data-a="del" data-i="${it.id}" aria-label="删除">${ico.del}</button>`}${withNew?'<button class="qa-cap" data-a="new">获取新提问</button>':''}</div>`;
 const ansOf=it=>it.st==='ok'?`<div class="qa-a">${esc(it.a)}</div>`:(it.st==='wait'&&busy.has(it.id))?'<div class="qa-ty"><i></i><i></i><i></i></div>':`<div class="qa-a err" data-a="retry" data-i="${it.id}">回答失败，点击重试</div>`;

 const homeBody=()=>{
  const f=target(),list=f?Qd().asks.filter(a=>a.fid===f.id).sort((a,b)=>a.ts-b.ts):[];
  let h=`<div class="qa-cd" id="qask">${f?`<div class="qa-w"><i class="qa-av" style="background-image:url('${f.avatar||DEF}')"></i><b>${esc(nm(f))}</b></div>`:''}<div class="qa-ph">${f?'向TA提问吧~':'点右上角，选择要提问的好友'}</div></div>`;
  h+=list.map((it,i)=>{
   const last=i===list.length-1;
   return `<div class="qa-cd"><div class="qa-q"><small>我的匿名提问</small>${esc(it.q)}</div><div class="qa-w" style="margin-top:14px"><i class="qa-av s" style="background-image:url('${f.avatar||DEF}')"></i><b>${esc(nm(f))}</b></div>${ansOf(it)}${last?`<div class="qa-tl"><button data-a="more" aria-label="再问一个问题">${ico.plus}</button><button data-a="fav" data-i="${it.id}" class="${it.fav?'on':''}" aria-label="收藏">${ico.star}</button><button data-a="fw" data-i="${it.id}" aria-label="转发">${ico.fw}</button></div>`:''}</div>`}).join('');
  return h};

 const meRow=()=>`<div class="qa-w" style="margin-top:12px"><i class="qa-av s" style="background-image:url('${myAv()}')"></i><b>${esc(Qd().me.id)}</b></div>`;
 const boxCard=(it,withNew)=>it.a
  ?`<div class="qa-cd"><div class="qa-bq">匿名提问：${esc(it.q)}</div>${meRow()}<div class="qa-a">${esc(it.a)}</div>${tools(it,false)}</div>`
  :`<div class="qa-cd"><div class="qa-bq">匿名提问：${esc(it.q)}</div><div class="qa-an"><div class="qa-w"><i class="qa-av s" style="background-image:url('${myAv()}')"></i><b>${esc(Qd().me.id)}</b></div><button class="qa-go" data-a="ans" data-i="${it.id}">回答问题</button></div>${tools(it,withNew)}</div>`;
 const boxBody=()=>{
  const b=Qd().box.slice().sort((a,c)=>c.ts-a.ts),w=b.filter(x=>!x.a),d=b.filter(x=>x.a),L=bt==='wait'?w:d;
  let h=`<div class="qa-sg"><b data-bt="wait" class="${bt==='wait'?'on':''}">未回答 ${w.length}</b><b data-bt="done" class="${bt==='done'?'on':''}">已回答 ${d.length}</b></div>`;
  if(!L.length)h+=bt==='wait'?'<div class="qa-em2">还没有未回答的提问<br><button data-a="new">获取新提问</button></div>':'<div class="qa-em2">还没有回答过的提问</div>';
  else h+=L.map((it,i)=>boxCard(it,bt==='wait'&&i===L.length-1)).join('');
  return h};

 const meBody=()=>{
  const m=Qd().me;
  const rows=[['fav','收藏','Collection'],['boxall','全部信箱','All mailboxes'],['askall','全部提问','All questions'],['inv','邀请提问','Invite questions']];
  return `<div class="qa-pf"><div class="qa-bg" id="qbg" style="${m.bg?`background-image:url('${m.bg}')`:''}">${m.bg?'':'点击更换背景'}</div><div class="qa-pa"><i class="qa-av b" id="qav" style="background-image:url('${myAv()}')"></i><b id="qid">${esc(m.id)}</b></div></div><div class="qa-mn">${rows.map(x=>`<button class="qa-mr" data-m="${x[0]}"><span>${x[1]}</span><small>${x[2]}</small>${ico.go}</button>`).join('')}</div>`};

 const rowCard=it=>{
  if(it.fid){
   const f=(S.contacts||[]).find(c=>c.id===it.fid);
   return `<div class="qa-cd"><div class="qa-q"><small>我问 ${esc(f?nm(f):'已删除好友')}</small>${esc(it.q)}</div><div class="qa-w" style="margin-top:14px"><i class="qa-av s" style="background-image:url('${f&&f.avatar||DEF}')"></i><b>${esc(f?nm(f):'已删除好友')}</b></div>${it.a?`<div class="qa-a">${esc(it.a)}</div>`:`<div class="qa-a no">等待回答</div>`}${tools(it,false)}</div>`}
  return `<div class="qa-cd"><div class="qa-bq">匿名提问：${esc(it.q)}</div>${meRow()}${it.a?`<div class="qa-a">${esc(it.a)}</div>`:`<div class="qa-a no">还没有回答</div>`}${tools(it,false)}</div>`};
 const subBody=()=>{
  const q=Qd();
  const L=(sub==='fav'?[...q.asks,...q.box].filter(x=>x.fav):sub==='boxall'?q.box:q.asks).slice().sort((a,b)=>b.ts-a.ts);
  return L.length?L.map(rowCard).join(''):`<div class="qa-em2">${sub==='fav'?'还没有收藏':sub==='boxall'?'还没有收到过提问':'还没有提过问'}</div>`};

 const paintHd=()=>{
  const h=r.querySelector('#qh');
  if(sub)h.innerHTML=`<button class="qa-ib" id="qbk" aria-label="返回">${ico.back}</button><b class="qa-t2">${SUBT[sub]||''}</b><span style="width:40px"></span>`;
  else if(tab==='home')h.innerHTML=`<button class="qa-t" id="qtt">提问箱</button><button class="qa-ib" id="qft" aria-label="选择好友">${ico.sl}</button>`;
  else if(tab==='box')h.innerHTML=`<b class="qa-t">我的信箱</b><button class="qa-ib${loading?' spin':''}" id="qrf" aria-label="加载新提问">${ico.rf}</button>`;
  else h.innerHTML='';
  const g=s=>h.querySelector(s);
  if(g('#qbk'))g('#qbk').onclick=()=>{sub=null;paint()};
  if(g('#qtt'))g('#qtt').onclick=()=>closeApp();
  if(g('#qft'))g('#qft').onclick=()=>chooseFriend('选择提问对象',target()&&target().id,id=>{Qd().to=id;save();paint()});
  if(g('#qrf'))g('#qrf').onclick=fetchNew;
 };
 const paintBd=()=>{
  const b=r.querySelector('#qb'),top=b.scrollTop;
  b.innerHTML=sub?(sub==='inv'?'':subBody()):tab==='home'?homeBody():tab==='box'?boxBody():meBody();

 };
 const paintBar=()=>{
  const bar=r.querySelector('#qbar');bar.style.display=sub?'none':'';
  bar.innerHTML=[['home',ico.home],['box',ico.box],['me',ico.me]].map(x=>`<button data-t="${x[0]}" class="${tab===x[0]?'on':''}">${x[1]}</button>`).join('');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sub=null;paint();r.querySelector('#qb').scrollTop=0});
 };
 const paint=()=>{paintHd();paintBd();paintBar()};

 /* ===== 点击事件（统一处理） ===== */
 const actions={
  more:()=>askSheet(),
  new:()=>fetchNew(),
  fav:id=>{const it=find(id);if(it){it.fav=it.fav?0:1;save();paintBd()}},
  fw:id=>{const it=find(id);if(it)forward(it)},
  del:id=>{if(!confirm('删除这条记录？'))return;const q=Qd();q.box=q.box.filter(x=>x.id!==id);q.asks=q.asks.filter(x=>x.id!==id);save();paint()},
  ans:id=>{const it=find(id);if(it)textSheet('回答问题',it.a||'','写下你的回答…',v=>{it.a=v;it.at=Date.now();save();paint()})},
  retry:id=>{const it=find(id),f=it&&friends().find(c=>c.id===it.fid);if(f)answer(it,f)}
 };
 const openSub=m=>{if(m==='inv')return invite();sub=m;paint();r.querySelector('#qb').scrollTop=0};

 r.innerHTML='<div class="qa"><div class="qa-hd" id="qh"></div><div class="qa-bd" id="qb"></div><div class="qa-bar" id="qbar"></div></div>';
 window.__qaRefresh=()=>{if(r.isConnected&&!sub)paint()};
 r.querySelector('#qb').onclick=e=>{
  const t=e.target.closest('[data-a],[data-bt],[data-m],#qask,#qbg,#qav,#qid');
  if(!t)return;
  if(t.id==='qask')return askSheet();
  if(t.id==='qbg')return pick(v=>{Qd().me.bg=v;save();paintBd()},720);
  if(t.id==='qav')return pick(v=>{Qd().me.av=v;save();paintBd()},256);
  if(t.id==='qid')return textSheet('修改 ID',Qd().me.id,'输入 ID',v=>{Qd().me.id=v;save();paintBd()},true);
  if(t.dataset.bt){bt=t.dataset.bt;return paintBd()}
  if(t.dataset.m)return openSub(t.dataset.m);
  const fn=actions[t.dataset.a];if(fn)fn(t.dataset.i);
 };
 Qd().asks.forEach(a=>{if(a.st==='wait'&&!busy.has(a.id))a.st='err'});
 paint();
};
})();
</script>

<script>
(()=>{
/* ===== 内置提示词（精简自原文，保留全部要点） ===== */
const WEN=`【思维链：人设内化准则】
以下是你在生成每次回复前的内心思考方式。只在心里默默想，不要把思考过程、编号或这些准则写进回复。

1. 人格内化：理解特征意味着什么，而不是记住标签。把每项性格转化为内在的思维倾向和外在的行为表现，而不是固定台词。
例：占有欲强≠每句话都宣示主权，可能体现在对细节的留意、对关系变化的敏感、下意识的亲近、特定情境下的情绪反应；嘴毒≠无差别讽刺，要随关系、场合、情绪表现出不同程度的刻薄、调侃或犀利；温柔≠永远顺从、永远说好听的话，也可以有自己的坚持、脾气和原则；克制≠没有情绪，情绪存在，只是表达方式受性格、经历和理智影响。

2. 举一反三：设定里的描述、情节和示例只用来帮助理解角色，不是必须照搬的行为模板，严禁反复使用示例中的动作、台词、情节和表达。从已知性格推导未知情境下的反应，从经历推导情绪触发点，从喜好延伸出自然的生活习惯、主动行为和话题，从价值观推导面对选择时的态度，从与用户的关系推导符合当前亲密程度的互动。允许出现设定里没写的新行为、新想法、新习惯和新表达，但必须能从性格、经历、身份或当前情境里找到依据；创造力建立在对人物的理解之上，而不是脱离人物自由发挥。

3. 真实偏好：角色的喜好必须有实际影响，而不是停留在资料卡上。理解喜欢和讨厌什么、为什么，并在适当情境下自然影响日常选择、主动发起的话题、对事物的评价、约会娱乐饮食方式、对用户建议的接受或拒绝，以及主动分享、推荐和邀请。不要为了展示设定而刻意提喜好；同一种喜好在不同情境、不同心情下可以有不同表现。角色有自己的审美和判断，不必为迎合用户放弃自身偏好。

4. 双向互动：不要把用户塑造成固定性格模板，不要擅自替用户决定情绪、想法和行为。亲密关系里，不默认角色永远主动、用户永远被动；不默认角色擅长调情用户就一定害羞退缩；不把用户的主动表达当成口头逞强；不预设用户一定会被角色影响。用户主动表达情感、调情、挑逗或提出亲密互动时，按实际内容回应，不要习惯性地否定、拆穿或认定对方只是嘴上说说。角色可以主动，也允许用户主动；可以调侃，也允许被反过来调侃；互动节奏可以变化。双方都是有独立意志的人，不是固定的攻防模板。

5. 拒绝机械重复：不要把人物标签变成反复出现的口头禅和固定行为，不要反复使用相同的撩拨方式、情绪反应、安慰方式、肢体动作、口头禅、关系表达和情节推进方式。在保持人物一致的前提下主动寻找新的表达角度；同样的情境可以有不同反应，同样的情感可以有不同表达；不要为了体现某个性格特征而过度使用它。

6. 时间以最新为准：每次回复都以本轮提供的当前日期、时间和时区为准，不沿用上一轮的时间。聊天记录里的时间只代表过去发生的事，不代表现在；不要根据上一条消息的时间、记录顺序或上下文氛围推测现在几点。即使中断了数小时、数天甚至更久，再次交流时也以最新时间为准，不把过去的情境自动延续为当前情境。

7. 动笔前先默默想一遍：这条消息和上一条隔了多久？这个角色本人会怎么想？以他的经历和性格，为什么会这样想？当前情境下他最自然的反应是什么？有没有比重复以往表达更自然、更有新意的方式？这个行为是否符合他的真实偏好和双方当前的关系？`;

  if(F.length&&(onlyF||Math.random()<.5)){const f=F[Math.floor(Math.random()*F.length)],t=await ask(f,`（系统指令：不要用聊天口吻。你手头缺钱，想去用户开的当铺当一件东西。请完全按你的人设、身份和财力，想一件属于你自己的物品。注意：物品必须是你自己的东西，严禁使用用户的东西、用户送你的礼物或与用户共有的东西；只有当你的人设里你和用户是前任、已分手的关系时，才可以拿与旧情有关的物品来当。严格只输出：物品名|材质与来历（30字内）|你的心理价（整数元，20~3000）。现在是${WK0.nowStr()}）`),m=t.split(/[|｜]/);
   if(m.length>=3&&/\d+/.test(m[2]))v={who:nm(f),fid:f.id,n:m[0].trim().slice(0,16),ds:m[1].trim().slice(0,40),ask:Math.min(3000,Math.max(20,+m[2].match(/\d+/)[0]))}}
  if(!v&&onlyF)return null;
  if(!v){const q=PASS[Math.floor(Math.random()*PASS.length)];v={who:q[0],n:q[1],ds:q[2],ask:q[3]}}
  v.ask=Math.round(v.ask*(1+.2*lv));v.floor=Math.round(v.ask*(.4+Math.random()*.25));return v};
 const call=async(onlyF)=>{if(busy)return;if(onlyF&&!friends().length)return toast('微信里还没有好友');busy=true;draw();const v=await gen(onlyF);busy=false;if(!v)toast('好友这会儿没空');else setV(v);draw()};
 const deal=(k,price)=>{const v=vis;if(bal()<price)return toast('零钱不足，当前 '+yuan(bal()));money('当当铺支出',`收「${v.n}」`,-price);{const q=price/v.ask;addRep(q>=.8?6:q>=.5?3:1)}
  const sp=Math.round(v.ask*(1.15+Math.random()*.4));
  if(k==='dead')d.shop.stock.push({id:uid(),name:v.n,desc:v.ds,price:sp});else d.shop.tk.push({id:uid(),name:v.n,desc:v.ds,amt:price,red:Math.round(price*1.15),exp:Date.now()+3*864e5,who:v.who,f:v.fid||null});
  msg(`你${k==='live'?'活':'死'}当收下 ${v.who} 的「${v.n}」，付 ${yuan(price)}`);if(v.fid&&fOf(v.fid)&&Math.random()<.7)wxMsg(fOf(v.fid),`我去你的当铺把「${v.n}」当了，${k==='live'?'过几天就来赎':'可别转手卖太贵啊'}。`);setV(null);draw()};
 const bargain=()=>{const v=vis;let k='live';
  ov(`<h3>${esc(v.who)} 的 当 品</h3><div class="dd-say"><b>「${esc(v.n)}」</b><br>${esc(v.ds)}<br>客人心理价约 ${yuan(v.ask)}</div><input id="pr" type="number" inputmode="numeric" placeholder="你出多少钱" value="${Math.round(v.ask*.5)}"><div class="row"><div class="dd-opt on" data-k="live">活当<small>三日内可赎，收利息</small></div><div class="dd-opt" data-k="dead">死当<small>买断，上架转卖</small></div></div><button class="dd-btn" id="ok" style="margin-top:6px">出 价</button>`,o=>{
   o.querySelectorAll('.dd-opt').forEach(b=>b.onclick=()=>{k=b.dataset.k;o.querySelectorAll('.dd-opt').forEach(x=>x.classList.toggle('on',x===b))});
   o.querySelector('#ok').onclick=()=>{const p=Math.round(+o.querySelector('#pr').value);if(!(p>0))return toast('请输入价格');o.remove();
    if(p>=v.floor)deal(k,p);else if(p>=v.floor*.7)ov(`<h3>客 人 还 价</h3><div class="dd-say">${esc(v.who)}：「${yuan(p)}？太少了，至少 ${yuan(v.floor)}。」</div><div class="row"><button class="dd-btn g" data-x>算了</button><button class="dd-btn" data-y style="margin-top:12px">加到 ${yuan(v.floor)}</button></div>`,o2=>{o2.querySelector('[data-x]').onclick=()=>o2.remove();o2.querySelector('[data-y]').onclick=()=>{o2.remove();deal(k,v.floor)}});
    else ov(`<h3>客 人 摇 头</h3><div class="dd-say">${esc(v.who)}：「这价钱，不如我自己留着。」说罢转身走了。</div><button class="dd-btn" data-x>知 道 了</button>`,o2=>{o2.querySelector('[data-x]').onclick=()=>{o2.remove();addRep(-2);setV(null);draw()}})}})};

 /* ---- 时间流转 + 随机事件：逾期成死当、好友买走、客人赎当、铺子卖出 ---- */
 const tick=()=>{const now=Date.now();let ch=0;
  d.tk.forEach(t=>{if(t.st==='live'&&now>t.exp){t.st='forfeit';d.shelf.push({id:uid(),name:t.name,desc:t.desc,price:Math.round(t.red*1.2),src:'me'});msg(`你当的「${t.name}」已逾期，成了死当，被摆上货架`);ch=1}});
  d.shop.tk=d.shop.tk.filter(t=>{if(now>t.exp){d.shop.stock.push({id:uid(),name:t.name,desc:t.desc,price:Math.round(t.red*1.3)});msg(`${t.who} 当的「${t.name}」逾期未赎，成了你的死当`);ch=1;return false}return true});
  if(now-d.ev>Math.max(16000,40000-lvOf(d.shop.rep||0)*8000)&&Math.random()<.5){d.ev=now;const F=friends(),mine=d.shelf.filter(x=>x.src==='me'),f=F[Math.floor(Math.random()*F.length)];
   if(d.shop.open&&!vis&&!busy&&F.length&&Math.random()<.4){busy=true;gen(true).then(v=>{busy=false;if(!v)return;setV(v);msg(`${v.who} 带着「${v.n}」来当铺了，快去柜台看看`);wxMsg(fOf(v.fid),'我到你的当铺了，想当件东西，你出个价吧。');if(r.isConnected&&!r.querySelector('.dd-ov'))draw()})}
   else if(mine.length&&f&&Math.random()<.6){const it=mine[0];d.shelf=d.shelf.filter(x=>x!==it);msg(`你当掉的「${it.name}」被 ${nm(f)} 买走了`);wxMsg(f,`我在当当铺看到你当的「${it.name}」，就顺手买走了。`);ch=1}
   else if(d.shop.open&&d.shop.stock.length){const it=d.shop.stock.shift(),b=f&&Math.random()<.5?nm(f):'一位路人';money('当当铺收入',`卖出「${it.name}」`,it.price);addRep(4);msg(`${b} 买走了「${it.name}」，你收了 ${yuan(it.price)}`);if(b!=='一位路人')wxMsg(f,`我把你铺子里的「${it.name}」买下了，${yuan(it.price)}，不贵。`);ch=1}
   else if(d.shop.open&&d.shop.tk.length){const t=d.shop.tk.shift();money('当当铺收入',`${t.who}赎当`,t.red);addRep(3);msg(`${t.who} 来赎回了「${t.name}」，你收了 ${yuan(t.red)}`);ch=1}}
  if(ch){save();if(r.isConnected&&!r.querySelector('.dd-ov'))draw()}};

 const POOL2=[['景泰蓝小盒','掐丝珐琅，盖沿有细小磕痕',420],['老式铜烛台','一对，铜绿斑驳',230],['民国账本','线装，纸页泛黄',90],['翠玉耳环','一对，色正，无裂',680],['搪瓷茶缸','红双喜，边缘掉瓷',60],['檀木折扇','扇骨完整，绘山水',310],['银质怀表链','足银，扣环略松',270],['青花小碟','一只，底款模糊',340],['铁皮青蛙','发条玩具，仍能跳',120],['老算盘','红木框，珠子油润',200],['黄铜望远镜','单筒，镜片微雾',460],['打字机','英文机，部分键位涩',780],['鎏金胸针','花卉造型，掉了一粒石',350],['手摇留声机','喇叭口有凹痕',920],['象牙色梳篦','一把，齿完整',150],['绣花荷包','缎面，针脚细密',110]];
 const restock=async()=>{if(busy)return;const cur=d.shelf.filter(x=>x.src==='shop').length;if(cur>=10)return toast('货架已摆满，先卖点再进货');busy=true;draw();
  const t=await ask(KEEP,`（系统指令：不要用聊天口吻。请为老当铺进 5 件带年代感的旧货，每行一件，格式：名称|一句话描述（25字内，含材质成色）|售价（整数元，30~2000）。只输出这 5 行，不要编号，不要重复已有的货：${d.shelf.map(x=>x.name).slice(0,12).join('、')}。现在是${WK0.nowStr()}）`);
  let L=t.split('\n').map(x=>x.split(/[|｜]/)).filter(m=>m.length>=3&&/\d+/.test(m[2])).map(m=>[m[0].trim(),m[1].trim(),Math.min(2000,Math.max(30,+m[2].match(/\d+/)[0]))]);
  if(L.length<3){const have=new Set(d.shelf.map(x=>x.name));L=POOL2.filter(x=>!have.has(x[0])).sort(()=>Math.random()-.5).slice(0,5)}
  L.slice(0,Math.max(1,10-cur)).forEach(([n,ds,pr])=>d.shelf.push({id:uid(),name:n.slice(0,16),desc:ds.slice(0,40),price:pr,src:'shop'}));
  save();busy=false;toast('新货到了');draw()};
 const TKH=t=>`<div class="dd-tk"><b>${esc(t.name)}</b><span class="dd-st ${t.st==='redeemed'?'o':t.st==='live'?'':'k'}">${t.st==='live'?'活当':t.st==='redeemed'?'已赎':'死当'}</span><p>${esc(t.desc||'（无描述）')}</p><div class="r"><span>当价 ${yuan(t.amt)}${t.st==='live'?` · 剩 ${left(t.exp)}`:''}</span>${t.st==='live'?`<button class="dd-btn s" data-rd="${t.id}">赎回 ${yuan(t.red)}</button>`:''}</div></div>`;
 const CARD=(it,btn)=>`<div class="dd-c"><b>${esc(it.name)}</b><p>${esc(it.desc)}</p><div class="r"><span>${yuan(it.price)}</span>${btn}</div></div>`;
 const TAB=['pawn','shelf','mine','msg'],TN=['当铺','货架','我的铺子','消息'];
 const body=()=>{
  if(tab==='pawn')return `<div class="dd-sign"><em>當</em><span>童叟无欺 · 诚信公道</span></div><button class="dd-btn" id="pw">我 要 当 东 西</button>
   ${d.bag.length?`<div class="dd-h"><span>我的藏品</span></div><div class="dd-g">${d.bag.map(b=>`<div class="dd-c"><b>${esc(b.name)}</b><p>${esc(b.desc)}</p><button class="dd-btn s g" data-bg="${b.id}">拿去当</button></div>`).join('')}</div>`:''}
   <div class="dd-h"><span>我的当票</span></div>${d.tk.length?d.tk.map(TKH).join(''):'<div class="dd-em">还没有当票<br>点上面的按钮，当一件东西试试</div>'}`;
  if(tab==='shelf')return `<div class="dd-h"><span>柜上货品</span><small>${yuan(bal())}</small></div><button class="dd-btn g" id="rs" style="margin:0 0 10px">${busy?'进货中……':'进 货（刷新货架）'}</button>${d.shelf.length?`<div class="dd-g">${d.shelf.map(it=>CARD(it,`<button class="dd-btn s" data-by="${it.id}">买</button>`)).join('')}</div>`:'<div class="dd-em">货架空了，点上面的「进货」</div>'}`;
  if(tab==='mine'){const s=d.shop,lv=lvOf(s.rep||0),nx=LV[lv+1],pg=nx?Math.min(100,((s.rep||0)-LV[lv][0])/(nx[0]-LV[lv][0])*100):100;
   return `<div class="dd-sw"><span><b>我的当铺</b><br><small>${s.open?'营业中：客人会来，货也会卖出去':'已打烊'}</small></span><button class="dd-btn s" id="op">${s.open?'打烊':'开张'}</button></div>
   <div class="dd-lv"><b>${LV[lv][1]}</b> · 声誉 ${s.rep||0}<small>${LV[lv][2]}${nx?` · 距「${nx[1]}」还差 ${nx[0]-(s.rep||0)}`:' · 已是最高等级'}</small><div class="dd-pg"><i style="width:${pg}%"></i></div></div>
   ${s.open?(vis?`<div class="dd-h"><span>柜前客人</span></div><div class="dd-tk"><b>${esc(vis.who)}</b><p>带来「${esc(vis.n)}」：${esc(vis.ds)}</p><div class="r"><span></span><button class="dd-btn s" id="bg">开 价</button></div></div>`:`<button class="dd-btn" id="cl">${busy?'客人走近中……':'招 呼 客 人'}</button><button class="dd-btn g" id="cf">请 好 友 来 当</button>`):''}
   <div class="dd-h"><span>铺内库存</span></div>${s.stock.length?`<div class="dd-g">${s.stock.map(it=>CARD(it,'<small>待售</small>')).join('')}</div>`:'<div class="dd-em">暂无库存</div>'}
   <div class="dd-h"><span>客人活当</span></div>${s.tk.length?s.tk.map(t=>`<div class="dd-tk"><b>${esc(t.name)}</b><p>${esc(t.who)} · 付出 ${yuan(t.amt)} · 剩 ${left(t.exp)}</p></div>`).join(''):'<div class="dd-em">暂无</div>'}`}
  return d.msgs.length?d.msgs.map(m=>`<div class="dd-ms${m.u?' u':''}">${esc(m.x)}<small>${new Date(m.t).toLocaleString('zh-CN',{hour12:false}).slice(5,16)}</small></div>`).join(''):'<div class="dd-em">还没有消息</div>'};
 const draw=()=>{const top=(r.querySelector('.dd-bd')||{}).scrollTop||0;
  r.innerHTML=`<div class="dd"><div class="dd-hd"><button id="bk" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>当当铺</b><small>${yuan(bal())}</small></div><div class="dd-bd">${body()}</div><div class="dd-tb">${TAB.map((k,i)=>`<button data-t="${k}" class="${tab===k?'on':''}">${TN[i]}${k==='msg'&&unread()?`<i>${unread()}</i>`:''}</button>`).join('')}</div></div>`;
  const B=r.querySelector('.dd-bd');B.scrollTop=top;const $=s=>r.querySelector(s);
  $('#bk').onclick=()=>closeApp();
  r.querySelectorAll('.dd-tb button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==='msg'){const u=unread();draw();if(u){d.msgs.forEach(m=>m.u=0);save()}return}draw()});
  if($('#pw'))$('#pw').onclick=()=>{pre0=null;pawnForm()};
  r.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{pre0=d.bag.find(x=>x.id===b.dataset.bg);pawnForm(pre0)});
  r.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>redeem(d.tk.find(x=>x.id===b.dataset.rd)));
  r.querySelectorAll('[data-by]').forEach(b=>b.onclick=()=>buy(d.shelf.find(x=>x.id===b.dataset.by)));
  if($('#op'))$('#op').onclick=()=>{d.shop.open=!d.shop.open;save();draw()};
  if($('#cl'))$('#cl').onclick=()=>call(0);if($('#cf'))$('#cf').onclick=()=>call(1);if($('#rs'))$('#rs').onclick=restock;if($('#bg'))$('#bg').onclick=bargain};
 draw();tick();
 const tm=setInterval(()=>{if(!r.isConnected){clearInterval(tm);return}tick()},15000);
};

/* ===== 桌面图标红点：有未读的当铺消息 ===== */
setInterval(()=>{try{const t0=document.querySelector('#home .ic[data-id="dd"] .t');if(!t0)return;const n=((S.dd&&S.dd.msgs)||[]).filter(m=>m.u).length;let b=t0.querySelector('.bdg');
 if(!n){if(b)b.remove();return}if(!b){b=document.createElement('i');b.className='bdg';t0.appendChild(b)}if(b.textContent!==String(n))b.textContent=n}catch(e){}},1500);
})();
</script>

.ml-av{flex:none;width:40px;height:40px;border-radius:50%;background:#ddd center/cover}
.ml-r .m{flex:1;min-width:0}.ml-r .m div{display:flex;justify-content:space-between;font-size:14px}.ml-r .m small{color:#8e8e93;font-size:12px}
.ml-r .m p{margin:2px 0 0;font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-r .m p.s{color:#111;font-weight:600}
.ml-ov{position:absolute;inset:0;background:#f2f2f7;z-index:5;display:flex;flex-direction:column}
.ml-rd{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 30px}.ml-rd h2{font-size:20px;margin:6px 0}.ml-rd .f{font-size:13px;color:#8e8e93;margin-bottom:14px}.ml-rd p{white-space:pre-wrap;line-height:1.8;font-size:15px}
.ml-in{width:100%;box-sizing:border-box;padding:12px;margin-bottom:8px;border:0;border-radius:12px;background:#fff;font:inherit;outline:0}
.ml-em{text-align:center;color:#8e8e93;font-size:13px;padding:40px 0;line-height:1.8}
</style>
<script>
(()=>{
const nm=c=>window.__cel.nm(c),WK=window.__cel;
const friends=()=>(S.contacts||[]).filter(c=>!c.fdel);
const fOf=id=>friends().find(c=>c.id===id);
const ask=async(c,Q)=>{try{return String(await Promise.race([window.ai(c,[{r:'me',c:Q}],'dy'),new Promise((_,j)=>setTimeout(j,20000))])).trim()}catch(e){return ''}};
const hhmm=t=>new Date(t).toLocaleString('zh-CN',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});

/* ===== 顶部消息横幅（全局共用） ===== */
let bt;window.celBanner=(title,text,tap,ch)=>{document.querySelectorAll('.cbn').forEach(e=>e.remove());clearTimeout(bt);
 const b=document.createElement('div');b.className='cbn';b.innerHTML=`<div class="ci">${esc((ch||title)[0])}</div><div><b>${esc(title)}</b><span>${esc(String(text).replace(/\n/g,' ').slice(0,40))}</span></div>`;
 b.onclick=()=>{b.remove();tap&&tap()};document.body.append(b);bt=setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),320)},4200)};

/* ===== 微信：新消息横幅（谁发的）+ 会话列表未读角标 ===== */
let seen=Date.now();
const unreadOf=c=>{const b=Math.max(S.wxRead[c.id]||0,S.wxBase||0);return (S.chats['wx'+c.id]||[]).filter(m=>m.r==='ai'&&!m.rc&&m.t>b).length};
setInterval(()=>{try{const now=Date.now();const hits=[];
 friends().forEach(c=>{(S.chats['wx'+c.id]||[]).forEach(m=>{if(m.r==='ai'&&!m.rc&&m.t>seen&&m.t<=now){const inChat=(S.wxRead[c.id]||0)>now-2600&&document.querySelector('#cd');if(!inChat)hits.push({c,m})}})});
 seen=now;hits.sort((a,b)=>a.m.t-b.m.t).slice(0,6).forEach(h=>celBanner(nm(h.c),h.m.c,()=>{openApp('wechat')},'微',h.c.avatar));
 document.querySelectorAll('.app .fr.rd[data-id]').forEach(row=>{const c=fOf(row.dataset.id),av=row.querySelector('.av');if(!c||!av)return;const n=unreadOf(c);let b=av.querySelector('.wxb');
  if(!n){if(b)b.remove();return}if(!b){b=document.createElement('i');b.className='wxb';av.appendChild(b)}b.textContent=n>99?'99+':n})}catch(e){}},1500);

/* ===== 注册新应用 ===== */
N.em='情绪监控';N.ml='邮件';
P.em='M3 12h4l2-6 4 12 2-6h6';P.ml='M3 6h18v12H3zM3 7l9 7 9-7';
const APPS={em:r=>emApp(r),ml:r=>mlApp(r)};
const oa=openApp;openApp=function(id){if(APPS[id]){const r=document.createElement('div');r.className='app';document.body.append(r);stack.push(r);document.body.classList.add('in');APPS[id](r);return}return oa(id)};

/* ===== 桌面第二页：横向滑动翻页；新应用默认放在第二页 ===== */
const P1=20,P2=20;let cur=0;
const rh0=window.renderHome;
window.renderHome=function(){const L=S.layout;while(L.grid.length<P1+P2)L.grid.push(null);
 ['em','ml'].forEach(id=>{if(![...L.grid,...L.dock].includes(id)){const i=L.grid.findIndex((x,j)=>j>=P1&&!x);if(i>-1){L.grid[i]=id;save()}}});
 const full=L.grid;L.grid=full.slice(0,P1);let v;try{v=rh0.apply(this,arguments)}finally{L.grid=full}
 const h=document.querySelector('#home'),g1=h.querySelector('.grid'),wg=h.querySelector('.card.wg'),dk=h.querySelector('.dock');if(!g1||!dk||h.querySelector('.pgs'))return v;
 const ic=id=>`<div class="ic" data-id="${id}"><div class="t" style="${S.icons[id]?`background-image:url('${S.icons[id]}')`:''}">${S.icons[id]?'':svg(P[id])}</div><span>${N[id]}</span></div>`;
 const pgs=document.createElement('div');pgs.className='pgs';const p1=document.createElement('div'),p2=document.createElement('div');p1.className='pg1';p2.className='pg2';
 if(wg)p1.append(wg);p1.append(g1);const g2=document.createElement('div');g2.className='grid';
 g2.innerHTML=full.slice(P1,P1+20).map((id,i)=>`<div class="slot" data-i="${P1+i}">${id?ic(id):''}</div>`).join('');p2.append(g2);pgs.append(p1,p2);h.insertBefore(pgs,dk);
 const dots=document.createElement('div');dots.className='pgd';dots.innerHTML='<i></i><i></i>';h.insertBefore(dots,dk);
 const mark=()=>{const i=Math.round(pgs.scrollLeft/(pgs.clientWidth||1));cur=i;dots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===i))};
 pgs.onscroll=mark;pgs.scrollLeft=cur*pgs.clientWidth;mark();
 g2.querySelectorAll('.ic').forEach(dragify);
 let tm;pgs.addEventListener('pointerdown',e=>{if(!e.target.closest('.ic'))return;tm=setTimeout(()=>{pgs.style.overflowX='hidden'},300)},true);
 const un=()=>{clearTimeout(tm);pgs.style.overflowX=''};pgs.addEventListener('pointerup',un,true);pgs.addEventListener('pointercancel',un,true);
 return v};
renderHome();

/* ===== 角标（邮件未读） ===== */
setInterval(()=>{try{const t0=document.querySelector('#home .ic[data-id="ml"] .t');if(!t0)return;const n=((S.ml&&S.ml.box)||[]).filter(m=>m.dir==='in'&&m.u).length;let b=t0.querySelector('.bdg');
 if(!n){if(b)b.remove();return}if(!b){b=document.createElement('i');b.className='bdg';t0.appendChild(b)}if(b.textContent!==String(n))b.textContent=n}catch(e){}},1500);

/* ===== 情绪监控 ===== */
const MC={正:'#34d399',负:'#f87171',中:'#fbbf24'};
const emData=()=>{S.em=S.em||{};return S.em};
function emApp(r){
 const D=emData(),BK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';let busy=false;
 const last=c=>(D[c.id]||[]).slice(-1)[0];
 const read=async c=>{const rc=(S.chats['wx'+c.id]||[]).slice(-8).map(m=>(m.r==='me'?'用户':nm(c))+'：'+String(m.c).slice(0,40)).join('；')||'（最近没聊天）';
  const t=await ask(c,`（系统指令：不要用聊天口吻。你是${nm(c)}。结合你的人设和最近的聊天，读出你此刻最真实的情绪。最近聊天：${rc}。现在是${WK.nowStr()}。严格只输出一行：情绪词（2~4字）|强度（0~100整数）|效价（正/负/中，三选一）|内心独白（第一人称，40字内）|起因（20字内））`);
  const m=t.split(/[|｜]/);if(m.length<5||!/\d+/.test(m[1]))return false;
  const x={t:Date.now(),mood:m[0].trim().slice(0,6),val:Math.min(100,+m[1].match(/\d+/)[0]),v:MC[m[2].trim()[0]]?m[2].trim()[0]:'中',say:m[3].trim().slice(0,70),why:m[4].trim().slice(0,40)};
  (D[c.id]=D[c.id]||[]).push(x);D[c.id]=D[c.id].slice(-30);save();
  if(x.v==='负'&&x.val>=75)celBanner('情绪预警',`${nm(c)} 此刻「${x.mood}」，强度 ${x.val}`,()=>openApp('em'),'警');return true};
 const list=()=>{r.innerHTML=`<div class="em"><div class="em-hd"><button id="bk">${BK}</button><b>情绪监控</b><span style="width:22px"></span></div><div class="em-bd"><button class="em-btn g" id="all">${busy?'读取中……':'全部读取'}</button>${friends().map(c=>{const l=last(c);return `<div class="em-c" data-id="${c.id}"><div class="em-av" style="background-image:url('${c.avatar||DEF}')"></div><div class="m"><b>${esc(nm(c))}</b><small>${l?esc(l.say):'还没有读取记录'}</small></div>${l?`<span class="em-t" style="background:${MC[l.v]}22;color:${MC[l.v]}">${esc(l.mood)} ${l.val}</span>`:''}</div>`}).join('')||'<div class="ml-em">还没有好友</div>'}</div></div>`;
  r.querySelector('#bk').onclick=()=>closeApp();
  r.querySelector('#all').onclick=async()=>{if(busy)return;busy=true;list();for(const c of friends().slice(0,6))await read(c);busy=false;if(r.isConnected)list()};
  r.querySelectorAll('.em-c').forEach(e=>e.onclick=()=>detail(fOf(e.dataset.id)))};
 const detail=c=>{const H=D[c.id]||[],l=H.slice(-1)[0];
  const sp=H.length>1?(()=>{const w=300,h=70,pts=H.slice(-12).map((x,i,a)=>`${(i/(a.length-1))*w},${h-4-x.val/100*(h-8)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:70px;stroke:#2dd4bf;fill:none;stroke-width:2"><polyline points="${pts}"/></svg>`})():'';
  r.innerHTML=`<div class="em"><div class="em-hd"><button id="bk">${BK}</button><b>${esc(nm(c))}</b><span style="width:22px"></span></div><div class="em-bd">${l?`<div class="em-big"><em style="color:${MC[l.v]}">${esc(l.mood)}</em><span>强度 ${l.val} · ${hhmm(l.t)}</span></div><div class="em-bar"><i style="width:${l.val}%;background:${MC[l.v]}"></i></div><div class="em-q"><small>内心独白</small>${esc(l.say)}</div><div class="em-q"><small>起因</small>${esc(l.why)}</div>${sp?`<div class="em-h">情绪走势</div>${sp}`:''}<div class="em-h">历史读取</div>${H.slice().reverse().slice(0,12).map(x=>`<div class="em-q"><small>${hhmm(x.t)} · <b style="color:${MC[x.v]}">${esc(x.mood)} ${x.val}</b></small>${esc(x.say)}</div>`).join('')}`:'<div class="ml-em">还没有读取记录</div>'}<button class="em-btn" id="rd">${busy?'读取中……':'立即读取'}</button></div></div>`;
  r.querySelector('#bk').onclick=list;
  r.querySelector('#rd').onclick=async()=>{if(busy)return;busy=true;detail(c);const ok=await read(c);busy=false;if(!ok)toast('读取失败，再试一次');if(r.isConnected)detail(c)}};
 list()}

/* ===== 邮件 ===== */
const mlData=()=>{const m=S.ml=S.ml||{box:[]};return m};
function mlApp(r){
 const D=mlData(),BK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',PEN='<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';let tab='in',busy=false;
 const push=(o)=>{D.box.unshift({id:uid(),t:Date.now(),u:o.dir==='in'?1:0,...o});D.box=D.box.slice(0,120);save()};
 const incoming=(f,t)=>{const i=t.search(/[|｜]/);if(i<0||t.length<4)return false;const sub=t.slice(0,i).trim().slice(0,30),body=t.slice(i+1).trim().replace(/\\n/g,'\n').slice(0,900);push({dir:'in',fid:f.id,sub,body});celBanner('邮件 · '+nm(f),sub,()=>openApp('ml'),'邮');return true};
 const MAILQ=(f,extra)=>`（系统指令：不要用聊天口吻，这是电子邮件。你是${nm(f)}，请完全按你的人设和你们的关系写。${extra}现在是${WK.nowStr()}。严格只输出：主题|正文（正文可分段，用\\n表示换行，300字内，不要写发件人抬头以外的说明））`;
 const fetchMail=async()=>{if(busy)return;const F=friends();if(!F.length)return toast('还没有好友');busy=true;draw();const f=F[Math.floor(Math.random()*F.length)];
  const ok=incoming(f,await ask(f,MAILQ(f,'请主动给用户写一封来信，内容符合你此刻的生活和心情。')));busy=false;if(!ok)toast('这会儿没有新邮件');draw()};
 const compose=(pre)=>{const o=document.createElement('div');o.className='ml-ov';const F=friends();
  o.innerHTML=`<div class="ml-hd"><button id="x">取消</button><b>写邮件</b><button id="s">发送</button></div><div class="ml-rd"><select class="ml-in" id="to">${F.map(c=>`<option value="${c.id}" ${pre&&pre.fid===c.id?'selected':''}>${esc(nm(c))}</option>`).join('')}</select><input class="ml-in" id="sb" placeholder="主题" value="${esc(pre?pre.sub:'')}"><textarea class="ml-in" id="bd" rows="9" placeholder="正文" style="resize:none"></textarea></div>`;
  r.querySelector('.ml').append(o);o.querySelector('#x').onclick=()=>o.remove();
  o.querySelector('#s').onclick=()=>{const f=fOf(o.querySelector('#to').value),sub=o.querySelector('#sb').value.trim()||'（无主题）',body=o.querySelector('#bd').value.trim();if(!f||!body)return toast('请选收件人并写正文');
   push({dir:'out',fid:f.id,sub,body});o.remove();draw();toast('已发送');
   ask(f,MAILQ(f,`用户给你发来一封邮件，主题「${sub}」，正文：${body.slice(0,400)}。请回信。`)).then(t=>{setTimeout(()=>{incoming(f,t);if(r.isConnected&&!r.querySelector('.ml-ov'))draw()},4000+Math.random()*8000)})}};
 const read=m=>{const f=fOf(m.fid),o=document.createElement('div');o.className='ml-ov';m.u=0;save();
  o.innerHTML=`<div class="ml-hd"><button id="x">${BK}</button><b>${m.dir==='in'?'收件':'已发送'}</b><button id="rp">${m.dir==='in'?'回复':''}</button></div><div class="ml-rd"><h2>${esc(m.sub)}</h2><div class="f">${m.dir==='in'?'发件人':'收件人'}：${esc(f?nm(f):'未知')} · ${hhmm(m.t)}</div><p>${esc(m.body)}</p></div>`;
  r.querySelector('.ml').append(o);o.querySelector('#x').onclick=()=>{o.remove();draw()};
  const rp=o.querySelector('#rp');if(m.dir==='in')rp.onclick=()=>{o.remove();compose({fid:m.fid,sub:'Re: '+m.sub.replace(/^Re:\s*/,'')})}};
 const draw=()=>{const top=(r.querySelector('.ml-bd')||{}).scrollTop||0,L=D.box.filter(m=>m.dir===tab),un=D.box.filter(m=>m.dir==='in'&&m.u).length;
  r.innerHTML=`<div class="ml"><div class="ml-hd"><button id="bk">${BK}</button><b>邮件</b><button id="cp">${PEN}</button></div><div class="ml-sg"><button data-t="in" class="${tab==='in'?'on':''}">收件箱${un?` (${un})`:''}</button><button data-t="out" class="${tab==='out'?'on':''}">已发送</button></div><div class="ml-bd">${tab==='in'?`<button class="ml-in" id="fm" style="color:#0a84ff;text-align:center">${busy?'收信中……':'查收新邮件'}</button>`:''}${L.map(m=>{const f=fOf(m.fid);return `<div class="ml-r${m.u?' u':''}" data-id="${m.id}"><div class="ml-av" style="background-image:url('${(f&&f.avatar)||DEF}')"></div><div class="m"><div><b>${esc(f?nm(f):'未知')}</b><small>${hhmm(m.t)}</small></div><p class="s">${esc(m.sub)}</p><p>${esc(m.body.replace(/\n/g,' '))}</p></div></div>`}).join('')||'<div class="ml-em">这里还没有邮件</div>'}</div></div>`;
  r.querySelector('.ml-bd').scrollTop=top;r.querySelector('#bk').onclick=()=>closeApp();r.querySelector('#cp').onclick=()=>compose();
  r.querySelectorAll('.ml-sg button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  const fm=r.querySelector('#fm');if(fm)fm.onclick=fetchMail;
  r.querySelectorAll('.ml-r').forEach(e=>e.onclick=()=>read(D.box.find(x=>x.id===e.dataset.id)))};
 draw()}
})();
</script>


<!-- ===== 补丁三十六：桌面翻页去边 + 跨页拖拽 + 情绪监控（喜怒哀乐文字环 / 内心隐藏层） ===== -->
<style>
.pgs{margin:0 -18px;overscroll-behavior-x:contain}
.pg1,.pg2{padding:0 18px;box-sizing:border-box;scroll-snap-stop:always}
@keyframes e2spin{to{transform:rotate(360deg)}}
@keyframes e2glow{0%,100%{opacity:.55}50%{opacity:1}}
.e2-ring{display:block;width:100%;max-width:380px;margin:0 auto}
.e2-ring g.s{transform-box:view-box;transform-origin:170px 170px;animation:e2spin 40s linear infinite}
.e2-ring text{font-weight:600;letter-spacing:1px}
.e2-say{text-align:center;font-size:14px;line-height:1.7;color:#cfe6e2;margin:4px 8px 14px}
.e2-c{background:#17272e;border:1px solid #23404a;border-radius:16px;padding:12px;margin-bottom:10px}
.e2-c .h{display:flex;align-items:center;gap:8px}.e2-c .h i{width:10px;height:10px;border-radius:50%}.e2-c .h b{font-size:16px}.e2-c .h span{margin-left:auto;font-size:13px;color:#9bb8be}
.e2-c .bar{height:5px;border-radius:3px;background:#23404a;margin:8px 0;overflow:hidden}.e2-c .bar u{display:block;height:100%}
.e2-c .ev{display:flex;flex-wrap:wrap;gap:6px}.e2-c .ev span{font-size:12.5px;border:1px solid;border-radius:12px;padding:3px 10px;line-height:1.5}
.e2-c.d{background:#1d1530;border-color:#4c2f7a}.e2-c.d p{margin:6px 0 0;font-size:13.5px;line-height:1.7;color:#e4d4ff}
.e2-t{font-size:12px;color:#7fa3ab;text-align:center;margin:6px 0}
.e3-st{position:relative;background:radial-gradient(circle at 50% 50%,#10202a,#04070a 75%)}.e3-st.in{background:radial-gradient(circle at 50% 50%,#1a0f2a,#050308 75%)}
.e3-st.in::after{box-shadow:inset 0 0 70px 26px rgba(80,0,24,.85)!important;animation:e3p 3.2s ease-in-out infinite}@keyframes e3p{50%{opacity:.55}}.e3-st canvas{display:block}
.e3-st::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 20px rgba(0,0,0,.75)}
.e3-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.e3-g .ev span{font-size:11px;padding:2px 8px}.e3-g .h b{font-size:14px}
.e2b{height:5px;border-radius:3px;background:#23404a;margin:8px 0;overflow:hidden}.e2b u{display:block;height:100%;text-decoration:none}
</style>
<script>
(()=>{
const WK=window.__cel,nm=c=>WK.nm(c),friends=()=>(S.contacts||[]).filter(c=>!c.fdel),fOf=id=>friends().find(c=>c.id===id);
const ask=async(c,Q)=>{try{return String(await Promise.race([window.ai(c,[{r:'me',c:Q}],'dy'),new Promise((_,j)=>setTimeout(j,60000))])).trim()}catch(e){return ''}};
const hhmm=t=>new Date(t).toLocaleString('zh-CN',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});

/* ===== 跨页拖拽：拖着图标靠近屏幕左/右边缘，自动翻页 ===== */
let flipT=0;
document.addEventListener('pointermove',e=>{if(!document.querySelector('.ghost,.wghost'))return;const pgs=document.querySelector('.pgs');if(!pgs)return;const now=Date.now();if(now-flipT<700)return;
 const cp=Math.round(pgs.scrollLeft/(pgs.clientWidth||1)),to=e.clientX>innerWidth-46?cp+1:e.clientX<46?cp-1:-1;if(to<0||to>2||cp===to)return;flipT=now;pgs.scrollTo({left:to*pgs.clientWidth,behavior:'smooth'})},true);

/* ===== 情绪监控 ===== */
const EM=[['喜','#ffb703'],['怒','#ef476f'],['哀','#4cc9f0'],['乐','#7ae582']],DK=['#c084fc','#e879f9','#f472b6'];
const ED=()=>{S.em=S.em||{};return S.em};
const lastOf=c=>{const a=(ED()[c.id]||[]).filter(x=>x.e);return a[a.length-1]};
const domOf=x=>EM.map(([k,col])=>[k,x.e[k][0],col]).sort((a,b)=>b[1]-a[1])[0];
const EYE='<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',BK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const oa=openApp;openApp=function(id){if(id!=='em')return oa(id);const r=document.createElement('div');r.className='app';document.body.append(r);stack.push(r);document.body.classList.add('in');emApp2(r)};

/* ===== 沉浸画面（Canvas，已优化：手为预渲染精灵、30fps、不用 shadowBlur） ===== */

.m3-stat div{flex:1;text-align:center}.m3-stat b{display:block;font-size:24px;font-weight:900}.m3-stat small{font-size:12px;opacity:.95}

.m3-sg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.m3-sp{aspect-ratio:3/4;border-radius:14px;background:#fff;border:3px dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;box-shadow:0 6px 14px rgba(80,120,200,.12)}

</style>
<script>
(()=>{
const WK=window.__cel,nm=c=>WK.nm(c),friends=()=>(S.contacts||[]).filter(c=>!c.fdel),fOf=id=>friends().find(c=>c.id===id);
const askE=async(c,Q)=>{S.mlErr='';try{const t=String(await Promise.race([window.ai(c,[{r:'me',c:Q}],'dy'),new Promise((_,j)=>setTimeout(()=>j('等了100秒没有回应'),100000))])).trim();if(!t)S.mlErr='AI 返回了空内容';return t}catch(e){S.mlErr=String((e&&e.message)||e).slice(0,60);return ''}};
const hhmm=t=>new Date(t).toLocaleString('zh-CN',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const TH=[{bg:'#dff3ff',ac:'#4cc3ff',paper:'#f4fbff',ink:'#245a7a'},{bg:'#ffe3ee',ac:'#ff7eb6',paper:'#fff7fb',ink:'#8a3a5c'},{bg:'#ddfbea',ac:'#3fd49a',paper:'#f6fffa',ink:'#1f6a4c'},{bg:'#fff3c2',ac:'#ffc02e',paper:'#fffdf0',ink:'#7a5c00'},{bg:'#ece4ff',ac:'#a78bfa',paper:'#faf7ff',ink:'#51388f'},{bg:'#ffe6d6',ac:'#ff9a62',paper:'#fffaf5',ink:'#8a4a22'}];
const PAL=['#cdeeff','#ffd9ec','#fff0b8','#d4f8e4','#e5dcff','#ffe0cc'];
const MD=()=>{const m=S.ml=S.ml||{box:[]};return m};
const thOf=m=>TH[(m.th!=null?m.th:(parseInt(String(m.id).slice(-3),36)||0))%TH.length];
const oa=openApp;openApp=function(id){if(id!=='ml')return oa(id);const r=document.createElement('div');r.className='app';document.body.append(r);stack.push(r);document.body.classList.add('in');mlApp3(r)};

/* 让好友按人设写一封不少于 500 字的长信 */
const gen=async(f,reply)=>{const rc=(S.chats['wx'+f.id]||[]).slice(-8).map(m=>(m.r==='me'?'用户':nm(f))+'：'+String(m.c).slice(0,40)).join('；')||'（最近没聊天）';
 const base=`（系统指令：这是一封信，请忽略“简短回复”的要求，不要用聊天口吻，不要解释，不要用 markdown 符号。你是${nm(f)}，请完全按你的人设、你和用户的关系、你的说话习惯，给用户写一封从远方寄来的长信。${reply?`用户刚给你寄来一封信：「${reply.slice(0,300)}」，请先回应它，再说说你自己的近况和心里话。`:'内容可以是你的近况、见闻、对用户的牵挂和心里话，要有具体的细节和画面，体现你的性格和喜好。'}最近聊天：${rc}。现在是${WK.nowStr()}。`;
 const t1=await askE(f,base+'现在写信的上半部分：第一行写信的主题（15字内），空一行，再写正文：以称呼开头，写 3 段，不少于 300 字，先不要落款，也不要收尾。）');
 if(!t1)return {err:S.mlErr||'没有收到内容'};
 const L=t1.split('\n').map(x=>x.trim());let i=0;while(i<L.length&&!L[i])i++;
 let sub=L[i].replace(/^(主题|标题)\s*[:：]\s*/,'').replace(/[「」《》“”"]/g,'').slice(0,20),body=L.slice(i+1).join('\n').replace(/\n{3,}/g,'\n\n').trim();
 if(body.length<40){body=t1.trim();sub='来自'+nm(f)+'的信'}
 const t2=await askE(f,base+`你已经写好了信的上半部分：「${body.slice(-400)}」。现在接着写下半部分：再写 3 段，不少于 300 字，自然承接上文，最后以落款结尾。只输出这部分正文，不要重复上半部分，不要写主题。）`);
 if(t2)body+='\n\n'+t2.replace(/\n{3,}/g,'\n\n').trim();
 return {sub,body}};
const STP=[['🌸','普通'],['🍓','普通'],['☁️','普通'],['🌈','普通'],['🍀','普通'],['🧸','普通'],['⭐','稀有'],['🦋','稀有'],['🎐','稀有'],['👑','限定'],['🌙','限定'],['💎','限定']],RC={普通:'#7cc8ff',稀有:'#b794ff',限定:'#ffb21e'};
const pickStamp=()=>{const x=Math.random(),r=x<.7?'普通':x<.95?'稀有':'限定',pl=STP.filter(s=>s[1]===r);return pl[Math.floor(Math.random()*pl.length)]};

function mlApp3(r){
 const D=MD();let tab='all',ff=null,run=0;
 const shell=(top,body,dock)=>{r.innerHTML=`<div class="m3">${top}${body}${dock||''}</div>`};
 const $=s=>r.querySelector(s),top=(t,back)=>`<div class="m3-top"><button class="m3-ic" id="bk">‹</button><b>${t}</b><span class="m3-ic" style="opacity:0">·</span></div>`;
 const cnt=f=>{const L=D.box.filter(m=>m.fid===f.id&&m.dir==='in');return [L.length,L.filter(m=>m.fav).length]};

 /* 1 选好友 */
 const pick=()=>{run++;const F=friends();
  const nI=D.box.filter(m=>m.dir==='in').length,nF=D.box.filter(m=>m.fav).length,nS=new Set(D.box.map(m=>m.st).filter(Boolean)).size;
  shell(`<div class="m3-top"><button class="m3-ic" id="bk">‹</button><b>远方邮局</b><button class="m3-ic" id="wr">✎</button></div>`,`<div class="m3-sc"><div class="m3-stat"><div><b>${nI}</b><small>收到的信</small></div><div><b>${nF}</b><small>收藏</small></div><div><b>${nS}/${STP.length}</b><small>邮票</small></div></div><div class="m3-hi">挑一位好友吧</div><div class="m3-g">${F.map((c,i)=>{const [n,h]=cnt(c);return `<button class="m3-fc" data-id="${c.id}" style="background:linear-gradient(160deg,${PAL[i%6]},#fff)"><div class="m3-av" style="background-image:url('${c.avatar||DEF}')"></div><b>${esc(nm(c))}</b><div class="m3-cp">${n} 封来信 · ♥${h}</div></button>`}).join('')||'<div class="m3-em">还没有好友</div>'}</div></div>`,
   `<div class="m3-dk"><button class="m3-pl" id="bx" style="background:linear-gradient(135deg,#4cc3ff,#6f8bff)">✉ 信箱</button><button class="m3-pl" id="fv" style="background:linear-gradient(135deg,#ff7eb6,#ffa94d)">♥ 收藏夹</button><button class="m3-pl" id="sb" style="background:linear-gradient(135deg,#ffc02e,#7ae582)">邮票册</button></div>`);
  $('#wr').onclick=write;$('#sb').onclick=stamps;
  $('#bk').onclick=()=>closeApp();$('#bx').onclick=()=>{tab='all';ff=null;box()};$('#fv').onclick=()=>{tab='fav';ff=null;box()};
  r.querySelectorAll('.m3-fc').forEach(b=>b.onclick=()=>arrive(fOf(b.dataset.id)))};

 /* 2 信箱 / 收藏夹 */
 const box=()=>{const F=friends(),L=D.box.filter(m=>(tab==='fav'?m.fav:true)&&(!ff||m.fid===ff));
  shell(top(tab==='fav'?'收藏夹':'信箱'),`<div class="m3-sc" style="padding-bottom:30px"><div class="m3-ch"><button class="m3-c${!ff?' on':''}" data-f="">全部</button>${F.map(c=>`<button class="m3-c${ff===c.id?' on':''}" data-f="${c.id}">${esc(nm(c))}</button>`).join('')}</div>${L.map(m=>{const f=fOf(m.fid),t=thOf(m);return `<button class="m3-lc" data-id="${m.id}" style="background:linear-gradient(120deg,${t.bg},#fff)"><div class="m3-av s" style="background-image:url('${(f&&f.avatar)||DEF}')"></div><div class="m"><div><b>${m.dir==='in'?esc(f?nm(f):'未知'):'我 → '+esc(f?nm(f):'未知')}</b><small>${hhmm(m.t)}</small></div><p class="s" style="color:${t.ink}">${esc(m.sub)}</p><p>${esc(m.body.replace(/\n+/g,' '))}</p></div>${m.fav?'<span class="hr">♥</span>':''}</button>`}).join('')||'<div class="m3-em">这里还没有信<br>回去挑一位好友，等 TA 的来信吧</div>'}</div>`);
  $('#bk').onclick=pick;
  r.querySelectorAll('.m3-c').forEach(b=>b.onclick=()=>{ff=b.dataset.f||null;box()});
  r.querySelectorAll('.m3-lc').forEach(b=>b.onclick=()=>paper(D.box.find(x=>x.id===b.dataset.id),box))};

 /* 3 远方来信：信封由远及近 → 点击拆开 */
 const arrive=(f,reply)=>{if(!f)return;const my=++run,ti=Math.floor(Math.random()*TH.length),t=TH[ti];let res=null,fl=false,done=false,err='';
  shell('',`<div class="m3-sn"><i class="m3-cl" style="top:12%;left:-40%"></i><i class="m3-cl c2" style="top:32%;left:-70%"></i><i class="m3-cl c3" style="top:60%;left:-50%"></i>${Array.from({length:14},(_,i)=>`<i class="m3-cf" style="left:${(i*37)%100}%;animation-delay:${(i%7)*.6}s;background:${PAL[i%6]}"></i>`).join('')}<button class="m3-ic m3-bk2" id="bk">‹</button><div class="m3-tt"><span>远方传来信件</span><small>来自 ${esc(nm(f))}</small></div><div class="m3-wr"><div class="m3-en fly" id="en" style="--a:${t.ac};--b:${t.bg}"><div class="m3-bd"></div><div class="m3-lt"></div><div class="m3-pk"></div><div class="m3-fl"></div><div class="m3-sl">♥</div></div></div><div class="m3-hn" id="hn">信正在写<i>.</i><i>.</i><i>.</i></div></div>`);
  const en=$('#en'),hn=$('#hn');$('#bk').onclick=pick;
  const upd=()=>{if(my!==run||!r.contains(en)||!fl||!done)return;if(res){en.classList.add('rdy');hn.textContent='点一点信封，拆开看看 ✨'}else{hn.innerHTML='信没寄到：'+esc(err)+'<button id="rt">再寄一次</button>';$('#rt').onclick=()=>arrive(f,reply)}};
  en.addEventListener('animationend',e=>{if(e.animationName==='m3fly'){fl=true;en.classList.remove('fly');en.classList.add('fl');upd()}});
  en.onclick=()=>{if(!(fl&&done&&res)||en.dataset.o)return;en.dataset.o=1;en.classList.remove('fl');en.classList.add('open');hn.textContent='';setTimeout(()=>{if(my===run)paper(res,pick)},1500)};
  gen(f,reply).then(x=>{if(x&&x.body){res={id:uid(),t:Date.now(),u:0,dir:'in',fid:f.id,sub:x.sub,body:x.body,th:ti,fav:0,st:pickStamp()[0]};D.box.unshift(res);D.box=D.box.slice(0,200);save()}else err=(x&&x.err)||'未知原因';done=true;upd()})};

 /* 4 信纸：收藏 / 回信 */
 const paper=(m,back)=>{const f=fOf(m.fid),t=thOf(m),d=new Date(m.t);m.u=0;save();const o=document.createElement('div');o.className='m3-pp';o.style.background=`linear-gradient(180deg,${t.bg},#fff)`;
  o.innerHTML=`<div class="m3-ps"><div class="m3-pa" style="background-color:${t.paper};border-color:${t.ac}"><i class="m3-tp" style="background:${t.ac}99;left:-12px"></i><i class="m3-tp" style="background:${t.ac}99;right:-12px;transform:rotate(8deg)"></i><div class="m3-st2" style="border-color:${t.ac}"><div style="display:grid;place-items:center;font-size:30px">${m.st||'✉️'}</div></div><div class="m3-pm" style="color:${t.ac};border-color:${t.ac}">${d.getMonth()+1}月${d.getDate()}日<br>POST</div><h2 style="color:${t.ink}">${esc(m.sub)}</h2><div class="m3-fm" style="color:${t.ac}">${m.dir==='in'?'FROM':'TO'} · ${esc(f?nm(f):'')}</div><div class="m3-tx" style="color:${t.ink}">${esc(m.body)}</div><div class="m3-sk">🌸 ☁️ ⭐ 🍓</div></div></div><div class="m3-pb"><button id="x" style="background:#fff;color:${t.ink}">‹ 返回</button><button id="h" style="background:${t.ac}">${m.fav?'♥ 已收藏':'♡ 收藏'}</button>${m.dir==='in'?'<button id="rp" style="background:linear-gradient(135deg,#ff7eb6,#ffa94d)">✉ 回信</button>':''}<button id="dl" style="background:#fff;color:#f0457a;flex:none;padding:13px 16px">🗑</button></div>`;
  $('.m3').append(o);const q=s=>o.querySelector(s);
  q('#x').onclick=()=>{o.remove();back()};
  q('#dl').onclick=()=>{if(!confirm('删除这封信？'))return;D.box=D.box.filter(x=>x!==m);save();o.remove();back()};
  q('#h').onclick=()=>{m.fav=m.fav?0:1;save();q('#h').textContent=m.fav?'♥ 已收藏':'♡ 收藏';toast(m.fav?'已收藏':'已取消收藏')};
  if(q('#rp'))q('#rp').onclick=()=>{const ov=document.createElement('div');ov.className='m3-ov';ov.innerHTML=`<div class="m3-sh"><h3>写一封回信给 ${esc(f?nm(f):'TA')}</h3><textarea id="rb" placeholder="想对 TA 说的话……"></textarea><button class="m3-pl" id="sd" style="display:block;width:100%;margin-top:12px;background:linear-gradient(135deg,#4cc3ff,#ff7eb6)">寄 出</button></div>`;
   $('.m3').append(ov);ov.onclick=e=>{if(e.target===ov)ov.remove()};
   ov.querySelector('#sd').onclick=()=>{const b=ov.querySelector('#rb').value.trim();if(!b||!f)return toast('先写点什么吧');D.box.unshift({id:uid(),t:Date.now(),u:0,dir:'out',fid:f.id,sub:'Re: '+m.sub.replace(/^Re:\s*/,''),body:b,th:m.th,fav:0});save();ov.remove();o.remove();arrive(f,b)}}};
 /* 主动写信：选好友 → 写 → 寄出，对方回一封长信 */
 const write=()=>{const F=friends();if(!F.length)return toast('还没有好友');let to=F[0].id;const ov=document.createElement('div');ov.className='m3-ov';
  ov.innerHTML=`<div class="m3-sh"><h3>写信给</h3><div class="m3-ch">${F.map(c=>`<button class="m3-c${c.id===to?' on':''}" data-f="${c.id}">${esc(nm(c))}</button>`).join('')}</div><textarea id="rb" placeholder="想对 TA 说的话……"></textarea><button class="m3-pl" id="sd" style="display:block;width:100%;margin-top:12px;background:linear-gradient(135deg,#4cc3ff,#ff7eb6)">寄 出</button></div>`;
  $('.m3').append(ov);ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.querySelectorAll('.m3-c').forEach(b=>b.onclick=()=>{to=b.dataset.f;ov.querySelectorAll('.m3-c').forEach(x=>x.classList.toggle('on',x===b))});
  ov.querySelector('#sd').onclick=()=>{const b=ov.querySelector('#rb').value.trim(),f=fOf(to);if(!b||!f)return toast('先写点什么吧');D.box.unshift({id:uid(),t:Date.now(),u:0,dir:'out',fid:f.id,sub:'给 '+nm(f)+' 的信',body:b,th:Math.floor(Math.random()*TH.length),fav:0});save();ov.remove();arrive(f,b)}};
 /* 邮票册：每封来信随机附一枚邮票，普通 / 稀有 / 限定 */
 const stamps=()=>{const got=new Set(D.box.map(m=>m.st).filter(Boolean));

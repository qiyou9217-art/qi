<html lang="zh">
<head>
<meta charset="utf-8">

<style>
#celsp{position:fixed;inset:0;z-index:99999;background:#fafaf7;transition:opacity .55s ease}
#celsp.out{opacity:0;pointer-events:none}
#celsp canvas{display:block;width:100%;height:100%}

<style>
/* ===== 全局 ===== */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;color:#111;background:#000}
#wall{position:fixed;inset:0;background:linear-gradient(160deg,#dfe9f3,#f6e7ee 55%,#e4ecff) center/cover}
#home{position:fixed;inset:0;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column}
.card{background:#fff;border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
[contenteditable]{outline:none;min-width:12px;display:inline-block}
button{font:inherit;border:0;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);transform:translateX(-50%);background:rgba(30,30,32,.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:90;white-space:nowrap;animation:pop .2s}

/* ===== 状态栏 ===== */
.sb{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-weight:600;font-size:15px}
.sb i{display:flex;gap:6px;align-items:center;font-style:normal;font-size:12px}
.sb svg{height:13px;fill:#111}

/* ===== 小组件 ===== */
.wg{display:grid;grid-template-columns:84px 1fr;gap:6px 14px;padding:16px;margin-top:8px;flex:none}
.av{width:72px;height:72px;border-radius:50%;background:#eee center/cover;cursor:pointer;flex:none}
.wg .tag{margin-top:8px;font-size:12px;color:#8e8e93;text-align:center;grid-column:1}
.wg .r{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:8px;justify-content:center}
.wg .id{font-weight:700;font-size:17px}.wg .q{font-size:13px;color:#555;line-height:1.5}
.st{display:flex;gap:16px;font-size:12px;color:#8e8e93;align-items:center}
.st span{display:flex;gap:4px;align-items:center}
.st svg{width:15px;height:15px;stroke:#8e8e93;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== 图标网格（固定槽位，可自由落点）& Dock ===== */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:88px;gap:6px 8px;padding:18px 4px;align-content:start;overflow:hidden}
.slot{display:flex;justify-content:center;align-items:flex-start;border-radius:18px;transition:background .15s}
.slot.hot{background:rgba(255,255,255,.4)}
.dock{display:flex;justify-content:space-around;align-items:center;padding:14px 12px;min-height:90px;margin:0 auto 12px;width:min(100%,360px);border-radius:32px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);box-shadow:0 8px 28px rgba(0,0,0,.1);flex:none;transition:outline .15s}
.dock.hot{outline:2px solid rgba(10,132,255,.35)}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s}
.ic .t{width:58px;height:58px;border-radius:16px;background:#fff center/cover;box-shadow:0 3px 10px rgba(0,0,0,.08);display:grid;place-items:center}
.ic svg{width:28px;height:28px;stroke:#222;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock .ic span{display:none}.ic.lift{opacity:.25}.ic:active{transform:scale(.94)}.ic.hot{transform:scale(1.1)}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:scale(1.15);filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}

/* ===== 应用容器 & Home Indicator ===== */
.app{position:fixed;inset:0;background:#f2f2f7;z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:up .32s cubic-bezier(.2,.8,.2,1)}
.app.out{animation:down .25s forwards}
.app.sx{animation:sx .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px) scale(.94);opacity:0}}
@keyframes down{to{transform:translateY(40px) scale(.94);opacity:0}}
@keyframes sx{from{transform:translateX(36px);opacity:0}}
#hi{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 6px);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111;z-index:50;display:none;cursor:pointer}
#hi::after{content:"";position:absolute;inset:-14px -10px}
body.in #hi{display:block}

/* ===== 通用组件 ===== */
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);font-weight:600;min-height:48px}
.nav span{color:#0a84ff;cursor:pointer;font-weight:400;min-width:56px}.nav span:last-child{text-align:right}
.body{flex:1;overflow:auto;padding:14px 14px 130px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer}
.row .av{width:44px;height:44px;border-radius:12px}.row small{color:#8e8e93;display:block;margin-top:2px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:#0a84ff;color:#fff;padding:11px 18px;border-radius:14px;margin:6px 6px 6px 0}.btn.g{background:#e5e5ea;color:#111}
input,textarea{width:100%;border:0;background:#fff;border-radius:14px;padding:12px;font:inherit;margin:6px 0;outline:none;box-shadow:0 1px 4px rgba(0,0,0,.05)}
h4{margin:16px 4px 6px;color:#8e8e93;font-weight:500;font-size:13px}
.empty{text-align:center;color:#8e8e93;margin-top:40px}

/* ===== 微信：背景 / Header / 加号菜单 ===== */
.wx{background:linear-gradient(180deg,#f4f5f7,#eceef2)}
.nav2{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 8px}
.nav2 h1{font-size:34px;font-weight:800;letter-spacing:-.8px}
.plus,.bb,.dec{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.08);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.plus:active{transform:scale(.88) rotate(90deg)}.bb:active{transform:scale(.88)}
.plus svg{width:24px;height:24px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round}
.plus .dot{fill:#0a84ff;stroke:none}
.nav3{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 10px}
.nav3 b{font-size:17px;font-weight:700}
.bb,.dec{width:38px;height:38px}.dec{cursor:default}
.bb svg,.dec svg{width:21px;height:21px;stroke:#8e8e93;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dec svg{width:19px;height:19px;stroke-width:1.8}
.menu{position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 70px);z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px;transform-origin:top right;animation:pop .2s}
.menu div{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;font-size:15px;cursor:pointer;white-space:nowrap}
.menu div:active{background:#f0f0f3}
.menu svg{width:20px;height:20px;stroke:#111;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ===== 微信：个人卡片（毛玻璃叠层） ===== */
.me{position:relative;margin:8px 20px 24px;padding:16px;display:flex;gap:14px;align-items:center;border-radius:24px;background:rgba(255,255,255,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.85);box-shadow:0 6px 20px rgba(0,0,0,.07)}
.me::before,.me::after{content:"";position:absolute;left:16px;right:16px;bottom:-8px;height:22px;border-radius:0 0 22px 22px;background:rgba(255,255,255,.55);box-shadow:0 4px 12px rgba(0,0,0,.05);z-index:-1}
.me::after{left:32px;right:32px;bottom:-15px;background:rgba(255,255,255,.32)}
.me .av{width:62px;height:62px;border-radius:18px}
.me .tx{min-width:0;flex:1}.me .id{font-weight:800;font-size:18px;display:block}
.me .sg{display:block;font-size:13px;color:#6e6e73;margin-top:5px;line-height:1.4}

/* ===== 微信：好友 / 会话卡片 ===== */
.pg{flex:1;min-height:0;display:flex;flex-direction:column}
.fl{margin:0 20px calc(env(safe-area-inset-bottom) + 112px);flex:1;min-height:0;overflow-y:auto;background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:6px 0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.fr{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;transition:background .15s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fr:active{background:#f4f5f7}
.fr .av{width:48px;height:48px;border-radius:14px;cursor:pointer}
.fr.rd .av{border-radius:50%}
.fr .mid{flex:1;min-width:0}.fr b{display:block;font-size:16px}
.fr small{display:block;color:#8e8e93;font-size:13px;margin-top:3px;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr time{font-size:12px;color:#b4b4ba;align-self:flex-start;margin-top:4px}

/* ===== 微信：动态 ===== */
.top{margin:14px 20px 0;padding:14px;background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);flex:none}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.who .av{width:46px;height:46px;border-radius:14px}.who b{flex:1;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .plus{width:38px;height:38px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.who .plus svg{width:26px;height:26px;stroke-width:1.6}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sq{aspect-ratio:1;border-radius:14px;background:#f1f2f4 center/cover;display:grid;place-items:center;cursor:pointer}
.sq.add{background:#e4e5e9;cursor:default}
.sq svg{width:22px;height:22px;stroke:#a0a2a8;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hr{height:1px;background:#e3e5ea;margin:16px 34px 12px;flex:none}
.feed{flex:1;min-height:0;overflow-y:auto;padding:4px 20px calc(env(safe-area-inset-bottom) + 112px);-webkit-overflow-scrolling:touch}
.post{background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-bottom:14px}
.ph{display:flex;gap:10px;align-items:center}
.ph .av{width:40px;height:40px;border-radius:12px;cursor:default}.ph b{font-size:15px}
.ph small{color:#a0a2a8;font-size:11px;display:block;margin-top:2px}
.ph em{font-style:normal;font-size:12px;color:#c7c7cc;cursor:pointer;padding:4px}
.pt{margin:10px 0;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-size:15px}
.pi{display:grid;gap:6px;margin-bottom:10px}
.pi.c1{grid-template-columns:minmax(0,66%)}.pi.c2{grid-template-columns:repeat(2,1fr)}.pi.c3{grid-template-columns:repeat(3,1fr)}
.pi i{aspect-ratio:1;border-radius:12px;background:#eee center/cover}
.pf{display:flex;justify-content:flex-end;gap:18px;margin-top:4px}
.pf button{background:none;display:flex;align-items:center;gap:5px;color:#8e8e93;font-size:13px;padding:4px}
.pf svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pf .lk{color:#ff3b30}.pf .lk svg{fill:#ff3b30}
.cm{background:#f4f5f7;border-radius:12px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.7;word-break:break-word}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.th{aspect-ratio:1;border-radius:14px;background:#eee center/cover;position:relative}
.th u{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;text-decoration:none;display:grid;place-items:center;cursor:pointer}
.th.ad{background:#e9eaee;display:grid;place-items:center;cursor:pointer}
.th svg{width:26px;height:26px;stroke:#a0a2a8;fill:none;stroke-width:1.8;stroke-linecap:round}
.seg{display:flex;background:#e4e5e9;border-radius:12px;padding:3px}
.seg b{flex:1;text-align:center;padding:8px;border-radius:10px;font-size:14px;color:#6e6e73;cursor:pointer;transition:all .2s}
.seg b.on{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ===== 微信：我的 ===== */
.scr{flex:1;min-height:0;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 112px);-webkit-overflow-scrolling:touch}
.hero{display:flex;flex-direction:column;align-items:center;padding:38px 20px 24px}
.hero .av{width:96px;height:96px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.12);transition:transform .2s}
.hero .av:active{transform:scale(.95)}
.hero .id{display:block;margin-top:14px;font-size:22px;font-weight:800;text-align:center;max-width:80vw;word-break:break-all}
.hero .ac{display:block;margin-top:6px;font-size:14px;color:#8e8e93;text-align:center;max-width:80vw;word-break:break-all}
.mn{margin:0 20px;background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:6px}
.mi{position:relative;display:flex;align-items:center;gap:14px;padding:15px 12px;cursor:pointer;border-radius:14px;transition:background .15s}
.mi:active{background:#f4f5f7}
.mi+.mi::before{content:"";position:absolute;top:0;left:50px;right:12px;height:1px;background:#f0f1f4}
.mi svg{width:22px;height:22px;stroke:#8e8e93;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mi span{flex:1;font-size:16px}
.mi svg.ch{width:18px;height:18px;stroke:#c3c4ca;stroke-width:2.2}

/* ===== 微信：底部胶囊导航 ===== */
.tb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 26px);display:flex;gap:4px;padding:8px;background:#fff;border-radius:32px;box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:5}
.tb b{display:flex;flex-direction:column;align-items:center;gap:3px;width:66px;padding:7px 0;border-radius:24px;font-size:11px;font-weight:500;color:#8e8e93;cursor:pointer;transition:all .25s}
.tb b svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb b.on{background:#ececf0;color:#111}

/* ===== 弹层 ===== */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
.sh{width:100%;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 28px);animation:sl .3s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow:auto}
.sh h3{margin-bottom:8px}.sh input,.sh textarea{background:#f2f2f7;box-shadow:none}
.ck{display:flex;align-items:center;gap:12px;padding:10px 4px;font-size:16px}.ck input{width:20px;height:20px;margin:0;box-shadow:none;accent-color:#0a84ff}
@keyframes fade{from{opacity:0}}@keyframes sl{from{transform:translateY(100%)}}

/* ===== 聊天 ===== */
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:76%;padding:9px 13px;border-radius:18px;line-height:1.45;white-space:pre-wrap;word-break:break-word;animation:pop .2s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.m.ai{align-self:flex-start;background:#fff}.m.me{align-self:flex-end;background:#95ec69}
.m small{display:block;opacity:.55;font-size:11px;margin-bottom:2px}
.msgs.im .m.ai{background:#e9e9eb}.msgs.im .m.me{background:#0a84ff;color:#fff}
.bar{display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 26px);background:rgba(255,255,255,.9);backdrop-filter:blur(20px)}
.bar input{margin:0;border-radius:20px;background:#f2f2f7}.bar button{width:40px;border-radius:50%;background:#0a84ff;color:#fff;font-size:18px}

/* ===== 音乐 ===== */
.cover{width:min(70vw,300px);aspect-ratio:1;border-radius:24px;margin:10px auto 18px;background:#ddd center/cover;box-shadow:0 18px 40px rgba(0,0,0,.25);transition:transform .4s}
.cover.p{transform:scale(1.04)}
.ctl{display:flex;justify-content:center;gap:26px;align-items:center;margin:12px}.ctl button{width:60px;height:60px;border-radius:50%;background:#111;color:#fff;font-size:22px}
input[type=range]{padding:0;box-shadow:none;background:none;accent-color:#111}
</style>

<!-- ===== 开屏动画：两条线上下波动、交错（Celyra） ===== -->
<div id="celsp" aria-hidden="true"><canvas></canvas></div>
<script>
(()=>{
const box=document.getElementById('celsp'),cv=box.querySelector('canvas'),x=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,3);
let W=0,H=0;
const fit=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};
fit();addEventListener('resize',fit);
const T0=performance.now(),DUR=3200,FADE=550,K=Math.PI/0.7;
let out=0;
const env=u=>Math.exp(-Math.pow(u/0.6,2));
const finish=()=>{
 if(out)return;out=1;box.classList.add('out');
 setTimeout(()=>box.remove(),FADE+80);
};
box.addEventListener('click',finish);
const frame=now=>{
 if(!box.isConnected)return;
 const t=(now-T0)/1000;
 x.clearRect(0,0,W,H);
 const half=Math.min(W*0.42,330),A=half*0.4,cx=W/2,cy=H/2;
 const th=Math.PI/2+1.15*Math.sin(t*2.3);
 const fadeIn=Math.min(1,t/0.45);
 x.lineWidth=3;x.lineCap='round';x.lineJoin='round';
 x.strokeStyle='rgba(88,88,88,'+fadeIn+')';
 [1,-1].forEach(s=>{
  x.beginPath();
  for(let i=0;i<=160;i++){
   const u=-1+2*i/160,px=cx+u*half,py=cy-A*env(u)*Math.cos(K*u+s*th);
   i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.stroke();
 });
 if(!out&&t*1000>=DUR)finish();
 requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
})();
</script>

.body.dy{padding:14px 14px 120px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dy-p{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;background:#fff;border-radius:20px;padding:14px 14px 10px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.dy-h{display:flex;align-items:center;gap:10px}
.dy-hn{flex:1;min-width:0}.dy-hn b{display:flex;align-items:center;gap:4px;font-size:15px}
.dy-hn small{color:#8e8e93;font-size:12px}

/* ===== 拖拽重排（长按后拖动，落在哪个槽位就停在哪里） ===== */
function target(x,y){
 const t=document.elementFromPoint(x,y),dk=t?.closest('.dock');
 if(dk){const c=t.closest('.ic');return c?{el:c,k:'di',id:c.dataset.id}:{el:dk,k:'dk'}}
 let s=t?.closest('.slot');
 if(!s){const g=$('.grid').getBoundingClientRect();
  if(x>=g.left&&x<=g.right&&y>=g.top&&y<=g.bottom){let b=1e9;
   document.querySelectorAll('.slot').forEach(c=>{const r=c.getBoundingClientRect(),d=Math.hypot(x-r.left-r.width/2,y-r.top-r.height/2);if(d<b){b=d;s=c}})}}
 return s?{el:s,k:'g',i:+s.dataset.i}:{};
}
function drop(id,T){
 const L=S.layout,gi=L.grid.indexOf(id),di=L.dock.indexOf(id);
 if(T.k==='g'){const j=T.i,o=L.grid[j];if(gi===j)return;
  if(gi>-1){L.grid[gi]=o;L.grid[j]=id}
  else{L.grid[j]=id;if(o)L.dock[di]=o;else L.dock.splice(di,1)}}
 else if(T.k==='di'){if(T.id===id)return;const dj=L.dock.indexOf(T.id);
  if(gi>-1){L.grid[gi]=T.id;L.dock[dj]=id}else{L.dock[di]=T.id;L.dock[dj]=id}}
 else if(T.k==='dk'){
  if(gi>-1){if(L.dock.length>=4)return;L.grid[gi]=null;L.dock.push(id)}
  else{L.dock.splice(di,1);L.dock.push(id)}}
 save();
}
function dragify(el){
 let timer,drag,ghost,sx,sy,mv,hot;
 const place=e=>{ghost.style.left=e.clientX-30+'px';ghost.style.top=e.clientY-30+'px';
  const T=target(e.clientX,e.clientY);if(hot)hot.classList.remove('hot');hot=T.el;if(hot)hot.classList.add('hot')};
 el.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;mv=0;drag=0;el.setPointerCapture(e.pointerId);
  timer=setTimeout(()=>{drag=1;el.classList.add('lift');ghost=el.cloneNode(true);ghost.className='ic ghost';document.body.append(ghost);place(e);navigator.vibrate&&navigator.vibrate(12)},320)};
 el.onpointermove=e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)mv=1;if(drag)place(e);else if(mv)clearTimeout(timer)};
 el.onpointerup=e=>{clearTimeout(timer);
  if(drag){ghost.remove();drop(el.dataset.id,target(e.clientX,e.clientY));renderHome()}
  else if(!mv)openApp(el.dataset.id)};
 el.onpointercancel=()=>{clearTimeout(timer);if(ghost)ghost.remove();el.classList.remove('lift');if(drag)renderHome()};
}

/* ===== 角色卡导入（支持 PNG 内嵌 / JSON / TXT / MD） ===== */
async function readCard(f){
 const ext=f.name.split('.').pop().toLowerCase(),base=f.name.replace(/\.[^.]+$/,'');let j,av='';
 if(ext==='png'){
  const b=new Uint8Array(await f.arrayBuffer()),dv=new DataView(b.buffer);let p=8;
  while(p<b.length){const n=dv.getUint32(p),ty=String.fromCharCode(...b.slice(p+4,p+8));
   if(ty==='tEXt'){const s=new TextDecoder('latin1').decode(b.slice(p+8,p+8+n)),i=s.indexOf('\0');
    if(s.slice(0,i)==='chara'){j=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.slice(i+1)),c=>c.charCodeAt(0))));break}}
   p+=12+n}
  av=await new Promise(res=>shrink(URL.createObjectURL(f),256,res));
 }else if(ext==='json')j=JSON.parse(await f.text());
 else j={name:base,description:await f.text()};
 if(!j)throw'未找到角色数据';
 const d=j.data||j,persona=[d.description,d.personality,d.scenario].filter(Boolean).join('\n');
 return{name:d.name||base,persona,sign:(d.personality||d.description||'').replace(/\s+/g,' ').slice(0,20)||'这个人很神秘',avatar:av,first:d.first_mes||''};
}
function addContact(o){
 const id=uid();S.contacts.push({id,name:o.name,sign:o.sign||'',persona:o.persona||'',avatar:o.avatar||''});
 if(o.first)S.chats['wx'+id]=[{r:'ai',c:o.first,n:o.name,t:Date.now()}];save();
}

function postPage(r,back){

 const draw=()=>{
  r.innerHTML=`<div class="nav"><span id="cx">取消</span><b>发表动态</b><span id="ok" style="font-weight:600">发布</span></div>
  <div class="body"><textarea id="tx" rows="6" placeholder="这一刻的想法…">${esc(txt)}</textarea>

  <h4>谁可以看</h4><div class="seg">${['公开','指定好友'].map(v=>`<b class="${v===vis?'on':''}" data-v="${v}">${v}</b>`).join('')}</div>
  ${vis==='指定好友'?(S.contacts.map(c=>`<label class="ck"><input type="checkbox" value="${c.id}" ${who.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')||'<p class="empty" style="margin-top:14px">还没有好友</p>'):''}</div>`;
  const tx=r.querySelector('#tx');tx.oninput=()=>txt=tx.value;
  r.querySelector('#cx').onclick=back;
  r.querySelector('#ad')&&(r.querySelector('#ad').onclick=()=>pick(v=>{imgs.push(v);draw()},720));
  r.querySelectorAll('[data-d]').forEach(u=>u.onclick=()=>{imgs.splice(+u.dataset.d,1);draw()});
  r.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vis=b.dataset.v;draw()});
  r.querySelectorAll('.ck input').forEach(c=>c.onchange=()=>{who=[...r.querySelectorAll('.ck input:checked')].map(x=>x.value)});
  r.querySelector('#ok').onclick=()=>{
   if(!txt.trim()&&!imgs.length)return alert('写点什么或选张图片吧');
   if(vis==='指定好友'&&!who.length)return alert('请至少选择一位可见的好友');
   S.moments.push({id:uid(),t:txt.trim(),imgs,vis,who,ts:Date.now(),liked:false,comments:[]});save();back()};
 };draw();
}

/* ===== 音乐（iTunes 搜索，30 秒试听） ===== */
const au=new Audio();let list=[],idx=-1;
function music(r){
 r.innerHTML=`<div class="nav"><span></span><b>音乐</b><span></span></div><div class="body">
 <div class="cover" id="cv"></div><div style="text-align:center"><b id="tn">未播放</b><div id="ar" style="color:#8e8e93;font-size:13px;margin-top:4px">搜索歌曲或粘贴音频 URL</div></div>
 <input type="range" id="pg" value="0" min="0" max="100"><div class="ctl"><button id="pv">⏮</button><button id="pp">▶</button><button id="nx">⏭</button></div>
 <input id="q" placeholder="搜索歌曲 / 歌手，或粘贴 mp3 链接，回车确认"><div id="ls"></div></div>`;
 const g=s=>r.querySelector(s);
 const show=()=>{const t=list[idx];if(!t)return;g('#tn').textContent=t.trackName;g('#ar').textContent=t.artistName;g('#cv').style.backgroundImage=`url(${t.artworkUrl100?.replace('100x100','600x600')})`};
 const play=i=>{if(!list[i])return;idx=i;au.src=list[i].previewUrl;au.play();show()};
 const bind=()=>r.querySelectorAll('#ls .row').forEach(x=>x.onclick=()=>play(+x.dataset.i));
 const draw=()=>{g('#ls').innerHTML=list.map((t,i)=>`<div class="row" data-i="${i}"><div class="av" style="background-image:url(${t.artworkUrl100})"></div><div><b>${esc(t.trackName)}</b><small>${esc(t.artistName)}</small></div></div>`).join('');bind()};
 g('#q').onkeydown=async e=>{if(e.key!=='Enter')return;const v=e.target.value.trim();
  if(/^https?:\/\//.test(v)){list=[{trackName:'自定义音频',artistName:v,previewUrl:v,artworkUrl100:''}];draw();play(0);return}
  try{const j=await(await fetch('https://itunes.apple.com/search?media=music&limit=20&term='+encodeURIComponent(v))).json();list=j.results.filter(x=>x.previewUrl);draw()}catch(err){alert('搜索失败，请检查网络')}};
 g('#pp').onclick=()=>au.paused?au.play():au.pause();
 g('#pv').onclick=()=>play((idx-1+list.length)%list.length);g('#nx').onclick=()=>play((idx+1)%list.length);
 au.onplay=()=>{g('#pp')&&(g('#pp').textContent='⏸',g('#cv').classList.add('p'))};
 au.onpause=()=>{g('#pp')&&(g('#pp').textContent='▶',g('#cv').classList.remove('p'))};
 au.ontimeupdate=()=>{const p=g('#pg');if(p&&au.duration)p.value=au.currentTime/au.duration*100};
 au.onended=()=>play((idx+1)%list.length);
 g('#pg').oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
 if(list.length){draw();show();au.paused||au.onplay()}
}

.ck2.on{background:#0a84ff;border-color:#0a84ff}

/* ===== 长按操作面板 / 遮罩 ===== */
.bk2{position:absolute;inset:0;z-index:25}
.po{position:absolute;z-index:30;min-width:150px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;animation:pop .15s;color:#111}
.po div{padding:11px 14px;border-radius:10px;font-size:15px;cursor:pointer;white-space:nowrap}
.po div:active{background:#f0f0f3}.po div.dg{color:#ff3b30}
.po.em{display:grid;grid-template-columns:repeat(6,1fr);width:min(300px,86vw)}
.po.em div{text-align:center;padding:8px 0;font-size:22px}

/* ===== 功能胶囊（长按左侧按钮展开） ===== */
.caps{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom) + 96px);display:flex;flex-direction:column;gap:10px;z-index:26}
.cp{width:min(68vw,272px);height:54px;border-radius:28px;display:flex;align-items:center;gap:8px;padding:0 18px 0 16px;color:#fff;cursor:pointer;opacity:0;transform:translateY(14px) scale(.92);animation:cpin .35s cubic-bezier(.2,.9,.3,1.2) forwards}
.cp.out{animation:cpout .22s 0s forwards!important}
@keyframes cpin{to{opacity:1;transform:none}}
@keyframes cpout{from{opacity:1;transform:none}to{opacity:0;transform:translateY(14px) scale(.92)}}
.cp>svg{width:24px;height:24px;flex:none}
.cp .tt{flex:1;text-align:center;min-width:0}
.cp .tt b{display:block;font-size:15px;font-weight:700}
.cp .tt small{display:block;font-size:10.5px;opacity:.7;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .dots{width:22px;height:6px;flex:none;fill:currentColor;opacity:.95}
.cp.c1{background:#7d7d7d}.cp.c2{background:#fff;color:#161616;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.cp.c3{background:#6e6e6e}.cp.c4{background:#6a6a6a}

/* ===== 底部输入栏 ===== */
.qb{margin:0 14px 6px;padding:8px 12px;border-radius:14px;background:var(--pill);font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.qb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qb u{text-decoration:none;cursor:pointer;font-size:18px;line-height:1}
.ib{display:flex;align-items:center;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 26px);flex:none}
.lb{width:var(--lbs);height:var(--lbs);border-radius:50%;border:none;background:transparent center/cover;box-shadow:none;flex:none;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pl2{flex:1;min-width:0;height:var(--ph);border-radius:24px;background:var(--pill);box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 4px 0 16px}
.pl2 input{margin:0;padding:0;background:transparent;box-shadow:none;border-radius:0;flex:1;min-width:0;font-size:15px;color:var(--fg)}
.sd{flex:none;width:0;height:32px;opacity:0;overflow:hidden;border-radius:50%;background:var(--bm);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,.8,.3,1);cursor:pointer}
.sd svg{width:18px;height:18px;stroke:var(--bmt);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib.ex .sd{width:32px;opacity:1;margin-left:6px}
.rg{display:flex;gap:0;max-width:68px;overflow:hidden;transition:max-width .3s cubic-bezier(.3,.8,.3,1),opacity .2s}
.ib.ex .rg{max-width:0;opacity:0}
.rg b{width:34px;height:var(--ph);display:grid;place-items:center;cursor:pointer;flex:none}
.rg svg{width:27px;height:27px;stroke:var(--fg);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ===== 多选操作栏 ===== */
.mbar{display:none;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 26px);flex:none}
.mbar .btn{flex:1;margin:0}
.cd.ms .ib{display:none}.cd.ms .mbar{display:flex}

/* ===== 聊天设置：三个头像 ===== */
.av3{display:flex;justify-content:space-around;text-align:center}
.av3 .av{width:60px;height:60px;border-radius:50%;margin:0 auto 6px}
.av3 small{display:block;font-size:11px;color:#8e8e93;max-width:none}
.av3 u{font-size:11px;color:#0a84ff;text-decoration:none;cursor:pointer}

/* ===== 全屏爱心动效 ===== */
.hf{position:fixed;inset:0;z-index:95;pointer-events:none;overflow:hidden}
.hf i{position:absolute;bottom:-40px;font-style:normal;opacity:0;animation:fly var(--d) ease-in forwards}
@keyframes fly{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(-112vh) translateX(var(--x)) scale(1.2);opacity:0}}
</style>

<script>
(()=>{
/* ===== 全局换图：所有换图处都有「相册」+「URL」 ===== */
window.pick=(cb,max=512)=>{
 const o=modal(document.body,'选择图片','<button class="btn g" id="lf" style="width:100%;margin:6px 0">从相册选择</button><input id="lu" placeholder="或粘贴图片 URL（https://…）">',o=>{const v=o.querySelector('#lu').value.trim();if(v)cb(v)});
 o.querySelector('#lf').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(f){shrink(URL.createObjectURL(f),max,cb);o.remove()}};i.click()};
};
window.imgSheet=(r,cb,max)=>pick(cb,max);

/* ===== 修正后的小人图标（底边无缝连接外白环） ===== */
const DEFB='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27white%27 stroke-width=%271.8%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3CclipPath id=%27c%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2710%27/%3E%3C/clipPath%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2710%27 fill=%27%239a9a9a%27/%3E%3Ccircle cx=%2712%27 cy=%279.2%27 r=%273.2%27 fill=%27%23ffffff%27/%3E%3Cpath clip-path=%27url(%23c)%27 d=%27M4.2 22c0-4.3 3.5-7 7.8-7s7.8 2.7 7.8 7z%27 fill=%27%23ffffff%27/%3E%3C/svg%3E';
const PLANE='M20.35 4.68Q21 3 19.32 3.65L4.68 9.35Q3 10 4.56 10.89L8.44 13.11Q10 14 10.89 15.56L13.11 19.44Q14 21 14.65 19.32ZM19.6 4.5L10.2 13.8';
const SMILE='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M9 10v.01M15 10v.01M8.3 14.2c1 1.4 2.300 2.100 3.700 2.100s2.700-.7 3.700-2.100"/></svg>';
const DOTS='<svg class="dots" viewBox="0 0 24 6"><circle cx="4" cy="3" r="2"/><circle cx="12" cy="3" r="2"/><circle cx="20" cy="3" r="2"/></svg>';
const ICO={
 moon:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z"/></svg>',
 hp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.500 15.500V12a7.500 7.500 0 0 1 15 0v3.500" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/><path d="M4 14h2.500A1.500 1.500 0 0 1 8 15.500v3A1.500 1.500 0 0 1 6.500 20h-1A1.500 1.500 0 0 1 4 18.500zM20 14h-2.500a1.500 1.500 0 0 0-1.500 1.500v3a1.500 1.500 0 0 0 1.500 1.500h1a1.500 1.500 0 0 0 1.500-1.500z"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-8.500-5.300-8.500-11.500A4.800 4.800 0 0 1 12 6.700a4.800 4.800 0 0 1 8.500 2.800C20.500 15.700 12 21 12 21z"/></svg>',
 work:'<svg viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="#fff"/><circle cx="12" cy="10" r="2.300" fill="#6a6a6a"/><path d="M7.800 17c.5-2 2.100-3.100 4.200-3.100s3.700 1.100 4.200 3.100z" fill="#6a6a6a"/></svg>'};
const CP=[['Night mode','Silence all notifications','moon','c1'],['me time','On','hp','c2'],['<3','','heart','c3'],['Work','Get things done','work','c4']];
const EM=[...'😀😂🥹😍🥰😘😎🤔😭😡🥺😴🙏👍👏💪🎉💔🌹🔥✨🌙☕🍰'];

/* ===== 全屏爱心动效 ===== */
const hearts=()=>{const f=document.createElement('div');f.className='hf';
 f.innerHTML=Array.from({length:28},()=>`<i style="left:${Math.random()*92}%;font-size:${20+Math.random()*28}px;color:hsl(${340+Math.random()*20},90%,${55+Math.random()*15}%);--d:${2.6+Math.random()*1.4}s;--x:${(Math.random()-.5)*80}px;animation-delay:${Math.random()*1.5}s">❤</i>`).join('');
 document.body.append(f);setTimeout(()=>f.remove(),5200)};

/* ===== 微信单人聊天详情（群聊与 iMessage 仍走原界面） ===== */
const oldChat=window.chat;
window.chat=function(r,st,c,back){
 if(st!=='wx'||c.members)return oldChat(r,st,c,back);
 const H=S.chats['wx'+c.id]=S.chats['wx'+c.id]||[];S.night=S.night||{};
 let quote=null,sel=null,busy=0,lt,lf;
 const dn=()=>c.remark||c.name,nt=()=>!!S.night[c.id];
 const oa=()=>c.chatAv||DEF,ua=()=>c.myAv||DEF;
 const bgc=()=>{r.style.background=nt()?'#0d0d0f':'#f4f5f7'};
 const leave=()=>{r.style.background='';back()};
 r.classList.remove('sx');void r.offsetWidth;r.classList.add('sx');bgc();
 r.innerHTML=`<div class="cd${nt()?' nt':''}" id="cd">
 <div class="ch"><div class="hb" id="bk">${svg('M15 5l-7 7 7 7')}</div>
  <div class="dv"><i style="background-image:url('${oa()}')"></i><i style="background-image:url('${ua()}')"></i></div>
  <div class="hn">${esc(dn())}</div>
  <div class="hb s" id="vc">${svg(IH)}</div><div class="hb s" id="mn">${svg('M4 7h16M4 12h16M4 17h16')}</div></div>
 <div class="ml" id="ml"></div><div id="qa"></div>
 <div class="ib"><div class="lb" style="background-image:url('${DEFB}')"></div>
  <div class="pl2"><input placeholder="输入消息"><div class="sd" id="sd">${svg('M12 19V5M5 12l7-7 7 7')}</div></div>
  <div class="rg"><b id="em">${SMILE}</b><b id="rv">${svg(PLANE)}</b></div></div>
 <div class="mbar"><button class="btn g" data-a="dl">删除</button><button class="btn" data-a="fv">收藏</button><button class="btn g" data-a="x">取消</button></div></div>`;
 const q=s=>r.querySelector(s),cd=q('#cd'),ml=q('#ml'),ib=q('.ib'),ta=q('.pl2 input'),lb=q('.lb');

 /* AI 上下文（排除已撤回消息） */
 const ctx=()=>H.filter(m=>!m.rc).map(m=>({r:m.r,c:(m.q?`（引用「${m.q.c}」）`:'')+(m.img?'[图片]':m.card?'[发来一起听歌的邀请]':m.c)}));
 const fav=ix=>{S.favs=S.favs||[];let n=0;ix.forEach(i=>{const m=H[i];if(!m||(!m.c&&!m.img))return;
   if(S.favs.some(f=>f.cid===c.id&&f.mt===m.t&&f.text===(m.c||'')&&f.img===(m.img||'')))return;
   S.favs.push({id:uid(),cid:c.id,from:m.r==='me'?S.me.name:dn(),mine:m.r==='me'?1:0,text:m.c||'',img:m.img||'',mt:m.t,ts:Date.now()});n++});save();toast(n?'已收藏':'已经收藏过了')};

 /* 通用弹出面板 */
 const rm=()=>cd.querySelectorAll('.po,.pbk').forEach(x=>x.remove());
 const pop=(a,items,fn,right,cls)=>{rm();
  const bd=document.createElement('div'),p=document.createElement('div');bd.className='bk2 pbk';bd.onclick=rm;
  p.className='po '+(cls||'');p.innerHTML=items.map(([n,k,x])=>`<div data-k="${k}" class="${x||''}">${n}</div>`).join('');
  cd.append(bd,p);p.querySelectorAll('div').forEach(d=>d.onclick=()=>{rm();fn(d.dataset.k)});
  const R=cd.getBoundingClientRect(),B=a.getBoundingClientRect(),h=p.offsetHeight,w=p.offsetWidth;
  let top=B.bottom-R.top+8;if(top+h>R.height-110)top=B.top-R.top-h-8;
  const left=right?B.right-R.left-w:B.left-R.left;
  p.style.top=Math.max(8,top)+'px';p.style.left=Math.max(10,Math.min(left,R.width-w-10))+'px'};

 /* 消息操作 */
 const act={
  ed:i=>{const o=modal(r,'编辑消息','<textarea id="et" rows="4"></textarea>',o=>{const v=o.querySelector('#et').value.trim();if(!v)return false;H[i].c=v;save();paint()});o.querySelector('#et').value=H[i].c||''},
  dl:i=>{H.splice(i,1);save();paint()},
  fv:i=>fav([i]),
  qt:i=>{quote={n:H[i].r==='me'?S.me.name:dn(),c:(H[i].c||'').slice(0,60)};qpaint();ta.focus()},
  rc:i=>{H[i].rc=1;save();paint()},
  ms:i=>{sel=new Set([i]);cd.classList.add('ms');paint()}};
 const menu=(i,b)=>{const m=H[i],me=m.r==='me',txt=!m.img&&!m.card&&!m.qa;
  const L=me?[['编辑消息','ed'],['删除消息','dl','dg'],['收藏','fv'],['引用消息','qt'],['撤回消息','rc']]:[['编辑','ed'],['删除','dl','dg'],['收藏','fv'],['引用','qt'],['多选消息操作','ms']];
  pop(b,L.filter(x=>txt||(!['ed','qt'].includes(x[1])&&!(m.card&&x[1]==='fv'))),k=>act[k](i),me)};

 /* 消息渲染 */
 const paint=bt=>{const keep=ml.scrollTop;
  ml.innerHTML=H.map((m,i)=>{
   if(m.rc)return `<div class="rc">${m.r==='me'?'你':esc(dn())}撤回了一条消息</div>`;
   const me=m.r==='me',av=me?ua():oa();
   const body=(m.q?`<div class="qt">${esc(m.q.n)}：${esc(m.q.c)}</div>`:'')+(m.img?`<img src="${esc(m.img)}">`:m.card?`<div class="lc">${ICO.hp.replace('<svg','<svg style="width:30px;height:30px"')}<div><b>一起听歌邀请</b><small>me time · Listen together</small></div></div>`:m.qa&&window.qaCardHtml?window.qaCardHtml(m):esc(m.c));
   return `<div class="rw" data-i="${i}">${sel?`<i class="ck2${sel.has(i)?' on':''}">${sel.has(i)?'✓':''}</i>`:''}<div class="mr ${me?'u':'o'}"><div class="ma" style="background-image:url('${av}')"></div><div class="mb${m.qa?' qcb':''}">${body}</div></div></div>`}).join('');
  ml.querySelectorAll('.rw').forEach(w=>{const i=+w.dataset.i,b=w.querySelector('.mb');let t,fired;
   w.onclick=()=>{if(fired){fired=0;return}if(sel){sel.has(i)?sel.delete(i):sel.add(i);paint()}};
   b.onpointerdown=()=>{fired=0;if(sel)return;t=setTimeout(()=>{fired=1;navigator.vibrate&&navigator.vibrate(12);menu(i,b)},450)};
   b.onpointerup=b.onpointerleave=b.onpointercancel=()=>clearTimeout(t);
   b.oncontextmenu=e=>{e.preventDefault();if(!fired&&!sel){fired=1;clearTimeout(t);menu(i,b)}}});
  ml.scrollTop=bt?1e9:keep};
 const qpaint=()=>{q('#qa').innerHTML=quote?`<div class="qb"><span>引用 ${esc(quote.n)}：${esc(quote.c)}</span><u id="qx">×</u></div>`:'';if(quote)q('#qx').onclick=()=>{quote=null;qpaint()}};

 /* 多选操作栏 */
 const exit=()=>{sel=null;cd.classList.remove('ms');paint()};
 q('.mbar').onclick=e=>{const a=e.target.dataset.a;if(!a)return;
  if(a==='x')return exit();
  if(!sel.size)return toast('请先选择消息');
  if(a==='dl'){[...sel].sort((x,y)=>y-x).forEach(i=>H.splice(i,1));save()}else fav([...sel]);
  exit()};

 /* 发送 / 接收 */
 const receive=async()=>{if(busy)return;busy=1;
  const tmp=document.createElement('div');tmp.className='rc';tmp.textContent=dn()+' 正在输入…';ml.append(tmp);ml.scrollTop=1e9;
  try{H.push({r:'ai',c:await ai(c,ctx()),t:Date.now()})}catch(e){H.push({r:'ai',c:'⚠️ '+e,t:Date.now()})}
  busy=0;delete S.hidden[c.id];save();paint(1)};
 const send=()=>{const v=ta.value.trim();if(!v)return;const m={r:'me',c:v,t:Date.now()};
  if(quote){m.q=quote;quote=null;qpaint()}
  H.push(m);delete S.hidden[c.id];ta.value='';save();paint(1);ta.focus();if(c.auto)receive()};

 /* 功能胶囊：长按左侧按钮依次向上展开，点空白处收起 */
 const caps=()=>{if(cd.querySelector('.caps'))return;
  const bd=document.createElement('div'),w=document.createElement('div');bd.className='bk2';w.className='caps';
  w.innerHTML=CP.map(([t,s,ic,cl],i)=>`<div class="cp ${cl}" data-i="${i}" style="animation-delay:${(3-i)*70}ms">${ICO[ic]}<div class="tt"><b>${esc(t)}</b>${s?`<small>${i===0&&nt()?'On':s}</small>`:''}</div>${DOTS}</div>`).join('');
  cd.append(bd,w);
  const close=()=>{w.querySelectorAll('.cp').forEach(x=>x.classList.add('out'));setTimeout(()=>{bd.remove();w.remove()},260)};
  bd.onclick=close;
  w.querySelectorAll('.cp').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;
   if(i===0){S.night[c.id]=!nt();save();cd.classList.toggle('nt',nt());bgc();x.querySelector('small').textContent=nt()?'On':CP[0][1];return}
   if(i===1){H.push({r:'me',card:1,t:Date.now()});delete S.hidden[c.id];save();paint(1)}
   if(i===2)hearts();
   if(i===3)window.wxWork&&window.wxWork(r,c);
   close()})};

 /* 左侧按钮：单击更多功能 / 长按展开胶囊 */
 const more=()=>pop(lb,[['发送图片','im'],['清空聊天记录','cl','dg']],k=>{
  if(k==='im')pick(v=>{H.push({r:'me',img:v,t:Date.now()});delete S.hidden[c.id];save();paint(1)},720);
  else if(confirm('清空与「'+dn()+'」的全部聊天记录？')){H.length=0;save();paint()}});
 lb.onpointerdown=()=>{lf=0;lt=setTimeout(()=>{lf=1;navigator.vibrate&&navigator.vibrate(12);caps()},450)};
 lb.onpointerup=lb.onpointerleave=lb.onpointercancel=()=>clearTimeout(lt);
 lb.oncontextmenu=e=>e.preventDefault();
 lb.onclick=()=>{if(lf){lf=0;return}more()};

 /* 输入框：聚焦伸展，隐藏表情 / 接收键，显示发送键 */
 ta.onfocus=()=>ib.classList.add('ex');
 ta.onblur=()=>{if(!ta.value)ib.classList.remove('ex')};
 ta.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send()}};
 const sd=q('#sd');sd.onpointerdown=e=>e.preventDefault();sd.onclick=send;
 q('#rv').onclick=receive;
 q('#em').onclick=()=>pop(q('#em'),EM.map(x=>[x,x]),k=>{ta.value+=k;ib.classList.add('ex');ta.focus()},true,'em');

 /* 对方心声 */
 q('#vc').onclick=()=>window.wxVoice(r,c);

 /* 聊天设置页 */
 const cset=()=>{r.style.background='';
  const A=(k,t,v)=>`<div><div class="av" data-p="${k}" style="background-image:url('${v||DEF}')"></div><small>${t}</small><u data-r="${k}">恢复默认</u></div>`;
  r.innerHTML=`<div class="nav"><span id="sb">‹ 返回</span><b>聊天设置</b><span></span></div><div class="body">
  <div class="row" style="display:block;cursor:default"><div class="av3">${A('chatAv','对方（聊天内）',c.chatAv)}${A('myAv','我的（聊天内）',c.myAv)}${A('avatar','列表头像',c.avatar)}</div></div>
  <div class="row" style="display:block;cursor:default"><input id="sn" placeholder="名字" value="${esc(c.name)}"><input id="sr" placeholder="备注名" value="${esc(c.remark||'')}"><input id="ss" placeholder="个性签名" value="${esc(c.sign||'')}"><textarea id="sp" rows="5" placeholder="人设">${esc(c.persona||'')}</textarea></div>
  <label class="row" style="cursor:default"><span style="flex:1">发送后自动回复</span><input type="checkbox" id="sc" ${c.auto?'checked':''} style="width:22px;height:22px;margin:0;box-shadow:none;accent-color:#0a84ff"></label>
  <label class="row" style="cursor:default"><span style="flex:1">夜间模式</span><input type="checkbox" id="sk" ${nt()?'checked':''} style="width:22px;height:22px;margin:0;box-shadow:none;accent-color:#0a84ff"></label></div>`;
  q('#sb').onclick=()=>window.chat(r,'wx',c,back);
  r.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>pick(v=>{c[e.dataset.p]=v;save();cset()},256));
  r.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{delete c[e.dataset.r];save();cset()});
  [['#sn','name'],['#sr','remark'],['#ss','sign'],['#sp','persona']].forEach(([s,k])=>q(s).oninput=e=>{if(k==='name'&&!e.target.value.trim())return;c[k]=e.target.value;save()});
  q('#sc').onchange=e=>{c.auto=e.target.checked;save()};
  q('#sk').onchange=e=>{S.night[c.id]=e.target.checked;save()}};

 q('#bk').onclick=leave;
 q('#mn').onclick=cset;
 paint(1);
};
})();
</script>
<!-- ===== 补丁二：微信 列表/聊天/我的 长按面板、置顶、删除好友、账号修改（粘贴在补丁一之后、</body> 之前） ===== -->
<style>
/* ===== 长按面板 ===== */
.st2{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid #f0f1f4;font-size:16px}

.hero .ac:active{background:rgba(0,0,0,.06)}
</style>

<script>
(()=>{
/* ===== 工具 ===== */
const PIN='M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z';
const tk=s=>{let n=0;for(const ch of String(s||''))n+=/[\u2e80-\u9fff\uff00-\uffef]/.test(ch)?1.5:.3;return Math.round(n)};
const rounds=H=>{let n=0,p='';(H||[]).forEach(m=>{if(m.rc)return;if(m.r==='me'&&p!=='me')n++;p=m.r});return n};
const sheet=(r,html)=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh">${html}</div>`;r.append(o);o.onclick=e=>e.target===o&&o.remove();return o};

/* ===== 微信（覆盖原 wechat 函数） ===== */
window.wechat=function(r){
 r.classList.add('wx');let tab=0;S.pinned=S.pinned||{};
 const T=['Chat','聊天','动态','我的'],TN=['列表','聊天','动态','我的'];
 const q=s=>r.querySelector(s);
 const all=()=>[...S.groups.map(g=>({...g,isGroup:1})),...S.contacts];
 const last=c=>(S.chats['wx'+c.id]||[]).slice(-1)[0];
 const row=(c,sub,rd)=>{const pn=rd&&S.pinned[c.id];
  return `<div class="fr${rd?' rd':''}${pn?' pin':''}" data-id="${c.id}"><div class="av" style="background-image:url('${c.avatar||(c.members?DEFG:DEF)}')"></div><div class="mid"><b>${esc(c.name)}</b><small>${esc(sub)}</small></div><time>${pn?svg(PIN):''}${fmt(last(c)?.t)}</time></div>`};
 const meCard=()=>`<div class="me"><div class="av" id="mav" style="background-image:url('${S.me.avatar||DEF}')"></div><div class="tx"><span class="id" data-m="name" contenteditable>${esc(S.me.name)}</span><span class="sg" data-m="sign" contenteditable>${esc(S.me.sign)}</span></div></div>`;

 /* 头像 / ID / 签名：列表页与我的页共用同一份 S.me */
 const bindMe=B=>{B.querySelector('#mav').onclick=()=>imgSheet(r,v=>{S.me.avatar=v;save();draw()},256);
  B.querySelectorAll('[data-m]').forEach(e=>{e.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();e.blur()}};
   e.onblur=()=>{S.me[e.dataset.m]=e.textContent.trim()||D.me[e.dataset.m];e.textContent=S.me[e.dataset.m];save()}})};

 /* 彻底删除好友 / 群聊 */
 const rmGroup=g=>{S.groups=S.groups.filter(x=>x.id!==g.id);delete S.chats['wx'+g.id];[S.hidden,S.pinned,S.night].forEach(o=>o&&delete o[g.id])};
 const rmFriend=c=>{const id=c.id;
  S.contacts=S.contacts.filter(x=>x.id!==id);
  delete S.chats['wx'+id];delete S.chats['im'+id];
  [S.hidden,S.pinned,S.night].forEach(o=>o&&delete o[id]);
  S.groups.map(g=>({...g,members:g.members.filter(m=>m!==id)})).forEach(g=>{
   const o=S.groups.find(x=>x.id===g.id);o.members=g.members;if(g.members.length<2)rmGroup(g)});
  S.moments.forEach(m=>{m.who=(m.who||[]).filter(x=>x!==id);m.comments=(m.comments||[]).filter(x=>x.n!==c.name)});
  S.favs=(S.favs||[]).filter(f=>f.cid!==id)};
 const confirmDel=c=>modal(r,c.members?'删除群聊':'删除好友',`<p style="color:#8e8e93;line-height:1.6;margin:6px 0">将彻底删除「${esc(c.name)}」${c.members?'':'，包括全部聊天记录、收藏的消息和相关评论'}，此操作无法恢复。</p>`,()=>{c.members?rmGroup(c):rmFriend(c);save();draw()});

 /* 列表长按面板：消息轮数 / Token 估算 / 删除好友 */
 const friendSheet=c=>{
  const ks=c.members?['wx'+c.id]:['wx'+c.id,'im'+c.id];
  const rd=ks.reduce((s,k)=>s+rounds(S.chats[k]),0);
  const tn=(c.members?0:tk(c.persona))+ks.reduce((s,k)=>s+(S.chats[k]||[]).reduce((a,m)=>a+tk(m.c),0),0);
  const o=sheet(r,`<div class="hd"><div class="av" style="background-image:url('${c.avatar||(c.members?DEFG:DEF)}')"></div><b>${esc(c.name)}</b></div><div class="st2"><span>消息</span><b>${rd}</b></div><div class="st2"><span>Token</span><b>${tn.toLocaleString()}</b></div><div class="ac2 dg" id="df">${c.members?'删除群聊':'删除好友'}</div>`);
  o.querySelector('#df').onclick=()=>{o.remove();confirmDel(c)}};

 /* 聊天长按面板：置顶 / 删除当前聊天（仅从聊天列表移除，好友与记录保留） */
 const chatSheet=c=>{
  const pn=!!S.pinned[c.id];
  const o=sheet(r,`<div class="hd"><div class="av" style="background-image:url('${c.avatar||(c.members?DEFG:DEF)}')"></div><b>${esc(c.name)}</b></div><div class="ac2" id="pn">${pn?'取消置顶':'置顶聊天'}</div><div class="ac2 dg" id="dc">删除当前聊天</div>`);
  o.querySelector('#pn').onclick=()=>{pn?delete S.pinned[c.id]:S.pinned[c.id]=Date.now();save();o.remove();draw()};
  o.querySelector('#dc').onclick=()=>{o.remove();modal(r,'删除当前聊天',`<p style="color:#8e8e93;line-height:1.6;margin:6px 0">将「${esc(c.name)}」从聊天列表中移除。<br>好友和聊天记录都会保留，再次发消息后会重新出现。</p>`,()=>{S.hidden[c.id]=1;delete S.pinned[c.id];save();draw()})}};

 /* 会话行：点击进入聊天；长按 mode=1 好友面板，mode=2 聊天面板 */
 const openChat=(B,mode)=>B.querySelectorAll('.fr').forEach(e=>{
  let t,fired;const get=()=>all().find(x=>x.id===e.dataset.id);
  e.onclick=()=>{if(fired){fired=0;return}chat(r,'wx',get(),draw)};
  if(!mode)return;
  const go=()=>{fired=1;navigator.vibrate&&navigator.vibrate(12);(mode===1?friendSheet:chatSheet)(get())};
  e.onpointerdown=()=>{fired=0;t=setTimeout(go,550)};
  e.onpointerup=e.onpointerleave=e.onpointercancel=()=>clearTimeout(t);
  e.oncontextmenu=ev=>{ev.preventDefault();if(!fired){clearTimeout(t);go()}};
 });

 const menu=pl=>{
  pl.onclick=e=>{e.stopPropagation();const old=q('.menu');if(old)return old.remove();
   const m=document.createElement('div');m.className='menu';
   m.innerHTML=[['添加好友',IA],['文件导入',IF],['创建群聊',IG]].map(([n,d],i)=>`<div data-i="${i}">${svg(d)}${n}</div>`).join('');r.append(m);
   m.querySelectorAll('div').forEach(d=>d.onclick=()=>{m.remove();[addFriend,importFile,makeGroup][+d.dataset.i]()});
   setTimeout(()=>r.addEventListener('click',()=>m.remove(),{once:true}))}};
 const addFriend=()=>modal(r,'添加好友','<input id="fn" placeholder="名字"><input id="fs" placeholder="个性签名"><textarea id="fp" rows="3" placeholder="人设（选填）"></textarea>',o=>{
  const name=o.querySelector('#fn').value.trim();if(!name)return false;
  addContact({name,sign:o.querySelector('#fs').value.trim(),persona:o.querySelector('#fp').value.trim()});draw()});
 const importFile=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,.png,.txt,.md';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;try{addContact(await readCard(f));draw()}catch(e){alert('导入失败：'+e)}};i.click()};
 const makeGroup=()=>{
  if(S.contacts.length<2)return alert('至少需要 2 位好友才能创建群聊');
  modal(r,'创建群聊',`<input id="gn" placeholder="群名称（可留空）">${S.contacts.map(c=>`<label class="ck"><input type="checkbox" value="${c.id}">${esc(c.name)}</label>`).join('')}`,o=>{
   const ids=[...o.querySelectorAll('input:checked')].map(x=>x.value);if(ids.length<2){alert('请至少勾选 2 位好友');return false}
   const name=o.querySelector('#gn').value.trim()||ids.map(id=>S.contacts.find(c=>c.id===id).name).join('、').slice(0,14);
   S.groups.push({id:uid(),name,members:ids});save();draw()})};

 /* 动态：帖子渲染、点赞、评论（自评 / AI 好友评论） */
 const find=id=>S.moments.find(m=>m.id===id);
 const post=p=>{const im=p.imgs||[],cm=p.comments||[],n=im.length;
  return `<div class="post"><div class="ph"><div class="av" style="background-image:url('${S.me.avatar||DEF}')"></div><div style="flex:1"><b>${esc(S.me.name)}</b><small>${ptime(p)}${p.vis==='指定好友'?' · 部分好友可见':''}</small></div><em data-dl="${p.id}">删除</em></div>
  ${p.t?`<div class="pt">${esc(p.t)}</div>`:''}
  ${n?`<div class="pi c${n===1?1:n===2||n===4?2:3}">${im.map(s=>`<i style="background-image:url('${s}')"></i>`).join('')}</div>`:''}
  <div class="pf"><button data-lk="${p.id}" class="${p.liked?'lk':''}">${svg(IH)}点赞</button><button data-cm="${p.id}">${svg(IC)}评论</button></div>
  ${p.liked||cm.length?`<div class="cm">${p.liked?`<div>♥ ${esc(S.me.name)}</div>`:''}${cm.map(c=>`<div><b>${esc(c.n)}：</b>${esc(c.c)}</div>`).join('')}</div>`:''}</div>`};
 const feed=()=>{const F=q('.feed');
  F.innerHTML=S.moments.slice().reverse().map(post).join('')||'<p class="empty">还没有动态，点右上角 ⊕ 发一条吧</p>';
  F.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>{const p=find(b.dataset.lk);p.liked=!p.liked;save();feed()});
  F.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>comment(find(b.dataset.cm)));
  F.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{if(confirm('删除这条动态？')){S.moments=S.moments.filter(x=>x.id!==b.dataset.dl);save();feed()}});
 };
 const comment=p=>{
  const o=modal(r,'评论','<textarea id="ct" rows="3" placeholder="写下你的评论…"></textarea><button class="btn g" id="aib" style="width:100%;margin:6px 0">✨ AI 生成好友评论</button><p style="font-size:12px;color:#8e8e93">AI 会根据好友列表中的人设生成评论</p>',o=>{
   const v=o.querySelector('#ct').value.trim();if(!v)return false;
   (p.comments=p.comments||[]).push({n:S.me.name,c:v,t:Date.now()});save();feed()});
  o.querySelector('#aib').onclick=async e=>{
   const btn=e.target,pool=p.vis==='指定好友'?S.contacts.filter(c=>(p.who||[]).includes(c.id)):S.contacts;
   if(!pool.length)return alert('好友列表为空，请先添加好友');
   const ch=pool.slice().sort(()=>Math.random()-.5).slice(0,3);
   btn.textContent='生成中…';btn.disabled=true;
   const qq=`${S.me.name}发了一条朋友圈：「${p.t||'（分享了图片）'}」。请以你的身份写一条简短的朋友圈评论（不超过20字），只输出评论内容。`;
   const res=await Promise.allSettled(ch.map(c=>ai(c,[{r:'me',c:qq}])));
   let err;res.forEach((x,i)=>{if(x.status==='fulfilled')(p.comments=p.comments||[]).push({n:ch[i].name,c:String(x.value).trim().replace(/^["「]|["」]$/g,''),t:Date.now()});else err=x.reason});
   save();
   if(res.every(x=>x.status==='rejected')){btn.textContent='✨ AI 生成好友评论';btn.disabled=false;return alert('生成失败：'+err)}
   o.remove();feed()};
 };

 /* 我的：点击账号弹出修改面板 */
 const editAcc=()=>{
  const o=modal(r,'修改账号','<input id="ai2" placeholder="账号" maxlength="30">',o=>{S.me.account=o.querySelector('#ai2').value.trim()||D.me.account;save();draw()});
  const i=o.querySelector('#ai2');i.value=S.me.account===D.me.account?'':S.me.account;setTimeout(()=>i.focus(),80)};

 const draw=()=>{
  r.classList.remove('sx');
  const head=tab===1
   ?`<div class="nav3"><div class="bb" id="bk"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div><b>聊天</b><div class="dec"><svg viewBox="0 0 24 24"><path d="${IM}"/></svg></div></div>`
   :tab>=2?'':`<div class="nav2"><h1>${T[tab]}</h1><div class="plus" id="pl">${PLUS}</div></div>`;
  r.innerHTML=`${head}<div class="pg" id="pg"></div><div class="tb">${TN.map((n,i)=>`<b class="${i===tab?'on':''}" data-i="${i}">${svg(TI[i])}${n}</b>`).join('')}</div>`;
  r.querySelectorAll('.tb b').forEach(b=>b.onclick=()=>{tab=+b.dataset.i;draw()});
  const B=q('#pg'),pl=q('#pl');
  if(tab===0){
   B.innerHTML=meCard()+`<div class="fl">${all().map(c=>row(c,c.members?`群聊 · ${c.members.length} 人`:c.sign||'')).join('')||'<p class="empty">点击右上角 + 添加好友</p>'}</div>`;
   bindMe(B);openChat(B,1);menu(pl)}
  if(tab===1){
   q('#bk').onclick=closeApp;
   const l=all().filter(c=>!S.hidden[c.id]).sort((a,b)=>(!!S.pinned[b.id]-!!S.pinned[a.id])||((last(b)?.t||0)-(last(a)?.t||0)));
   B.innerHTML=`<div class="fl">${l.map(c=>row(c,last(c)?.c||'',1)).join('')||'<p class="empty">暂无会话</p>'}</div>`;
   openChat(B,2)}
  if(tab===2){
   B.innerHTML=`<div class="top"><div class="who"><div class="av" style="background-image:url('${S.me.avatar||DEF}')"></div><b>${esc(S.me.name)}</b><div class="plus" id="np">${CIRC}</div></div>
    <div class="strip"><div class="sq add">${svg('M12 5v14M5 12h14')}</div>${[0,1,2].map(i=>`<div class="sq" data-s="${i}" style="${S.strip[i]?`background-image:url('${S.strip[i]}')`:''}">${S.strip[i]?'':svg(IP)}</div>`).join('')}</div></div>
    <div class="hr"></div><div class="feed"></div>`;
   q('#np').onclick=()=>postPage(r,draw);
   B.querySelectorAll('[data-s]').forEach(s=>s.onclick=()=>pick(v=>{S.strip[+s.dataset.s]=v;save();s.style.backgroundImage=`url('${v}')`;s.innerHTML=''},400));
   feed()}
  if(tab===3){
   B.innerHTML=`<div class="scr"><div class="hero"><div class="av" id="mav" style="background-image:url('${S.me.avatar||DEF}')"></div><div class="id" data-m="name" contenteditable>${esc(S.me.name)}</div><div class="ac" id="acc">${esc(S.me.account)}</div></div>
    <div class="mn">${MN.map(([n,d],i)=>`<div class="mi" data-i="${i}">${svg(d)}<span>${n}</span>${CHV}</div>`).join('')}</div></div>`;
   bindMe(B);q('#acc').onclick=editAcc;
   B.querySelectorAll('.mi').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(i===4)openApp('settings');else if(i===0&&window.wxWallet)window.wxWallet(r,draw);else if(i===1&&window.wxEmoji)window.wxEmoji(r,draw);else if(i===2&&window.wxFav)window.wxFav(r,draw);else if(i===3&&window.wxChain)window.wxChain(r,draw);else toast(`「${MN[i][0]}」敬请期待`)})}
 };draw();
};
})();
</script>

.op{padding:15px 4px;font-size:16px;text-align:center;cursor:pointer;border-radius:12px}
.op:active{background:#f4f5f7}
.tip{color:#8e8e93;line-height:1.6;margin:6px 0}

/* ===== 美化 Tab ===== */
.av3b{display:flex;justify-content:space-around;text-align:center}
.av3b .av2{margin:0 auto 6px}
.av3b small{display:block;font-size:12px;color:#8e8e93}
.av3b u{font-size:11px;color:#0a84ff;text-decoration:none;cursor:pointer}
.bgp{height:110px;border-radius:14px;background:#e9eaee center/cover;display:grid;place-items:center;color:#8e8e93;font-size:13px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.cg label{font-size:13px;color:#6e6e73}
.cc input[type=color]{width:100%;height:38px;padding:2px;border-radius:10px;background:#f2f2f7;box-shadow:none;margin:4px 0}
.rg2{display:flex;align-items:center;gap:10px;margin:8px 0}
.rg2 span{width:36px;font-size:14px}.rg2 input{margin:0;flex:1}
.rg2 em{width:28px;text-align:right;font-style:normal;color:#8e8e93}
textarea[data-z=css]{font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ===== 查找聊天记录（覆盖层） ===== */
.sp{position:absolute;inset:0;z-index:45;background:#f2f2f7;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:sx .25s}
.sr{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;line-height:1.5;word-break:break-word}
.sr small{color:#8e8e93;display:block;margin-bottom:4px}
.sr mark{background:#fff3a3;border-radius:3px}

/* ===== 聊天内的特殊消息：黑名单! / 好友验证 / 翻译 / 名片 / 搜索定位 ===== */
.bl{flex:none;width:20px;height:20px;border-radius:50%;background:#ff3b30;color:#fff;font-style:normal;font-weight:700;font-size:13px;display:grid;place-items:center;align-self:center}
.fq{font-size:11px;opacity:.6;margin-bottom:4px}
.fa{display:inline-block;margin-left:10px;padding:2px 12px;border-radius:12px;background:var(--bm);color:var(--bmt);font-size:13px;cursor:pointer}
.fa.off{opacity:.45;cursor:default}
.tr{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed currentColor;opacity:.75;font-size:14px}
.tr.on{display:block}
.ncd{display:flex;gap:10px;align-items:center;min-width:170px}
.ncd i{width:40px;height:40px;border-radius:12px;background:#ddd center/cover;flex:none}
.ncd small{display:block;opacity:.6;font-size:11px;margin-top:2px}
.nct{font-size:11px;opacity:.5;margin-top:8px;padding-top:6px;border-top:1px solid currentColor}
.rw.hl .mb{animation:hl 1.8s}
@keyframes hl{0%,60%{box-shadow:0 0 0 3px #0a84ff}100%{box-shadow:0 0 0 3px transparent}}
</style>

<script>
(()=>{
/* ===== 工具 ===== */
const CH2='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const sheet=(r,html)=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh">${html}</div>`;r.append(o);o.onclick=e=>e.target===o&&o.remove();return o};
const inWin=(m,a,b)=>a&&m.t>=a&&(!b||m.t<b);
const fmtMin=m=>m<60?m+' 分钟':(m/60)+' 小时';
const ctxOf=H=>H.filter(m=>!m.rc).map(m=>({r:m.r,c:(m.q?`（引用「${m.q.c}」）`:'')+(m.img?'[图片]':m.card?'[发来一起听歌的邀请]':m.c)}));
let cur=null;

/* ===== AI 核心：读取该聊天的全部设置（覆盖原 ai 函数） ===== */
window.ai=async function(c,hist){
 const a=S.api;if(!a.url||!a.key)throw'请先在「设置」中配置 API';
 const sel=c.wbSel&&c.wbSel.length?new Set(c.wbSel):null;
 const wb=S.wb.map(b=>{const its=b.items.filter((_,i)=>!sel||sel.has(b.id+':'+i));return its.length?`【${b.name}】\n`+its.map(i=>`${i.t}：${i.c}`).join('\n'):''}).filter(Boolean).join('\n\n');
 const rules=[];
 if(c.remote)rules.push('当前是异地线上聊天：严禁任何心理、动作、神态描写，禁止用括号()（）写动作和心理，禁止使用引号""“”，只输出纯语言文本（颜文字可以正常使用，要完整输出）。');
 if(c.trans)rules.push('如果你使用外语（非中文）回复，请在回复后另起一行，以「【译】」开头附上中文翻译；用中文回复时不要加。');
 if(c.moment)rules.push('只有出现重要节点（重大事件、明显的情绪变化、特殊的日子）时，才在回复末尾另起一行输出 [[动态:你想发的朋友圈内容]]；绝大多数回复不要输出这个标记。');
  if(c.black)rules.push('用户已将你拉黑：你会发现自己被拉黑了但照常发消息，条数和语气都和平时一样，按消息发送规则分多条发，只是你发的每条消息前面会带红色感叹号。可以流露无奈或想解释，但保持角色。');
 if(c.fdel)rules.push('对方已将你删除好友。请只发送一条添加好友的验证申请（一句话，符合人设），不要写其他内容。');
 const sys=`你是${c.name}（个性签名：${c.sign||'无'}）。人设：${c.persona||'无'}\n用户在这个聊天里的名字：${c.myName||S.me.name}；你对用户的称呼：${c.myRemark||'（无特别称呼）'}；用户设定：${c.myPersona||'无'}\n世界观设定：\n${wb||'无'}\n请用手机聊天口吻简短回复，保持角色，不要出戏。${rules.length?'\n'+rules.join('\n'):''}`;
 const full=[...(c.arch||[]),...hist].slice(-Math.max(1,+c.mem||200));
 const res=await fetch(a.url.replace(/\/+$/,'')+'/chat/completions',{method:'POST',
  headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.key},
  body:JSON.stringify({model:a.model||'gpt-4o-mini',messages:[{role:'system',content:sys},...full.map(m=>({role:m.r==='me'?'user':'assistant',content:m.c}))]})});
 const j=await res.json();if(!res.ok)throw j.error?.message||res.status;
 let t=String(j.choices[0].message.content||'');
 const mm=t.match(/\[\[动态[:：]([\s\S]*?)\]\]/);
 if(mm){t=t.replace(mm[0],'').trim();autoPost(c,mm[1].trim())}
 if(c.remote)t=t.replace(/[（(][^）)]*[）)]/g,m=>window.isAct&&window.isAct(m)?'':m).replace(/["“”]/g,'').trim();
 return t;
};

/* ===== AI 自主发动态（15 分钟冷却） ===== */
const autoPost=(c,text)=>{
 if(!c.moment||!text||Date.now()-(c.lastMo||0)<9e5)return;
 c.lastMo=Date.now();
 S.moments.push({id:uid(),t:text,imgs:[],vis:'公开',who:[],ts:Date.now(),liked:false,comments:[],by:c.id});
 save();toast((c.remark||c.name)+' 发了一条动态');
};

/* ===== 聊天内特殊消息装饰 ===== */
const decor=(r,c,back)=>{
 const ml=r.querySelector('#ml');if(!ml)return;const H=S.chats['wx'+c.id]||[];
 ml.querySelectorAll('.rw:not([data-z])').forEach(w=>{
  w.dataset.z=1;const m=H[+w.dataset.i],b=w.querySelector('.mb'),mr=w.querySelector('.mr');if(!m||!b)return;
  if(m.cd2){const n=m.cd2;b.innerHTML=`<div class="ncd"><i style="background-image:url('${n.avatar||DEF}')"></i><div><b>${esc(n.name)}</b><small>${esc(n.sign||'')}</small></div></div><div class="nct">个人名片</div>`;return}
  if(m.r!=='ai'||!m.c)return;
  if(inWin(m,c.blAt,c.blEnd)){const i=document.createElement('i');i.className='bl';i.textContent='!';b.after(i)}
  if(inWin(m,c.fdAt,c.fdEnd)){
   b.innerHTML=`<div class="fq">好友验证申请</div>${esc(m.c)}<span class="fa${c.fdEnd?' off':''}">${c.fdEnd?'已通过':'通过'}</span>`;
   const f=b.querySelector('.fa:not(.off)');
   if(f)f.onclick=e=>{e.stopPropagation();c.fdel=false;c.fdEnd=Date.now();save();window.chat(r,'wx',c,back);toast('已通过好友验证')};
   return}
  const p=m.c.indexOf('【译】');
  if(p>0){b.innerHTML=`${esc(m.c.slice(0,p).trim())}<div class="tr">${esc(m.c.slice(p+3).trim())}</div>`;
   b.onclick=()=>{if(!r.querySelector('.po'))b.querySelector('.tr').classList.toggle('on')}}
 });
};

/* ===== 单独美化：背景 / 气泡颜色 / 字号 / 圆角 / 自定义 CSS ===== */
const applyBz=(r,c)=>{
 const z=c.bz||{};r.querySelectorAll('style[data-cz]').forEach(s=>s.remove());
 const v=[['ob','--bo'],['ot','--bot'],['mb','--bm'],['mt','--bmt']].filter(([k])=>z[k]).map(([k,n])=>`${n}:${z[k]}`).join(';');
 const css=(v?`#cd:not(.nt){${v}}`:'')+(z.fs?`#cd .mb{font-size:${z.fs}px}`:'')+(z.rd?`#cd .mb{border-radius:${z.rd}px}`:'')+(z.bg?`#cd .ml{background:url("${z.bg}") center/cover}`:'')+(z.css||'');
 if(!css)return;const s=document.createElement('style');s.dataset.cz=1;s.textContent=css;r.append(s);
};

/* ===== 接管聊天界面：把右上角 ≡ 指向新的设置页 ===== */
const prev=window.chat;
window.chat=function(r,st,c,back){
 prev(r,st,c,back);
 if(st!=='wx'||c.members)return;
 const mn=r.querySelector('#mn'),ml=r.querySelector('#ml');if(!mn||!ml)return;
 cur={r,c,back};
 const bk=r.querySelector('#bk');if(bk)bk.addEventListener('click',()=>{cur=null});
 mn.onclick=()=>{cur=null;settingsPage(r,c,back)};
 applyBz(r,c);decor(r,c,back);
 new MutationObserver(()=>decor(r,c,back)).observe(ml,{childList:true});
};

/* ===== 聊天设置页 ===== */
function settingsPage(r,c,back){
 r.style.background='';r.classList.remove('sx');void r.offsetWidth;r.classList.add('sx');
 let tab='s',dirty=0;
 const d={avatar:c.avatar||'',name:c.name,remark:c.remark||'',sign:c.sign||'',persona:c.persona||'',myAv:c.myAv||'',chatAv:c.chatAv||'',myName:c.myName||'',myRemark:c.myRemark||'',myPersona:c.myPersona||'',mem:c.mem||200,trans:!!c.trans,moment:!!c.moment,pro:c.pro||0,remote:!!c.remote,wbSel:[...(c.wbSel||[])],stk:[...(c.stk||[])],bz:{...(c.bz||{})}};
 const q=s=>r.querySelector(s);
 const H=()=>S.chats['wx'+c.id]||(S.chats['wx'+c.id]=[]);
 const toChat=()=>window.chat(r,'wx',c,back);
 const goBack=()=>{if(dirty&&!confirm('有未保存的修改，确定放弃吗？'))return;toChat()};
 const F=(l,k,ph)=>`<div class="f2"><span>${l}</span><input data-k="${k}" placeholder="${ph}" value="${esc(d[k])}"></div>`;
 const LR=(id,l,v)=>`<div class="lr" id="${id}"><span>${l}</span><em>${v||''}</em>${CH2}</div>`;
 const DG=(a,l)=>`<div class="lr dg" data-a="${a}"><span>${l}</span></div>`;
 const TG=(k,l,ds,on,sub)=>`<div class="tg"><div><b>${l}</b><small>${ds}</small>${sub||''}</div><label class="sw"><input type="checkbox" data-t="${k}" ${on?'checked':''}><i></i></label></div>`;

 /* 【设定】 */
 const setView=()=>`
 <div class="cc"><div class="pr"><div class="av2" id="a1" style="background-image:url('${d.avatar||DEF}')"></div><div class="fs">${F('名字','name','对方名字')}${F('备注名','remark','输入对方备注')}</div></div></div>
 <div class="cc"><input data-k="sign" placeholder="这里填对方个签" value="${esc(d.sign)}"><textarea data-k="persona" rows="7" placeholder="这里是人物设定">${esc(d.persona)}</textarea></div>
 <div class="cc np">${LR('rwb','关联世界书',d.wbSel.length?`已选 ${d.wbSel.length} 项`:'全部')}${LR('rsk','关联表情包',d.stk.length?`已选 ${d.stk.length} 组`:'未选择')}</div>
 <div class="cc"><div class="pr"><div class="av2" id="a2" style="background-image:url('${d.myAv||DEF}')"></div><div class="fs">${F('我的名字','myName','我在该聊天中的名称')}${F('备注名','myRemark','对方对我的称呼')}</div></div><textarea data-k="myPersona" rows="5" placeholder="我的设定">${esc(d.myPersona)}</textarea></div>
 <div class="cc np"><div class="tg"><div><b>记忆条数</b><small>AI 记忆的上下文条数</small></div><input class="nm" type="number" min="1" inputmode="numeric" data-k="mem" value="${esc(d.mem)}"></div>
 ${TG('trans','翻译模式','开启双语聊天模式',d.trans)}
 ${TG('moment','朋友圈','开启后角色会主动发朋友圈',d.moment)}
 ${TG('pro','主动发消息','开启后角色会主动发消息',d.pro>0,d.pro?`<small class="sub">每 ${fmtMin(d.pro)}发一次</small>`:'')}
 ${TG('remote','异地模式','增强线上聊天',d.remote)}</div>
 <div class="cc np">${LR('rrec','把 Ta 推荐给朋友')}${LR('rsch','查找聊天记录')}</div>
 <div class="cc np">${DG('clr','清空聊天记录')}${DG('clra','清空聊天记录与记忆')}${DG('blk',c.black?'移出黑名单':'加入黑名单')}${DG('fdl',c.fdel?'恢复好友（当前已被删除）':'删除好友')}</div>`;

 /* 【美化】 */
 const beView=()=>{const z=d.bz;return `
 <div class="cc"><h5>聊天内头像（与好友列表头像互不影响）</h5><div class="av3b"><div><div class="av2" data-p="chatAv" style="background-image:url('${d.chatAv||DEF}')"></div><small>对方</small><u data-r="chatAv">恢复默认</u></div><div><div class="av2" data-p="myAv" style="background-image:url('${d.myAv||DEF}')"></div><small>我的</small><u data-r="myAv">恢复默认</u></div></div></div>
 <div class="cc"><h5>聊天背景</h5><div class="bgp" style="${z.bg?`background-image:url('${z.bg}')`:''}">${z.bg?'':'默认'}</div><div style="margin-top:8px"><button class="btn" id="bgs">选择图片</button><button class="btn g" id="bgr">恢复默认</button></div></div>
 <div class="cc"><h5>气泡颜色</h5><div class="cg"><label>对方气泡<input type="color" data-z="ob" value="${z.ob||'#ffffff'}"></label><label>对方文字<input type="color" data-z="ot" value="${z.ot||'#111111'}"></label><label>我方气泡<input type="color" data-z="mb" value="${z.mb||'#111111'}"></label><label>我方文字<input type="color" data-z="mt" value="${z.mt||'#ffffff'}"></label></div><button class="btn g" id="cr">恢复默认颜色</button></div>
 <div class="cc"><h5>字号与圆角</h5><div class="rg2"><span>字号</span><input type="range" min="13" max="20" data-z="fs" value="${z.fs||15}"><em>${z.fs||15}</em></div><div class="rg2"><span>圆角</span><input type="range" min="4" max="24" data-z="rd" value="${z.rd||14}"><em>${z.rd||14}</em></div></div>
 <div class="cc"><h5>自定义 CSS（仅当前聊天生效，选择器以 #cd 开头）</h5><textarea data-z="css" rows="6" spellcheck="false" placeholder="#cd .mb{box-shadow:0 2px 8px rgba(0,0,0,.1)}">${esc(z.css||'')}</textarea></div>`};

 /* 弹层：主动发消息间隔 / 世界书 / 表情包 / 推荐名片 */
 const proSheet=()=>{
  const o=sheet(r,`<h3>主动发消息间隔</h3>${[5,10,30,60,120].map(m=>`<div class="op" data-m="${m}">${fmtMin(m)}</div>`).join('')}<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><input id="cm" type="number" min="1" placeholder="自定义（分钟）" inputmode="numeric" style="margin:0"><button class="btn" id="cok" style="margin:0;white-space:nowrap">确定</button></div>`);
  const set=m=>{d.pro=m;dirty=1;o.remove();view()};
  o.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>set(+e.dataset.m));
  o.querySelector('#cok').onclick=()=>{const v=parseInt(o.querySelector('#cm').value);if(v>0)set(v)};
  o.addEventListener('click',e=>{if(e.target===o)view()})};
 const ckrRow=(v,on,t)=>`<div class="ckr${on?' on':''}" data-v="${esc(v)}"><i></i><span>${esc(t)}</span></div>`;
const ckrBind=o=>{o.querySelectorAll('.ckr').forEach(e=>e.onclick=()=>e.classList.toggle('on'));return o};
const wbSheet=()=>ckrBind(modal(r,'关联世界书',(S.wb.length?S.wb.map(b=>`<h4>📁 ${esc(b.name)}</h4>${b.items.map((it,i)=>ckrRow(b.id+':'+i,d.wbSel.includes(b.id+':'+i),it.t||'（未命名条目）')).join('')||'<p class="tip">这本世界书还没有条目</p>'}`).join(''):'<p class="tip">还没有世界书，请先到「世界书」应用里创建。</p>')+'<p class="tip" style="font-size:12px">勾选使用世界书条目</p>',o=>{d.wbSel=[...o.querySelectorAll('.ckr.on')].map(x=>x.dataset.v);dirty=1;view()}));
const skSheet=()=>{const G=(S.sk5&&S.sk5.groups)||[];ckrBind(modal(r,'关联表情包',G.length?G.map(g=>ckrRow(g.id,d.stk.includes(g.id),g.name)).join('')+'<p class="tip" style="font-size:12px">勾选的分组里的表情包，对方才会使用；一个都不勾，对方就不使用表情包。</p>':'<p class="tip">还没有表情包。先在聊天里点笑脸键，用右上角齿轮添加表情包。</p>',o=>{d.stk=[...o.querySelectorAll('.ckr.on')].map(x=>x.dataset.v);dirty=1;view()}))};
 const recSheet=()=>{
  const L=S.contacts.filter(x=>x.id!==c.id);
  const o=sheet(r,`<h3>把 Ta 推荐给朋友</h3>${L.map(x=>`<div class="op" data-id="${x.id}">${esc(x.remark||x.name)}</div>`).join('')||'<p class="tip">还没有其他好友</p>'}`);
  o.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{
   const t=S.contacts.find(x=>x.id===e.dataset.id),k='wx'+t.id;
   (S.chats[k]=S.chats[k]||[]).push({r:'me',c:'[名片] '+c.name,cd2:{id:c.id,name:c.name,avatar:c.avatar||'',sign:c.sign||''},t:Date.now()});
   delete S.hidden[t.id];save();o.remove();toast('已把「'+c.name+'」推荐给 '+t.name)})};

 /* 查找聊天记录：点结果跳回聊天并定位高亮 */
 const searchPage=()=>{
  const o=document.createElement('div');o.className='sp';
  o.innerHTML=`<div class="nav"><span class="bkb" id="x1">${svg('M15 5l-7 7 7 7')}返回</span><b style="font-size:19px">查找聊天记录</b><span style="min-width:70px"></span></div><div class="body"><input id="kw" placeholder="输入关键词"><div id="res"></div></div>`;
  r.append(o);o.querySelector('#x1').onclick=()=>o.remove();
  const kw=o.querySelector('#kw'),res=o.querySelector('#res');
  kw.oninput=()=>{
   const k=kw.value.trim();if(!k){res.innerHTML='';return}
   const re=new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),lk=k.toLowerCase();
   const L=H().map((m,i)=>[m,i]).filter(([m])=>!m.rc&&m.c&&String(m.c).toLowerCase().includes(lk)).slice(-100).reverse();
   res.innerHTML=L.map(([m,i])=>{
    const raw=String(m.c),p=raw.toLowerCase().indexOf(lk),s=raw.slice(Math.max(0,p-12),p+k.length+30);
    const tm=m.t?new Date(m.t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'';
    return `<div class="sr" data-i="${i}"><small>${m.r==='me'?esc(d.myName||S.me.name):esc(d.remark||d.name)} · ${tm}</small>${s.split(re).map((t,j)=>j%2?`<mark>${esc(t)}</mark>`:esc(t)).join('')}</div>`}).join('')||'<p class="empty">没有找到相关记录</p>';
   res.querySelectorAll('.sr').forEach(e=>e.onclick=()=>{
    if(dirty&&!confirm('有未保存的修改，确定离开吗？'))return;
    const i=e.dataset.i;toChat();
    setTimeout(()=>{const w=r.querySelector(`.rw[data-i="${i}"]`);if(w){w.scrollIntoView({block:'center'});w.classList.add('hl');setTimeout(()=>w.classList.remove('hl'),1900)}},60)})};
  setTimeout(()=>kw.focus(),80)};

 /* 危险操作区（立即生效） */
 const arc=()=>{c.arch=[...(c.arch||[]),...H().filter(m=>!m.rc).map(m=>({r:m.r,c:m.img?'[图片]':String(m.c||'')}))].slice(-600)};
 const act={

/* ===== 角色生图：AI 给出画面描述 → 拼上角色提示词 → 调用生图 API → 图片进入聊天流 ===== */

/* ===== 导入主题：txt / docx（docx 用浏览器自带解压读取） ===== */
const docxText=async f=>{
 if(typeof DecompressionStream==='undefined')throw'当前浏览器不支持 docx 导入，请改用 txt';
 const b=new Uint8Array(await f.arrayBuffer()),dv=new DataView(b.buffer);
 let e=b.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw'不是有效的 docx 文件';
 let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);
 for(let i=0;i<n;i++){
  const cm=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(b.slice(p+46,p+46+nl));
  if(name==='word/document.xml'){
   const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=b.slice(st,st+cs);
   const xml=cm===0?new TextDecoder().decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
   return xml.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<w:br\/>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  }
  p+=46+nl+xl+cl;
 }
 throw'没有找到文档内容';
};

<script>
(()=>{

 ['regen','重回','M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5'],

   L.slice(0,3).forEach(x=>(c.mems=c.mems||[]).push({id:uid(),t:x,ts:Date.now()}));
   c.sumAt=(L.length||/^\s*无/.test(raw))?n:Math.max(0,n-10);save();
 }catch(e){}
 sumBusy[c.id]=0};

 const o=sheet(r,`<h3>发送图片</h3><div class="op" id="al">从相册选择</div><div class="op" id="ca">拍照</div><div style="display:flex;gap:8px;margin-top:6px"><input id="au" placeholder="或粘贴图片 URL" style="margin:0"><button class="btn" id="ao" style="margin:0;white-space:nowrap">发送</button></div>`);

/* 语音通话 / 视频通话 / 线下见面：同一套全屏场景，规则不同 */

function scene(r,c,mode){
 const off=mode==='off',title=SM[mode],nm=c.remark||c.name;

 ${mode==='video'?`<div class="scv" style="background-image:url('${c.avatar||DEF}')"><p></p></div>`:''}

 const hist=()=>[...ctxBase(c,off?10:20),...T.map(m=>({r:m.r,c:(m.sc?`（${m.sc}）`:'')+m.c}))];
 const send=async()=>{
  const v=inp.value.trim();if(!v||busy)return;inp.value='';
  T.push({r:'me',c:v,t:Date.now()});busy=1;draw();
  const tp=document.createElement('div');tp.className='sl o';tp.textContent='…';L.append(tp);L.scrollTop=1e9;

   const t=await window.ai(c,hist(),mode),m={r:'ai',c:t,t:Date.now()};

   T.push(m);
  }catch(e){T.push({r:'ai',c:'⚠️ '+e})}
  busy=0;if(off)save();draw()};
 const close=()=>{
  clearInterval(iv);
  const lines=T.slice(from).filter(m=>!String(m.c).startsWith('⚠️'));
  if(lines.length)c.arch=[...(c.arch||[]),...lines.map(m=>({r:m.r,c:`（${title}中）`+(m.sc?`（${m.sc}）`:'')+m.c}))].slice(-600);
  const H=S.chats['wx'+c.id]=S.chats['wx'+c.id]||[];
  if(off?lines.length:(sec>0||lines.length)){H.push({r:'me',c:off?`【线下】线下见面 ${lines.length}条`:`【通话】${title} ${p2(sec/60|0)}:${p2(sec%60)}`,t:Date.now()});delete S.hidden[c.id]}
  save();o.remove();refresh5(c)};
 inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send()}};
 o.querySelector('.sn').onclick=send;o.querySelector('#sx').onclick=close;
 const hg=o.querySelector('.hg');if(hg)hg.onclick=close;
 draw();setTimeout(()=>inp.focus(),300)}

const A={
 regen:(r,c)=>{

<script>
(()=>{
/* ===== 工具 ===== */
const sheet=(r,html)=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh">${html}</div>`;r.append(o);o.onclick=e=>e.target===o&&o.remove();return o};
const shrinkA=(src,max,cb)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,im.width*k);cv.height=Math.max(1,im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/webp',.85))};im.src=src};

/* ===== 全局表情库：所有聊天共用（S.sk5），并把旧版每个聊天各自的表情库合并进来 ===== */

S.contacts.forEach(c=>{

 c.sk5.groups.forEach(g=>{let x=G.groups.find(y=>y.name===g.name);if(!x){x={id:g.id,name:g.name};G.groups.push(x)}gm[g.id]=x.id});
 c.sk5.items.forEach(i=>G.items.push({...i,gid:gm[i.gid]||i.gid}));
 delete c.sk5;save();
});

/* ===== AI 只使用「关联表情包」里勾选分组的表情包，没勾选就不用 ===== */

  :'\n【表情包】你没有可用的表情包，不要发送表情包。');
 return ai5(c,hist,mode).finally(()=>{c.persona=p});
};

/* ===== 聊天内：表情包渲染、头像对齐、去气泡 ===== */
const decor6=(r,c)=>{

const resolveG=o=>{
 const L=lib(),v=o.querySelector('#sg').value;if(v!=='__new')return v;

 const pv=o.querySelector('#pv5'),set=v=>{src=v;pv.style.backgroundImage=`url("${v}")`;pv.textContent=''};
 o.querySelector('#sa').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(f)shrinkA(URL.createObjectURL(f),240,set)};i.click()};
 o.querySelector('#su').oninput=e=>{const v=e.target.value.trim();if(/^(https?:|data:image)/.test(v))set(v)};
 gsel(o)};
const addBatch=(r,sel,done)=>{
 const o=modal(r,'批量添加表情包',`<textarea id="bt" rows="6" placeholder="每行一个：表情包名字 图片链接&#10;例如：开心 https://example.com/a.png"></textarea><button class="btn g" id="bf" style="margin:0 0 6px">导入文件（txt / csv）</button>${GSEL(sel)}`,o=>{
  const rows=o.querySelector('#bt').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),its=rows.map(parseLine).filter(Boolean);

  const gid=resolveG(o);its.forEach(x=>lib().items.push({id:uid(),name:x.name,src:x.src,gid}));save();
  toast(`已导入 ${its.length} 个${rows.length>its.length?`，${rows.length-its.length} 行无法识别`:''}`);done(gid)});

 gsel(o)};

/* ===== 接管聊天界面 ===== */

window.chat=function(r,st,c,back){
